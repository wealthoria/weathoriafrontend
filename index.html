  <!-- =====================================================
       APPLICATION LOADER
       ===================================================== -->

  <script>

    (function () {

      "use strict";


      const path =
        window.location.pathname || "/";


      console.log(
        "[Wealthoria] Current path:",
        path
      );


      /* =====================================================
         LOAD JSX FILE
         ===================================================== */

      async function loadJSX(src) {

        console.log(
          "[Wealthoria] Loading:",
          src
        );


        const response =
          await fetch(
            src,
            {
              cache: "no-cache"
            }
          );


        if (!response.ok) {

          throw new Error(
            "Failed to load " +
            src +
            " (" +
            response.status +
            ")"
          );

        }


        const source =
          await response.text();


        const transformed =
          Babel.transform(
            source,
            {
              presets: [
                "react",
                "env"
              ]
            }
          );


        const script =
          document.createElement(
            "script"
          );


        script.type =
          "text/javascript";


        script.text =
          transformed.code;


        document.body.appendChild(
          script
        );


        console.log(
          "[Wealthoria] Loaded:",
          src
        );

      }


      /* =====================================================
         LOAD NORMAL SCRIPT
         ===================================================== */

      function loadScript(src) {

        return new Promise(
          function (resolve, reject) {

            const existing =
              document.querySelector(
                'script[src="' +
                src +
                '"]'
              );


            if (existing) {

              resolve();

              return;

            }


            const script =
              document.createElement(
                "script"
              );


            script.src =
              src;


            script.onload =
              function () {

                console.log(
                  "[Wealthoria] Loaded:",
                  src
                );

                resolve();

              };


            script.onerror =
              function () {

                reject(
                  new Error(
                    "Failed to load " +
                    src
                  )
                );

              };


            document.head.appendChild(
              script
            );

          }
        );

      }


      /* =====================================================
         LOAD CSS
         ===================================================== */

      function loadCSS(href) {

        if (
          document.querySelector(
            'link[href="' +
            href +
            '"]'
          )
        ) {

          return;

        }


        const link =
          document.createElement(
            "link"
          );


        link.rel =
          "stylesheet";


        link.href =
          href;


        document.head.appendChild(
          link
        );

      }


      /* =====================================================
         PUBLIC WEBSITE
         ===================================================== */

      async function loadPublic() {

        /*
         * GSAP is only required by the public site.
         */

        await loadScript(
          "https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"
        );

        await loadScript(
          "https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"
        );


        await loadJSX(
          "/app/content.jsx?v=4"
        );

        await loadJSX(
          "/app/ui.jsx?v=4"
        );

        await loadJSX(
          "/app/sections-a.jsx?v=4"
        );

        await loadJSX(
          "/app/sections-b.jsx?v=4"
        );

        await loadJSX(
          "/app/calculators.jsx?v=4"
        );

        await loadJSX(
          "/app/sections-c.jsx?v=4"
        );

        await loadJSX(
          "/app/sections-d.jsx?v=4"
        );

        await loadJSX(
          "/app/anim.jsx?v=4"
        );

        /*
         * Public app.jsx contains the public React mount.
         * It must be LAST.
         */

        await loadJSX(
          "/app/app.jsx?v=4"
        );

      }


      /* =====================================================
         MEMBER PORTAL
         ===================================================== */

      async function loadMembers() {

        console.log(
          "[Wealthoria] Preparing Members Portal"
        );


        /*
         * Members CSS.
         */

        loadCSS(
          "/members/portal.css?v=4"
        );


        /*
         * Members require Firebase Auth.
         */

        await loadScript(
          "https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"
        );


        window.auth =
          firebase.auth();


        /*
         * Shared content.
         */

        await loadJSX(
          "/app/content.jsx?v=4"
        );


        /*
         * Member components.
         */

        await loadJSX(
          "/members/login.jsx?v=4"
        );

        await loadJSX(
          "/members/ForgotPassword.jsx?v=4"
        );

        await loadJSX(
          "/members/CourseVideos.jsx?v=4"
        );

        await loadJSX(
          "/members/Newsletter.jsx?v=4"
        );

        await loadJSX(
          "/members/MemberHistoryPurchase.jsx?v=4"
        );

        await loadJSX(
          "/members/SeminarRegistrations.jsx?v=4"
        );

        await loadJSX(
          "/members/WeeklyRoundup.jsx?v=4"
        );

        await loadJSX(
          "/members/dashboard.jsx?v=4"
        );

        await loadJSX(
          "/members/settings.jsx?v=4"
        );

        await loadJSX(
          "/members/subscription.jsx?v=4"
        );


        /*
         * Member router.
         *
         * NOTE:
         * /members/app.jsx only exports
         * window.MembersRouter.
         */

        await loadJSX(
          "/members/app.jsx?v=4"
        );


        /*
         * Mount the member router here.
         */

        if (
          typeof window.MembersRouter !==
          "function"
        ) {

          throw new Error(
            "MembersRouter was not loaded."
          );

        }


        const rootElement =
          document.getElementById(
            "root"
          );


        if (!rootElement) {

          throw new Error(
            "#root element was not found."
          );

        }


        const root =
          ReactDOM.createRoot(
            rootElement
          );


        root.render(
          React.createElement(
            window.MembersRouter
          )
        );


        console.log(
          "[Wealthoria] Members Portal mounted"
        );

      }


      /* =====================================================
         ADMIN PORTAL
         ===================================================== */

      function openAdmin() {

        console.log(
          "[Wealthoria] Opening Admin Portal"
        );


        window.location.href =
          "/Admin%20Portal.html#/admin/login";

      }


      /* =====================================================
         REMOVE LOADING
         ===================================================== */

      function removeLoader() {

        const loader =
          document.getElementById(
            "wealthoria-loading"
          );


        if (loader) {

          loader.remove();

        }

      }


      /* =====================================================
         ERROR SCREEN
         ===================================================== */

      function showError(error) {

        console.error(
          "[Wealthoria] Startup error:",
          error
        );


        const root =
          document.getElementById(
            "root"
          );


        if (!root) {

          return;

        }


        root.innerHTML = `

          <div
            style="
              min-height:100vh;
              display:flex;
              align-items:center;
              justify-content:center;
              padding:30px;
              background:#fff;
              font-family:Arial,sans-serif;
              text-align:center;
            "
          >

            <div
              style="
                max-width:520px;
              "
            >

              <h2>
                Wealthoria could not load
              </h2>

              <p
                style="
                  color:#666;
                  line-height:1.6;
                "
              >
                Something went wrong while loading
                the application. Please refresh and
                try again.
              </p>

              <button
                type="button"
                onclick="location.reload()"
                style="
                  border:0;
                  border-radius:8px;
                  padding:12px 22px;
                  background:#e8473f;
                  color:#fff;
                  cursor:pointer;
                  font-size:14px;
                "
              >
                Refresh
              </button>

            </div>

          </div>

        `;

      }


      /* =====================================================
         START APPLICATION
         ===================================================== */

      async function start() {

        try {

          /*
           * ADMIN
           */

          if (
            path === "/admin" ||
            path.startsWith("/admin/")
          ) {

            openAdmin();

            return;

          }


          /*
           * MEMBERS
           */

          if (
            path === "/members" ||
            path.startsWith("/members/")
          ) {

            await loadMembers();

            removeLoader();

            return;

          }


          /*
           * PUBLIC
           */

          await loadPublic();

          removeLoader();

        }
        catch (error) {

          showError(
            error
          );

        }

      }


      /* =====================================================
         WAIT FOR REACT / BABEL / FIREBASE
         ===================================================== */

      function waitForRuntime() {

        if (
          window.React &&
          window.ReactDOM &&
          window.Babel &&
          window.firebase
        ) {

          start();

          return;

        }


        setTimeout(
          waitForRuntime,
          25
        );

      }


      waitForRuntime();


    })();

  </script>
