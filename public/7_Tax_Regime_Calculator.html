<div id="root"></div>

<script type="text/babel" data-presets="react">
const {useState, useMemo} = React;
const RC = window.Recharts || {};

/* ═══════════════════════════════════════════════════════════
   TAX ENGINE — FY 2026-27 (AY 2027-28)
   Sources: Budget 2025 slabs, retained unchanged in Budget 2026
   ═══════════════════════════════════════════════════════════ */

const NEW_SLABS = [
  {upto:  400000, rate:0.00},
  {upto:  800000, rate:0.05},
  {upto: 1200000, rate:0.10},
  {upto: 1600000, rate:0.15},
  {upto: 2000000, rate:0.20},
  {upto: 2400000, rate:0.25},
  {upto: Infinity, rate:0.30}
];

const OLD_SLABS_BY_AGE = {
  below60: [{upto:250000,rate:0.00},{upto:500000,rate:0.05},{upto:1000000,rate:0.20},{upto:Infinity,rate:0.30}],
  senior:  [{upto:300000,rate:0.00},{upto:500000,rate:0.05},{upto:1000000,rate:0.20},{upto:Infinity,rate:0.30}],
  super:   [{upto:500000,rate:0.00},{upto:1000000,rate:0.20},{upto:Infinity,rate:0.30}]
};

const STD_DED_NEW = 75000;
const STD_DED_OLD = 50000;
const REBATE_NEW  = {limit:1200000, max:60000};
const REBATE_OLD  = {limit: 500000, max:12500};
const CESS = 0.04;
const SURCHARGE_STEPS = [5000000, 10000000, 20000000, 50000000];

function slabTax(income, slabs){
  let tax = 0, prev = 0;
  const rows = [];
  for(const s of slabs){
    if(income <= prev) break;
    const top = Math.min(income, s.upto);
    const amt = top - prev;
    const t = amt * s.rate;
    rows.push({from:prev, to:top, rate:s.rate, slice:amt, tax:t});
    tax += t;
    prev = s.upto;
  }
  return {tax, rows};
}

function surchargeRate(income, isNew){
  if(income > 50000000) return isNew ? 0.25 : 0.37;
  if(income > 20000000) return 0.25;
  if(income > 10000000) return 0.15;
  if(income >  5000000) return 0.10;
  return 0;
}

/* Capital gains — special rates, identical under BOTH regimes */
const LTCG_EQ_EXEMPT   = 125000;  // s.112A annual exemption on equity LTCG
const RATE_STCG_111A   = 0.20;    // listed equity / equity MF held <= 12 months
const RATE_LTCG_112A   = 0.125;   // listed equity / equity MF held > 12 months
const RATE_LTCG_112    = 0.125;   // property, gold, unlisted shares — no indexation
const CG_SURCHARGE_CAP = 0.15;    // surcharge on 111A/112A/112 gains capped at 15%

function computeTax(p){
  const isNew  = p.regime === 'new';
  const salary = Math.max(0, p.salary);
  const cg     = p.cg || {};
  const G      = k => Math.max(0, cg[k] || 0);

  // Short-term gains on debt MF / gold / property are taxed at the normal slab rate,
  // so they simply join "other income".
  const stcgSlab = G('stcgSlab');
  const other    = Math.max(0, p.otherIncome) + stcgSlab;
  const gross    = salary + other;

  /* ── Deductions ── */
  const stdDed = salary > 0 ? (isNew ? STD_DED_NEW : STD_DED_OLD) : 0;
  const lines = [];
  if(stdDed) lines.push({label:'Standard deduction', claimed:stdDed, entered:stdDed, capped:false});

  let ded = stdDed;

  if(isNew){
    // Only employer NPS 80CCD(2) survives in the new regime (up to 14% of salary)
    const cap = salary * 0.14;
    const v = Math.min(Math.max(0,p.ded.nps2), cap);
    if(p.ded.nps2 > 0) lines.push({label:'Employer NPS 80CCD(2)', claimed:v, entered:p.ded.nps2, capped:p.ded.nps2 > cap, capText:'14% of salary'});
    ded += v;
  } else {
    const add = (label, val, cap, capText) => {
      const v = Math.min(Math.max(0,val), cap);
      if(val > 0) lines.push({label, claimed:v, entered:val, capped:val > cap, capText});
      ded += v;
    };
    add('Section 80C',            p.ded.c80c,     150000, '₹1,50,000');
    add('Section 80D (health)',   p.ded.c80d,     100000, '₹1,00,000');
    add('HRA exemption',          p.ded.hra,      Infinity, '');
    add('Home loan interest 24(b)',p.ded.homeLoan,200000, '₹2,00,000');
    add('NPS self 80CCD(1B)',     p.ded.nps1b,     50000, '₹50,000');
    add('Employer NPS 80CCD(2)',  p.ded.nps2, salary*0.10, '10% of salary');
  }

  const taxable = Math.max(0, gross - ded);   // slab-rate income
  const slabs = isNew ? NEW_SLABS : OLD_SLABS_BY_AGE[p.age || 'below60'];
  const basicLimit = slabs[0].upto;

  /* ── Special-rate capital gains ── */
  const stcgE = G('stcg111a');
  const ltcgE = G('ltcg112a');
  const ltcgO = G('ltcg112');
  const ltcgEafterExempt = Math.max(0, ltcgE - LTCG_EQ_EXEMPT);
  const cgTotal = stcgE + ltcgE + ltcgO;

  // A resident may set off the unused part of the basic exemption limit against
  // capital gains. Apply it to the dearest gain first — that is the taxpayer's choice.
  let spare = Math.max(0, basicLimit - taxable);
  const take = amt => { const t = Math.min(spare, amt); spare -= t; return t; };
  const absS = take(stcgE);
  const absL = take(ltcgEafterExempt);
  const absO = take(ltcgO);
  const netS = stcgE - absS;
  const netL = ltcgEafterExempt - absL;
  const netO = ltcgO - absO;

  const taxStcg  = netS * RATE_STCG_111A;
  const taxLtcgE = netL * RATE_LTCG_112A;
  const taxLtcgO = netO * RATE_LTCG_112;
  const cgTaxRaw = taxStcg + taxLtcgE + taxLtcgO;

  const cgLines = [];
  if(stcgE)    cgLines.push({label:'STCG on equity — s.111A', rate:'20%',   gain:stcgE, exempt:0, absorbed:absS, taxed:netS, tax:taxStcg});
  if(ltcgE)    cgLines.push({label:'LTCG on equity — s.112A', rate:'12.5%', gain:ltcgE, exempt:Math.min(ltcgE, LTCG_EQ_EXEMPT), absorbed:absL, taxed:netL, tax:taxLtcgE});
  if(ltcgO)    cgLines.push({label:'LTCG on other assets — s.112', rate:'12.5%', gain:ltcgO, exempt:0, absorbed:absO, taxed:netO, tax:taxLtcgO});
  if(stcgSlab) cgLines.push({label:'STCG at slab rate (debt MF, gold, property)', rate:'slab', gain:stcgSlab, exempt:0, absorbed:0, taxed:stcgSlab, tax:null});

  /* ── Slab tax and section 87A rebate ── */
  const {tax:preRebate, rows} = slabTax(taxable, slabs);
  const totalIncome = taxable + cgTotal;
  const R = isNew ? REBATE_NEW : REBATE_OLD;

  // The rebate is tested on TOTAL income. In the new regime it cannot be set against
  // income taxed at special rates; in the old regime it may be set against 111A tax
  // but never against 112A LTCG.
  const rebateBase = isNew ? preRebate : preRebate + taxStcg;
  const rebate  = totalIncome <= R.limit ? Math.min(rebateBase, R.max) : 0;
  const rebSlab = Math.min(rebate, preRebate);
  const rebCg   = rebate - rebSlab;

  let afterRebate = preRebate - rebSlab;
  let cgTax = Math.max(0, cgTaxRaw - rebCg);

  // Marginal relief just above the rebate cliff (new regime, slab income only)
  let rebateRelief = 0;
  if(isNew && cgTotal === 0 && taxable > R.limit){
    const capped = taxable - R.limit;
    if(afterRebate > capped){ rebateRelief = afterRebate - capped; afterRebate = capped; }
  }

  /* ── Surcharge, with the 15% cap on capital gains and marginal relief ── */
  const scRate   = surchargeRate(totalIncome, isNew);
  const scRateCg = Math.min(scRate, CG_SURCHARGE_CAP);
  let surcharge = afterRebate * scRate + cgTax * scRateCg;
  let surchargeRelief = 0;

  if(scRate > 0){
    let T = 0;
    for(const t of SURCHARGE_STEPS){ if(totalIncome > t) T = t; }
    // Recompute tax at exactly the threshold, holding the gains fixed
    const nT   = Math.max(0, T - cgTotal);
    const stT  = slabTax(nT, slabs).tax;
    const rbT  = T <= R.limit ? Math.min(isNew ? stT : stT + taxStcg, R.max) : 0;
    const rbSt = Math.min(rbT, stT);
    const nAt  = stT - rbSt;
    const cAt  = Math.max(0, cgTaxRaw - (rbT - rbSt));
    const pr   = surchargeRate(T, isNew);
    const prCg = Math.min(pr, CG_SURCHARGE_CAP);
    const totalAtT = nAt + cAt + nAt*pr + cAt*prCg;
    const cap = totalAtT + (totalIncome - T);
    const tot = afterRebate + cgTax + surcharge;
    if(tot > cap){ surchargeRelief = tot - cap; surcharge = Math.max(0, surcharge - surchargeRelief); }
  }

  const cess  = (afterRebate + cgTax + surcharge) * CESS;
  const total = Math.round(afterRebate + cgTax + surcharge + cess);
  const grossAll = gross + cgTotal;

  return {
    regime:p.regime, gross, cgTotal, grossAll, deductions:ded, lines, taxable, totalIncome, slabRows:rows,
    cgLines, cgTax, cgTaxRaw, basicAbsorbed: absS + absL + absO,
    ltcgExemptUsed: Math.min(ltcgE, LTCG_EQ_EXEMPT),
    preRebate, rebate, rebateRelief, afterRebate,
    surcharge, surchargeRate:scRate, surchargeRelief,
    cess, total,
    effective: grossAll > 0 ? total/grossAll*100 : 0,
    inHand: grossAll - total
  };
}

/* ═══════════════════════════════════════════════════════════
   FORMATTING
   ═══════════════════════════════════════════════════════════ */

const inr = n => '₹' + Math.round(n).toLocaleString('en-IN');
const inrShort = n => {
  const a = Math.abs(n);
  if(a >= 10000000) return '₹' + (n/10000000).toFixed(2) + ' Cr';
  if(a >= 100000)   return '₹' + (n/100000).toFixed(2) + ' L';
  if(a >= 1000)     return '₹' + (n/1000).toFixed(1) + 'k';
  return '₹' + Math.round(n);
};
const pct = n => n.toFixed(2) + '%';

/* ═══════════════════════════════════════════════════════════
   SMALL UI PIECES
   ═══════════════════════════════════════════════════════════ */

function MoneyInput({label, hint, value, onChange, max, step, cap}){
  return (
    <div className="mb-5">
      <div className="flex items-baseline justify-between gap-2 mb-1.5">
        <label className="text-[13px] font-semibold text-ink-700">{label}</label>
        <div className="flex items-center gap-1 rounded-lg border border-ink-200 bg-white px-2 py-1 focus-within:border-teal-600 focus-within:ring-2 focus-within:ring-teal-100">
          <span className="text-ink-400 text-[13px]">₹</span>
          <input
            type="text" inputMode="numeric"
            className="num w-24 text-right text-[13px] font-semibold text-ink-900 outline-none bg-transparent"
            value={value === 0 ? '' : value.toLocaleString('en-IN')}
            placeholder="0"
            onChange={e=>{
              const raw = e.target.value.replace(/[^0-9]/g,'');
              onChange(raw === '' ? 0 : Math.min(Number(raw), max));
            }}
          />
        </div>
      </div>
      <input type="range" min="0" max={max} step={step} value={value}
             onChange={e=>onChange(Number(e.target.value))} />
      <div className="flex justify-between mt-1">
        <span className="text-[11px] text-ink-400">{hint}</span>
        {cap && <span className="text-[11px] text-ink-400">Max {cap}</span>}
      </div>
    </div>
  );
}

function Row({label, value, sub, tone, bold, strike}){
  const c = tone === 'good' ? 'text-teal-700'
          : tone === 'bad'  ? 'text-rose-600'
          : tone === 'mute' ? 'text-ink-400' : 'text-ink-800';
  return (
    <div className="flex items-start justify-between gap-3 py-1.5">
      <div>
        <div className={'text-[13px] ' + (bold ? 'font-semibold text-ink-800' : 'text-ink-600')}>{label}</div>
        {sub && <div className="text-[11px] text-ink-400 mt-0.5">{sub}</div>}
      </div>
      <div className={'num text-[13px] whitespace-nowrap ' + c + ' ' + (bold ? 'font-bold' : 'font-medium') + (strike ? ' line-through' : '')}>
        {value}
      </div>
    </div>
  );
}

function RegimeCard({r, title, subtitle, winner, showSlabs, onToggleSlabs}){
  const border = winner ? 'border-teal-600 ring-4 ring-teal-100' : 'border-ink-200';
  return (
    <div className={'relative rounded-2xl border-2 bg-white p-5 ' + border}>
      {winner && (
        <div className="absolute -top-3 left-5 rounded-full bg-teal-700 px-3 py-1 text-[11px] font-bold uppercase tracking-wide text-white">
          Cheaper
        </div>
      )}
      <div className="mb-3">
        <h3 className="text-base font-bold text-ink-900">{title}</h3>
        <p className="text-[11px] text-ink-400">{subtitle}</p>
      </div>

      <div className="rounded-xl bg-ink-50 px-4 py-3 mb-4">
        <div className="text-[11px] uppercase tracking-wide text-ink-500 font-semibold">Total tax payable</div>
        <div className="num text-3xl font-extrabold text-ink-900 mt-0.5">{inr(r.total)}</div>
        <div className="text-[11px] text-ink-500 mt-1">
          Effective rate <span className="num font-semibold">{pct(r.effective)}</span> · Take-home <span className="num font-semibold">{inr(r.inHand)}</span>
        </div>
      </div>

      <div className="divide-y divide-ink-100">
        <Row label="Salary + other income" value={inr(r.gross)} />
        <Row label="Total deductions" value={'− ' + inr(r.deductions)} tone="good" />
        <Row label="Slab-rate taxable income" value={inr(r.taxable)} bold />
        <Row label="Tax as per slabs" value={inr(r.preRebate)} />
        {r.cgTotal > 0 && <Row label="Capital gains (special rates)" sub="Same rates in both regimes" value={inr(r.cgTotal)} tone="mute" />}
        {r.cgTaxRaw > 0 && <Row label="Tax on capital gains" value={inr(r.cgTaxRaw)} />}
        {r.rebate > 0 && <Row label="Section 87A rebate" value={'− ' + inr(r.rebate)} tone="good" />}
        {r.rebateRelief > 0 && <Row label="Marginal relief (87A)" sub="Extra tax capped at income above the rebate limit" value={'− ' + inr(r.rebateRelief)} tone="good" />}
        {r.surcharge > 0 && <Row label={'Surcharge @ ' + (r.surchargeRate*100) + '%'} value={'+ ' + inr(r.surcharge)} tone="bad" />}
        {r.surchargeRelief > 0 && <Row label="Marginal relief (surcharge)" value={'− ' + inr(r.surchargeRelief)} tone="good" />}
        <Row label="Health & education cess @ 4%" value={'+ ' + inr(r.cess)} />
        <Row label="Total tax" value={inr(r.total)} bold />
      </div>

      {r.lines.length > 0 && (
        <div className="mt-4 rounded-xl border border-ink-200 p-3">
          <div className="text-[11px] font-bold uppercase tracking-wide text-ink-500 mb-2">Deductions allowed</div>
          {r.lines.map((l,i)=>(
            <div key={i} className="flex items-start justify-between gap-2 py-1">
              <div className="text-[12px] text-ink-600">
                {l.label}
                {l.capped && <span className="ml-1 rounded bg-amber-100 px-1.5 py-0.5 text-[10px] font-semibold text-amber-700">capped at {l.capText}</span>}
              </div>
              <div className="num text-[12px] font-semibold text-ink-800 whitespace-nowrap">{inr(l.claimed)}</div>
            </div>
          ))}
        </div>
      )}

      {r.cgLines.length > 0 && (
        <div className="mt-3 rounded-xl border border-ink-200 p-3">
          <div className="text-[11px] font-bold uppercase tracking-wide text-ink-500 mb-2">Capital gains</div>
          {r.cgLines.map((l,i)=>(
            <div key={i} className="py-1.5 border-t border-ink-100 first:border-0 first:pt-0">
              <div className="flex items-start justify-between gap-2">
                <div className="text-[12px] font-medium text-ink-700">{l.label}</div>
                <div className="num text-[12px] font-semibold text-ink-800 whitespace-nowrap">
                  {l.tax === null ? 'at slab' : inr(l.tax)}
                </div>
              </div>
              <div className="num text-[11px] text-ink-400 mt-0.5">
                Gain {inr(l.gain)}
                {l.exempt > 0 && <span> · exempt {inr(l.exempt)}</span>}
                {l.absorbed > 0 && <span> · basic-limit set-off {inr(l.absorbed)}</span>}
                {l.tax !== null && <span> · taxed {inr(l.taxed)} @ {l.rate}</span>}
              </div>
            </div>
          ))}
          {r.basicAbsorbed > 0 && (
            <p className="mt-2 text-[11px] leading-relaxed text-teal-700">
              Your slab income is below the basic exemption limit, so {inr(r.basicAbsorbed)} of the unused limit has been
              set off against your gains.
            </p>
          )}
        </div>
      )}

      <button onClick={onToggleSlabs}
        className="no-print mt-4 w-full rounded-xl border border-ink-200 px-3 py-2 text-[12px] font-semibold text-ink-600 hover:bg-ink-50 transition">
        {showSlabs ? 'Hide' : 'Show'} slab-wise breakdown
      </button>

      {showSlabs && (
        <div className="fade-in mt-3 overflow-hidden rounded-xl border border-ink-200">
          <table className="w-full text-[12px]">
            <thead className="bg-ink-50 text-ink-500">
              <tr>
                <th className="px-3 py-2 text-left font-semibold">Income slab</th>
                <th className="px-3 py-2 text-right font-semibold">Rate</th>
                <th className="px-3 py-2 text-right font-semibold">Tax</th>
              </tr>
            </thead>
            <tbody className="divide-y divide-ink-100">
              {r.slabRows.map((s,i)=>(
                <tr key={i} className={s.rate === 0 ? 'text-ink-400' : 'text-ink-700'}>
                  <td className="num px-3 py-2">{inrShort(s.from)} – {s.to === Infinity ? '∞' : inrShort(s.to)}</td>
                  <td className="num px-3 py-2 text-right">{(s.rate*100).toFixed(0)}%</td>
                  <td className="num px-3 py-2 text-right font-semibold">{inr(s.tax)}</td>
                </tr>
              ))}
              <tr className="bg-ink-50 font-bold text-ink-900">
                <td className="px-3 py-2" colSpan="2">Tax as per slabs</td>
                <td className="num px-3 py-2 text-right">{inr(r.preRebate)}</td>
              </tr>
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   BREAK-EVEN CHART
   ═══════════════════════════════════════════════════════════ */

function BreakevenChart({data, breakeven, current}){
  if(!RC.ResponsiveContainer){
    return <div className="rounded-xl border border-ink-200 p-6 text-center text-[12px] text-ink-400">Chart library did not load.</div>;
  }
  const {ResponsiveContainer, LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ReferenceLine} = RC;
  return (
    <div style={{width:'100%', height:300}}>
      <ResponsiveContainer>
        <LineChart data={data} margin={{top:10,right:16,bottom:4,left:4}}>
          <CartesianGrid strokeDasharray="3 3" stroke="#e2e8f0" vertical={false} />
          <XAxis dataKey="d" tickFormatter={inrShort} tick={{fontSize:11, fill:'#64748b'}}
                 axisLine={{stroke:'#cbd5e1'}} tickLine={false}
                 label={{value:'Old-regime deductions claimed', position:'insideBottom', offset:-2, style:{fontSize:11, fill:'#94a3b8'}}} />
          <YAxis tickFormatter={inrShort} tick={{fontSize:11, fill:'#64748b'}} axisLine={false} tickLine={false} width={62} />
          <Tooltip
            formatter={(v,n)=>[inr(v), n]}
            labelFormatter={v=>'Deductions ' + inr(v)}
            contentStyle={{fontSize:12, borderRadius:10, border:'1px solid #e2e8f0'}} />
          <Legend wrapperStyle={{fontSize:12}} />
          {breakeven !== null && <ReferenceLine x={breakeven} stroke="#b45309" strokeDasharray="4 4"
            label={{value:'break-even ' + inrShort(breakeven), position:'top', style:{fontSize:11, fill:'#b45309', fontWeight:600}}} />}
          {current !== null && <ReferenceLine x={current} stroke="#94a3b8" strokeDasharray="2 2"
            label={{value:'you', position:'insideTopRight', style:{fontSize:11, fill:'#64748b'}}} />}
          <Line type="monotone" dataKey="oldTax" name="Old regime" stroke="#b45309" strokeWidth={2.5} dot={false} />
          <Line type="monotone" dataKey="newTax" name="New regime" stroke="#0f766e" strokeWidth={2.5} dot={false} />
        </LineChart>
      </ResponsiveContainer>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   APP
   ═══════════════════════════════════════════════════════════ */

function App(){
  const [salary, setSalary] = useState(1500000);
  const [other,  setOther]  = useState(0);
  const [age,    setAge]    = useState('below60');
  const [ded, setDed] = useState({c80c:150000, c80d:25000, hra:0, homeLoan:0, nps1b:50000, nps2:0});
  const [cg,  setCg]  = useState({stcg111a:0, ltcg112a:0, ltcg112:0, stcgSlab:0});
  const [tab, setTab] = useState('income');
  const [showOldSlabs, setShowOldSlabs] = useState(false);
  const [showNewSlabs, setShowNewSlabs] = useState(false);

  const set   = (k,v) => setDed(d => ({...d, [k]:v}));
  const setCG = (k,v) => setCg(c => ({...c, [k]:v}));

  const oldR = useMemo(()=>computeTax({regime:'old', salary, otherIncome:other, age, ded, cg}), [salary,other,age,ded,cg]);
  const newR = useMemo(()=>computeTax({regime:'new', salary, otherIncome:other, age, ded, cg}), [salary,other,age,ded,cg]);
  const cgTotal = oldR.cgTotal;

  const diff   = oldR.total - newR.total;      // >0 → new regime cheaper
  const newWins = diff >= 0;
  const saving  = Math.abs(diff);

  // Break-even sweep: how much old-regime deduction is needed to match the new regime?
  const {chartData, breakeven} = useMemo(()=>{
    const gross = salary + other;
    const maxD  = Math.max(500000, Math.min(gross, 1500000));
    const step  = Math.max(5000, Math.round(maxD/60/1000)*1000);
    const rows = [];
    let be = null;
    const newTax = newR.total;
    for(let d = 0; d <= maxD; d += step){
      // treat the sweep as a lump "other deductions" bucket under the old regime
      const o = computeTax({regime:'old', salary, otherIncome:other, age, cg,
                            ded:{c80c:0, c80d:0, hra:d, homeLoan:0, nps1b:0, nps2:0}});
      rows.push({d, oldTax:o.total, newTax});
      if(be === null && o.total <= newTax) be = d;
    }
    return {chartData:rows, breakeven:be};
  }, [salary, other, age, cg, newR.total]);

  const currentDed = Math.max(0, oldR.deductions - (salary > 0 ? STD_DED_OLD : 0));
  const gross = salary + other + cgTotal;

  return (
    <div className="mx-auto max-w-6xl px-4 py-8 sm:px-6 lg:px-8">

      {/* Header */}
      <header className="mb-8">
        <div className="flex items-center gap-2 mb-2">
          <span className="rounded-md bg-teal-700 px-2 py-1 text-[11px] font-bold uppercase tracking-wider text-white">Wealthoria</span>
          <span className="rounded-md bg-ink-100 px-2 py-1 text-[11px] font-semibold text-ink-500">FY 2026-27 · AY 2027-28</span>
        </div>
        <h1 className="text-3xl font-extrabold tracking-tight text-ink-900 sm:text-4xl">Old vs New Tax Regime</h1>
        <p className="mt-2 max-w-2xl text-[14px] leading-relaxed text-ink-500">
          Enter your income and the deductions you actually claim. The calculator computes both regimes
          side by side, shows every step, and tells you which one costs less.
        </p>
      </header>

      <div className="grid gap-6 lg:grid-cols-[340px_minmax(0,1fr)]">

        {/* ── INPUT PANEL ── */}
        <aside className="no-print lg:sticky lg:top-6 lg:self-start">
          <div className="rounded-2xl border border-ink-200 bg-white p-5">
            <div className="mb-5 grid grid-cols-2 gap-1 rounded-xl bg-ink-100 p-1">
              {[['income','Income & deductions'],['cg','Capital gains']].map(([k,l])=>(
                <button key={k} onClick={()=>setTab(k)}
                  className={'rounded-lg px-2 py-2 text-[12px] font-semibold transition ' +
                    (tab===k ? 'bg-white text-teal-700 shadow-sm' : 'text-ink-500 hover:text-ink-700')}>
                  {l}
                  {k==='cg' && cgTotal>0 && <span className="ml-1 rounded-full bg-teal-600 px-1.5 text-[10px] text-white">•</span>}
                </button>
              ))}
            </div>

            {tab === 'income' && (<React.Fragment>

            <h2 className="text-[13px] font-bold uppercase tracking-wide text-ink-500 mb-4">Your income</h2>

            <MoneyInput label="Annual salary (CTC minus employer PF)" hint="Before any deduction"
              value={salary} onChange={setSalary} max={50000000} step={25000} />
            <MoneyInput label="Other income" hint="Interest, rent, freelance"
              value={other} onChange={setOther} max={20000000} step={10000} />

            <div className="mb-5">
              <label className="text-[13px] font-semibold text-ink-700 block mb-1.5">Age group</label>
              <div className="grid grid-cols-3 gap-1 rounded-xl bg-ink-100 p-1">
                {[['below60','< 60'],['senior','60–79'],['super','80+']].map(([k,l])=>(
                  <button key={k} onClick={()=>setAge(k)}
                    className={'rounded-lg px-2 py-1.5 text-[12px] font-semibold transition ' +
                      (age===k ? 'bg-white text-teal-700 shadow-sm' : 'text-ink-500 hover:text-ink-700')}>
                    {l}
                  </button>
                ))}
              </div>
              <p className="text-[11px] text-ink-400 mt-1">Affects the old regime's exemption limit only.</p>
            </div>

            <h2 className="text-[13px] font-bold uppercase tracking-wide text-ink-500 mt-6 mb-1">Deductions you claim</h2>
            <p className="text-[11px] text-ink-400 mb-4">
              Most of these count only in the old regime. The new regime allows the standard deduction and employer NPS.
            </p>

            <MoneyInput label="Section 80C" hint="EPF, PPF, ELSS, life insurance, tuition, home loan principal"
              value={ded.c80c} onChange={v=>set('c80c',v)} max={150000} step={5000} cap="₹1.5L" />
            <MoneyInput label="Section 80D — health insurance" hint="Self, family and parents"
              value={ded.c80d} onChange={v=>set('c80d',v)} max={100000} step={2500} cap="₹1L" />
            <MoneyInput label="HRA exemption" hint="Only if you pay rent and get HRA"
              value={ded.hra} onChange={v=>set('hra',v)} max={1000000} step={10000} />
            <MoneyInput label="Home loan interest — 24(b)" hint="Self-occupied property"
              value={ded.homeLoan} onChange={v=>set('homeLoan',v)} max={200000} step={5000} cap="₹2L" />
            <MoneyInput label="NPS — your own, 80CCD(1B)" hint="Over and above 80C"
              value={ded.nps1b} onChange={v=>set('nps1b',v)} max={50000} step={5000} cap="₹50k" />
            <MoneyInput label="Employer NPS — 80CCD(2)" hint="Allowed in BOTH regimes"
              value={ded.nps2} onChange={v=>set('nps2',v)} max={Math.max(100000, Math.round(salary*0.14))} step={5000}
              cap={'14% (new) / 10% (old)'} />

            </React.Fragment>)}

            {tab === 'cg' && (<React.Fragment>

            <h2 className="text-[13px] font-bold uppercase tracking-wide text-ink-500 mb-1">Capital gains this year</h2>
            <p className="text-[11px] leading-relaxed text-ink-400 mb-4">
              Enter the <b>net gain</b> (sale price minus cost), not the sale value. These rates are the
              <b> same in both regimes</b>, so gains never decide which regime wins — they only change the surcharge
              band and whether you still qualify for the 87A rebate.
            </p>

            <MoneyInput label="LTCG on equity — s.112A" hint="Listed shares, equity MF held over 12 months · 12.5%"
              value={cg.ltcg112a} onChange={v=>setCG('ltcg112a',v)} max={20000000} step={25000} cap="₹1.25L free" />
            <MoneyInput label="STCG on equity — s.111A" hint="Listed shares, equity MF held 12 months or less · 20%"
              value={cg.stcg111a} onChange={v=>setCG('stcg111a',v)} max={20000000} step={25000} />
            <MoneyInput label="LTCG on other assets — s.112" hint="Property, gold, unlisted shares held long · 12.5%, no indexation"
              value={cg.ltcg112} onChange={v=>setCG('ltcg112',v)} max={50000000} step={50000} />
            <MoneyInput label="Gains taxed at your slab rate" hint="Debt mutual funds, and gold or property sold early"
              value={cg.stcgSlab} onChange={v=>setCG('stcgSlab',v)} max={20000000} step={25000} />

            <div className="rounded-xl border-l-4 border-teal-600 bg-teal-50 p-3 mb-5">
              <div className="text-[11px] font-bold uppercase tracking-wide text-teal-800 mb-1">Three things to remember</div>
              <p className="text-[12px] leading-relaxed text-ink-700">
                The first ₹1,25,000 of equity LTCG is free every year. Section 80C and the other deductions
                cannot be set against equity gains. And if your salary income sits below the basic exemption limit,
                the unused part of that limit is set off against your gains automatically.
              </p>
            </div>

            </React.Fragment>)}

            <button onClick={()=>{setSalary(1500000);setOther(0);setAge('below60');setCg({stcg111a:0,ltcg112a:0,ltcg112:0,stcgSlab:0});setDed({c80c:150000,c80d:25000,hra:0,homeLoan:0,nps1b:50000,nps2:0});}}
              className="w-full rounded-xl border border-ink-200 px-3 py-2 text-[12px] font-semibold text-ink-500 hover:bg-ink-50 transition">
              Reset to defaults
            </button>
          </div>
        </aside>

        {/* ── RESULTS ── */}
        <main className="space-y-6">

          {/* Verdict */}
          <div className={'fade-in rounded-2xl p-6 text-white ' + (newWins ? 'bg-teal-700' : 'bg-amber-700')}>
            <div className="text-[12px] font-semibold uppercase tracking-wider opacity-80">Verdict</div>
            <div className="mt-1 text-2xl font-extrabold sm:text-3xl">
              {saving === 0
                ? 'Both regimes cost you exactly the same'
                : (newWins ? 'New regime' : 'Old regime') + ' saves you ' + inr(saving) + ' a year'}
            </div>
            <div className="mt-2 text-[13px] leading-relaxed opacity-90">
              {saving === 0
                ? 'You are sitting exactly on the break-even point. Pick the new regime for the simpler paperwork.'
                : newWins
                  ? 'Your deductions of ' + inr(currentDed) + ' are not enough to beat the new regime\'s wider slabs. You would need about ' + (breakeven !== null ? inr(breakeven) : 'a much larger amount') + ' in old-regime deductions to break even.'
                  : 'Your deductions of ' + inr(currentDed) + ' are large enough to beat the new regime\'s wider slabs. Keep claiming them and stay in the old regime.'}
            </div>
            {cgTotal > 0 && (
              <div className="mt-3 rounded-xl bg-white/15 px-3 py-2 text-[12px] leading-relaxed">
                Of your total tax, <b className="num">{inr(newR.cgTax)}</b> comes from capital gains — and that part is
                identical in both regimes. The regime choice only moves the remaining <b className="num">{inr(Math.abs((oldR.total - oldR.cgTax) - (newR.total - newR.cgTax)))}</b>.
              </div>
            )}
            <div className="mt-4 grid grid-cols-3 gap-3 border-t border-white/20 pt-4">
              <div>
                <div className="text-[11px] uppercase tracking-wide opacity-70">Old regime</div>
                <div className="num text-lg font-bold">{inr(oldR.total)}</div>
              </div>
              <div>
                <div className="text-[11px] uppercase tracking-wide opacity-70">New regime</div>
                <div className="num text-lg font-bold">{inr(newR.total)}</div>
              </div>
              <div>
                <div className="text-[11px] uppercase tracking-wide opacity-70">Difference</div>
                <div className="num text-lg font-bold">{inr(saving)}</div>
              </div>
            </div>
          </div>

          {/* Side-by-side */}
          <div className="grid gap-5 md:grid-cols-2">
            <RegimeCard r={oldR} title="Old regime" subtitle="Narrow slabs, full deductions"
              winner={!newWins && saving > 0}
              showSlabs={showOldSlabs} onToggleSlabs={()=>setShowOldSlabs(s=>!s)} />
            <RegimeCard r={newR} title="New regime" subtitle="Wide slabs, almost no deductions"
              winner={newWins && saving > 0}
              showSlabs={showNewSlabs} onToggleSlabs={()=>setShowNewSlabs(s=>!s)} />
          </div>

          {/* Break-even */}
          <div className="rounded-2xl border border-ink-200 bg-white p-5">
            <h2 className="text-base font-bold text-ink-900">Where the two regimes cross</h2>
            <p className="mt-1 mb-4 text-[13px] leading-relaxed text-ink-500">
              The teal line is flat — the new regime does not care how much you invest. The amber line falls as you
              claim more old-regime deductions. Wherever amber drops below teal, the old regime becomes cheaper.
            </p>
            <BreakevenChart data={chartData} breakeven={breakeven} current={currentDed} />
            <div className="mt-4 rounded-xl bg-ink-50 px-4 py-3 text-[13px] leading-relaxed text-ink-600">
              {breakeven !== null
                ? <span>At an income of <b className="num">{inr(gross)}</b>, you need roughly <b className="num text-amber-700">{inr(breakeven)}</b> of
                   old-regime deductions (over and above the ₹50,000 standard deduction) before the old regime wins.
                   You are currently claiming <b className="num">{inr(currentDed)}</b>.</span>
                : <span>At this income level the old regime never catches up, even with the maximum deductions shown. The new regime is the clear choice.</span>}
            </div>
          </div>

          {/* Explainer */}
          <div className="grid gap-5 md:grid-cols-2">
            <div className="rounded-2xl border border-ink-200 bg-white p-5">
              <h3 className="text-[13px] font-bold uppercase tracking-wide text-ink-500 mb-3">New regime slabs</h3>
              <table className="w-full text-[12px]">
                <tbody className="divide-y divide-ink-100">
                  {[['Up to ₹4,00,000','Nil'],['₹4,00,001 – ₹8,00,000','5%'],['₹8,00,001 – ₹12,00,000','10%'],
                    ['₹12,00,001 – ₹16,00,000','15%'],['₹16,00,001 – ₹20,00,000','20%'],
                    ['₹20,00,001 – ₹24,00,000','25%'],['Above ₹24,00,000','30%']].map(([a,b],i)=>(
                    <tr key={i}><td className="num py-1.5 text-ink-600">{a}</td><td className="num py-1.5 text-right font-semibold text-ink-800">{b}</td></tr>
                  ))}
                </tbody>
              </table>
              <p className="mt-3 text-[12px] leading-relaxed text-ink-500">
                Standard deduction ₹75,000. Rebate under section 87A makes tax nil up to ₹12,00,000 of taxable income,
                with marginal relief just above it.
              </p>
            </div>
            <div className="rounded-2xl border border-ink-200 bg-white p-5">
              <h3 className="text-[13px] font-bold uppercase tracking-wide text-ink-500 mb-3">Old regime slabs (below 60)</h3>
              <table className="w-full text-[12px]">
                <tbody className="divide-y divide-ink-100">
                  {[['Up to ₹2,50,000','Nil'],['₹2,50,001 – ₹5,00,000','5%'],['₹5,00,001 – ₹10,00,000','20%'],['Above ₹10,00,000','30%']].map(([a,b],i)=>(
                    <tr key={i}><td className="num py-1.5 text-ink-600">{a}</td><td className="num py-1.5 text-right font-semibold text-ink-800">{b}</td></tr>
                  ))}
                </tbody>
              </table>
              <p className="mt-3 text-[12px] leading-relaxed text-ink-500">
                Standard deduction ₹50,000. Rebate under section 87A up to ₹12,500 if taxable income is ₹5,00,000 or less.
                Exemption limit rises to ₹3,00,000 at age 60 and ₹5,00,000 at age 80.
              </p>
            </div>
          </div>

          {/* Capital gains reference */}
          <div className="rounded-2xl border border-ink-200 bg-white p-5">
            <h3 className="text-[13px] font-bold uppercase tracking-wide text-ink-500 mb-3">Capital gains rates — identical in both regimes</h3>
            <div className="overflow-x-auto">
              <table className="w-full text-[12px]">
                <thead className="text-ink-500">
                  <tr className="border-b border-ink-200">
                    <th className="py-2 pr-3 text-left font-semibold">Asset</th>
                    <th className="py-2 px-3 text-left font-semibold">Long term after</th>
                    <th className="py-2 px-3 text-right font-semibold">Short term</th>
                    <th className="py-2 pl-3 text-right font-semibold">Long term</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-ink-100 text-ink-700">
                  {[
                    ['Listed shares, equity mutual funds','12 months','20% (s.111A)','12.5% (s.112A)'],
                    ['Property, land, building','24 months','Slab rate','12.5%, no indexation'],
                    ['Gold, jewellery, unlisted shares','24 months','Slab rate','12.5%'],
                    ['Debt mutual funds bought after Apr 2023','—','Slab rate','Slab rate']
                  ].map(([a,b,c,d],i)=>(
                    <tr key={i}>
                      <td className="py-2 pr-3 font-medium">{a}</td>
                      <td className="num py-2 px-3 text-ink-500">{b}</td>
                      <td className="num py-2 px-3 text-right">{c}</td>
                      <td className="num py-2 pl-3 text-right font-semibold">{d}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <p className="mt-3 text-[12px] leading-relaxed text-ink-500">
              Equity long-term gains up to ₹1,25,000 a year are exempt. Surcharge on gains taxed under sections
              111A, 112A and 112 is capped at 15% even if your income crosses ₹2 crore. The section 87A rebate cannot
              be set against equity long-term gains, so a person with ₹12,00,000 of income may still pay tax if part of
              it is capital gain. Cess of 4% applies on everything.
            </p>
          </div>

          {/* Disclaimer */}
          <div className="rounded-2xl border-l-4 border-amber-600 bg-amber-50 p-5">
            <div className="text-[12px] font-bold uppercase tracking-wide text-amber-700 mb-1">Read this before you decide</div>
            <p className="text-[13px] leading-relaxed text-ink-700">
              This is an educational estimator, not tax advice. It covers salary, other income and the common capital gains
              heads. It does not handle business or professional income, house-property loss set-off, carried-forward or
              set-off of capital losses, the 20%-with-indexation option for property bought before 23 July 2024, exemptions
              under sections 54, 54F and 54EC, foreign income, or relief under sections 89 and 90. Your actual liability
              depends on your full return.
              Confirm with a qualified chartered accountant before you make the choice with your employer.
            </p>
          </div>

          <p className="pb-6 text-center text-[11px] text-ink-400">
            Wealthoria · Old vs New Regime Calculator · FY 2026-27 (AY 2027-28) · For education only.
          </p>
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
