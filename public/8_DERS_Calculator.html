<script type="text/babel" data-presets="react">
/* =====================================================================================
   DERS CALCULATOR
   -------------------------------------------------------------------------------------
   Architecture
     1. lib/format      — Indian currency + number formatting helpers
     2. lib/engine      — pure DERS simulation (no React, fully testable)
     3. lib/montecarlo  — stochastic wrapper around the engine
     4. lib/scenarios   — deterministic stress-test comparison
     5. ui/*            — presentational components
     6. App             — composition + state
   All calculation logic lives in pure functions below and never inside components.
   ===================================================================================== */

const { useState, useMemo, useEffect, useRef, useCallback } = React;

/* =====================================================================================
   1. FORMATTING
   ===================================================================================== */
const inr = new Intl.NumberFormat('en-IN', { maximumFractionDigits: 0 });
const inr2 = new Intl.NumberFormat('en-IN', { maximumFractionDigits: 2, minimumFractionDigits: 2 });

function fmtINR(v) {
  if (v === null || v === undefined || !isFinite(v)) return '—';
  const neg = v < 0;
  return (neg ? '-₹' : '₹') + inr.format(Math.round(Math.abs(v)));
}
function fmtShort(v) {
  if (v === null || v === undefined || !isFinite(v)) return '—';
  const a = Math.abs(v), s = v < 0 ? '-₹' : '₹';
  if (a >= 1e7) return s + inr2.format(a / 1e7) + ' Cr';
  if (a >= 1e5) return s + inr2.format(a / 1e5) + ' L';
  if (a >= 1e3) return s + inr.format(Math.round(a / 1e3)) + ' K';
  return s + inr.format(Math.round(a));
}
function fmtAxis(v) {
  const a = Math.abs(v);
  if (a >= 1e7) return (v / 1e7).toFixed(a >= 1e8 ? 0 : 1) + 'Cr';
  if (a >= 1e5) return (v / 1e5).toFixed(0) + 'L';
  if (a >= 1e3) return (v / 1e3).toFixed(0) + 'K';
  return String(Math.round(v));
}
function fmtPct(v, d) { return (v === null || v === undefined || !isFinite(v)) ? '—' : v.toFixed(d === undefined ? 1 : d) + '%'; }
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

/* =====================================================================================
   2. DERS SIMULATION ENGINE  (pure)
   -------------------------------------------------------------------------------------
   Model summary
     • Corpus is split into an Emergency Reserve (carved off first), a Growth Engine (GE)
       and an Income Engine (IE). The IE is layered: L1 liquid/floating FD, L2 corporate
       bonds, L3 equity.
     • Withdrawals are always funded from L1. When L1 is exhausted, L2 rotates into L1;
       when L2 is exhausted, L3 rotates into L1. The Growth Engine is never touched by a
       withdrawal directly.
     • Replenishment moves capital GE -> IE, rebuilding the layer structure, according to
       the selected rule (strict calendar / opportunistic).
     • Taxes are charged on the taxable-gain fraction of each harvest from the GE
       (harvest method determines the assumed gain fraction). This mirrors Indian LTCG
       treatment far better than taxing the withdrawal itself.
   ===================================================================================== */

const HARVEST_GAIN_FRACTION = { proportional: 0.60, best: 0.80, manual: 0.50 };

function monthlyRate(annualPct) { return Math.pow(1 + annualPct / 100, 1 / 12) - 1; }
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/**
 * Run one full DERS simulation.
 * @param {object} p  input assumptions
 * @param {object} [opts] { stochastic:boolean, rand:()=>number, light:boolean }
 * @returns {object} result bundle
 */
function runSimulation(p, opts) {
  opts = opts || {};
  const light = !!opts.light;                       // light mode skips monthly series (Monte Carlo)
  const stochastic = !!opts.stochastic;
  const rand = opts.rand || Math.random;

  // --- return generators -------------------------------------------------------------
  const mu = p.growthReturn / 100, sd = Math.max(0.0001, p.growthSD / 100);
  const sigL = Math.sqrt(Math.log(1 + (sd * sd) / Math.pow(1 + mu, 2)));
  const muL = Math.log(1 + mu) - 0.5 * sigL * sigL;
  const sigM = sigL / Math.sqrt(12), muM = muL / 12;
  const geDet = monthlyRate(p.growthReturn);
  let spare = null;
  function gauss() {
    if (spare !== null) { const s = spare; spare = null; return s; }
    let u = 0, v = 0;
    while (u === 0) u = rand();
    while (v === 0) v = rand();
    const r = Math.sqrt(-2 * Math.log(u));
    spare = r * Math.sin(2 * Math.PI * v);
    return r * Math.cos(2 * Math.PI * v);
  }
  const drawGE = () => stochastic ? Math.exp(muM + sigM * gauss()) - 1 : geDet;

  const rFD = monthlyRate(p.fdReturn);
  const rBond = monthlyRate(p.bondReturn);
  const rEq = monthlyRate(p.ieEquityReturn);
  const infl = p.inflation / 100;
  const taxRate = p.taxRate / 100;
  const gainFrac = HARVEST_GAIN_FRACTION[p.replenishMethod] || 0.6;

  // --- setup -------------------------------------------------------------------------
  const stepMonths = p.frequency === 'yearly' ? 12 : p.frequency === 'quarterly' ? 3 : 1;
  const totalMonths = Math.round(p.simYears * 12);
  const lp = [p.layer1 / 100, p.layer2 / 100, p.layer3 / 100];
  const lpSum = lp[0] + lp[1] + lp[2] || 1;
  const lpn = lp.map(x => x / lpSum);

  let reserve = Math.min(Math.max(0, p.emergencyMonths) * p.monthlyWithdrawal, p.corpus * 0.5);
  const investable = Math.max(0, p.corpus - reserve);
  let GE = investable * (p.growthAlloc / 100);
  let ie0 = investable - GE;
  let L1 = ie0 * lpn[0], L2 = ie0 * lpn[1], L3 = ie0 * lpn[2];

  let currentMonthly = p.monthlyWithdrawal;
  let lastReplenishGE = GE;
  let monthsSinceReplenish = 0;
  let inflationPaused = false;

  const replenishments = [];
  const rotations = [];
  const monthly = [];
  const yearly = [];

  let totalWithdrawn = 0, totalTaxes = 0, totalGrowth = 0, totalHarvested = 0;
  let peak = p.corpus, maxDD = 0, exhaustedMonth = null;

  let yStartTotal = p.corpus, yWithdrawn = 0, yGrowth = 0, yTaxes = 0, yRepl = false, yInfl = false;

  const blendedIE = (lpn[0] * p.fdReturn + lpn[1] * p.bondReturn + lpn[2] * p.ieEquityReturn) / 100;
  const crashMonth = (p.crashPct > 0) ? (Math.max(1, p.crashYear) - 1) * 12 + 1 : -1;

  const ieValue = () => L1 + L2 + L3;
  const total = () => GE + ieValue() + reserve;

  function rotate(t) {
    if (L1 <= 1e-6 && L2 > 1e-6) { L1 += L2; L2 = 0; rotations.push({ month: t, from: 'Layer 2 · Bonds' }); }
    if (L1 <= 1e-6 && L2 <= 1e-6 && L3 > 1e-6) { L1 += L3; L3 = 0; rotations.push({ month: t, from: 'Layer 3 · Equity' }); }
  }

  /** Present value of the next `years` of withdrawals, discounted at the blended IE return. */
  function fundingTarget(years) {
    let pv = 0;
    for (let y = 0; y < years; y++) {
      const cash = currentMonthly * 12 * (p.inflationAdjust ? Math.pow(1 + infl, y) : 1);
      pv += cash / Math.pow(1 + blendedIE, y + 0.5);
    }
    return pv;
  }

  function replenish(t, forced) {
    const target = fundingTarget(p.ieDuration);
    const shortfall = Math.max(0, target - ieValue());
    if (shortfall <= 0 && !forced) { monthsSinceReplenish = 0; lastReplenishGE = GE; return false; }
    const taxDrag = gainFrac * taxRate;
    const gross = Math.min(GE, shortfall / Math.max(0.05, 1 - taxDrag));
    if (gross <= 1) return false;
    const tax = gross * taxDrag;
    const net = gross - tax;
    GE -= gross; totalTaxes += tax; yTaxes += tax; totalHarvested += gross;
    const pool = ieValue() + net;
    L1 = pool * lpn[0]; L2 = pool * lpn[1]; L3 = pool * lpn[2];
    replenishments.push({
      month: t, year: Math.ceil(t / 12), amount: net, gross: gross, tax: tax,
      geAfter: GE, ieAfter: pool, forced: !!forced
    });
    monthsSinceReplenish = 0; lastReplenishGE = GE; yRepl = true;
    return true;
  }

  /** Fund `amount` from the income engine, cascading layers, then emergency measures.
   *  Returns the amount actually paid out. */
  function fund(amount, t) {
    let need = amount;
    for (let i = 0; i < 4 && need > 1e-6; i++) {
      rotate(t);
      const take = Math.min(L1, need);
      L1 -= take; need -= take;
      if (need > 1e-6 && L1 <= 1e-6 && L2 <= 1e-6 && L3 <= 1e-6) break;
    }
    if (need > 1e-6 && GE > 1e-6) {           // emergency mid-cycle harvest
      replenish(t, true);
      rotate(t);
      const take = Math.min(L1, need);
      L1 -= take; need -= take;
    }
    if (need > 1e-6 && GE > 1e-6) {           // raw harvest, no rebuild
      const taxDrag = gainFrac * taxRate;
      const gross = Math.min(GE, need / Math.max(0.05, 1 - taxDrag));
      GE -= gross; totalTaxes += gross * taxDrag; yTaxes += gross * taxDrag;
      need -= gross * (1 - taxDrag);
    }
    if (need > 1e-6 && reserve > 1e-6) {      // emergency reserve, last resort
      const take = Math.min(reserve, need);
      reserve -= take; need -= take;
    }
    return amount - Math.max(0, need);
  }

  // --- monthly loop -------------------------------------------------------------------
  for (let t = 1; t <= totalMonths; t++) {
    const isYearStart = (t - 1) % 12 === 0;
    const yearIdx = Math.floor((t - 1) / 12) + 1;

    if (isYearStart && t > 1) {
      // annual inflation escalation, subject to the drawdown guardrail
      const dd = peak > 0 ? (peak - total()) / peak : 0;
      inflationPaused = p.guardrail && dd >= 0.20;
      if (p.inflationAdjust && !inflationPaused) { currentMonthly *= (1 + infl); yInfl = true; }
    }

    if (t === crashMonth) { GE *= (1 - p.crashPct / 100); L3 *= (1 - p.crashPct / 100); }

    // growth accrual — engines compound independently
    const gRate = drawGE();
    const before = total();
    GE *= (1 + gRate);
    L1 *= (1 + rFD); L2 *= (1 + rBond); L3 *= (1 + rEq); reserve *= (1 + rFD);
    const grown = total() - before;
    totalGrowth += grown; yGrowth += grown;

    // withdrawal
    if ((t - 1) % stepMonths === 0) {
      const amount = currentMonthly * stepMonths;
      const funded = fund(amount, t);
      totalWithdrawn += funded; yWithdrawn += funded;
      if (funded < amount - 1e-6) exhaustedMonth = t;
    }

    monthsSinceReplenish++;

    // replenishment decision
    if (!exhaustedMonth && GE > 1) {
      const monthsLeft = currentMonthly > 0 ? ieValue() / currentMonthly : Infinity;
      let trigger = false;
      if (p.replenishRule === 'calendar') {
        trigger = monthsSinceReplenish >= p.ieDuration * 12 || monthsLeft < 1.5;
      } else { // opportunistic
        trigger = (monthsLeft < p.replenishThreshold && GE > lastReplenishGE) || monthsLeft < 1.5;
      }
      if (trigger) replenish(t, false);
    }

    // periodic re-proportioning of the income engine layers
    if (p.rebalanceFreq !== 'none' && !exhaustedMonth) {
      const every = p.rebalanceFreq === 'quarterly' ? 3 : 12;
      if (t % every === 0) { const pool = ieValue(); L1 = pool * lpn[0]; L2 = pool * lpn[1]; L3 = pool * lpn[2]; }
    }

    const tot = total();
    if (tot > peak) peak = tot;
    if (peak > 0) maxDD = Math.max(maxDD, (peak - tot) / peak);

    if (!light) {
      monthly.push({ m: t, year: +(t / 12).toFixed(3), total: tot, ge: GE, ie: ieValue(), l1: L1, l2: L2, l3: L3, reserve: reserve, withdrawal: currentMonthly });
    }

    // year close
    if (t % 12 === 0 || t === totalMonths || exhaustedMonth) {
      yearly.push({
        year: yearIdx, begin: yStartTotal, withdrawal: yWithdrawn, growth: yGrowth,
        ending: tot, ge: GE, ie: ieValue(), reserve: reserve,
        replenished: yRepl, inflationApplied: yInfl, taxes: yTaxes,
        monthlyWithdrawal: currentMonthly
      });
      yStartTotal = tot; yWithdrawn = 0; yGrowth = 0; yTaxes = 0; yRepl = false; yInfl = false;
    }
    if (exhaustedMonth) break;
  }

  const survivedMonths = exhaustedMonth ? exhaustedMonth - 1 : totalMonths;
  const survivedYears = survivedMonths / 12;
  const endingTotal = total();
  const nYears = yearly.length || 1;

  return {
    inputs: p,
    monthly, yearly, replenishments, rotations,
    exhausted: !!exhaustedMonth,
    exhaustedYear: exhaustedMonth ? Math.ceil(exhaustedMonth / 12) : null,
    survivedYears,
    endingTotal,
    endingGE: GE,
    endingIE: ieValue(),
    endingReserve: reserve,
    totalWithdrawn, totalGrowth, totalTaxes, totalHarvested,
    replenishCount: replenishments.length,
    maxDrawdown: maxDD * 100,
    avgAnnualWithdrawal: totalWithdrawn / nYears,
    finalMonthlyWithdrawal: currentMonthly,
    startingReserve: Math.min(Math.max(0, p.emergencyMonths) * p.monthlyWithdrawal, p.corpus * 0.5),
    startingGE: investable * (p.growthAlloc / 100),
    startingIE: ie0
  };
}

/* =====================================================================================
   3. MONTE CARLO
   ===================================================================================== */
function percentile(sortedArr, q) {
  if (!sortedArr.length) return 0;
  const idx = (sortedArr.length - 1) * q;
  const lo = Math.floor(idx), hi = Math.ceil(idx);
  return lo === hi ? sortedArr[lo] : sortedArr[lo] + (sortedArr[hi] - sortedArr[lo]) * (idx - lo);
}

function runMonteCarloBatch(p, count, seedBase, acc) {
  const years = p.simYears;
  for (let i = 0; i < count; i++) {
    const rand = mulberry32(seedBase + i * 7919 + 1);
    const r = runSimulation(p, { stochastic: true, rand: rand, light: true });
    acc.survival.push(r.survivedYears);
    acc.ending.push(r.exhausted ? 0 : r.endingTotal);
    for (let y = 1; y <= years; y++) {
      const row = r.yearly[y - 1];
      if (!acc.byYear[y]) acc.byYear[y] = [];
      acc.byYear[y].push(row ? Math.max(0, row.ending) : 0);
    }
  }
  return acc;
}

function summariseMonteCarlo(acc, p) {
  const n = acc.survival.length || 1;
  const surv = h => acc.survival.filter(s => s >= h - 1e-9).length / n * 100;
  const curves = [{ year: 0, p10: p.corpus, p25: p.corpus, p50: p.corpus, p75: p.corpus, p90: p.corpus }];
  for (let y = 1; y <= p.simYears; y++) {
    const arr = (acc.byYear[y] || []).slice().sort((a, b) => a - b);
    curves.push({
      year: y,
      p10: percentile(arr, 0.10), p25: percentile(arr, 0.25), p50: percentile(arr, 0.50),
      p75: percentile(arr, 0.75), p90: percentile(arr, 0.90)
    });
  }
  const sortedEnd = acc.ending.slice().sort((a, b) => a - b);
  const sortedSurv = acc.survival.slice().sort((a, b) => a - b);
  return {
    runs: n, curves,
    survival: { 20: surv(20), 30: surv(30), 40: surv(40), 50: surv(50) },
    successRate: acc.survival.filter(s => s >= p.simYears - 1e-9).length / n * 100,
    medianEnding: percentile(sortedEnd, 0.5),
    p10Ending: percentile(sortedEnd, 0.10),
    p90Ending: percentile(sortedEnd, 0.90),
    worstSurvival: sortedSurv[0] || 0,
    medianSurvival: percentile(sortedSurv, 0.5)
  };
}

/* =====================================================================================
   4. STRESS SCENARIOS
   ===================================================================================== */
function buildScenarios(p) {
  const crashPct = p.crashPct > 0 ? p.crashPct : 30;
  const crashYear = p.crashPct > 0 ? p.crashYear : Math.max(1, Math.min(p.simYears, 5));
  return [
    { key: 'A', name: 'A · No inflation', color: '#0f766e', note: 'Withdrawal held flat for life', params: { ...p, inflationAdjust: false, crashPct: 0 } },
    { key: 'B', name: 'B · Inflation indexed', color: '#1d4ed8', note: 'Withdrawal grows ' + fmtPct(p.inflation) + ' p.a.', params: { ...p, inflationAdjust: true, crashPct: 0 } },
    { key: 'C', name: 'C · Market crash', color: '#b45309', note: crashPct + '% crash in year ' + crashYear, params: { ...p, inflationAdjust: true, crashPct: crashPct, crashYear: crashYear } },
    { key: 'D', name: 'D · Lower CAGR', color: '#b91c1c', note: 'Growth engine at ' + fmtPct(Math.max(1, p.growthReturn - 4)), params: { ...p, inflationAdjust: true, crashPct: 0, growthReturn: Math.max(1, p.growthReturn - 4) } }
  ].map(s => ({ ...s, result: runSimulation(s.params) }));
}

/* =====================================================================================
   5. VALIDATION
   ===================================================================================== */
function validate(p) {
  const errs = [];
  const warn = [];
  if (!(p.corpus > 0)) errs.push('Total initial corpus must be greater than zero.');
  if (p.monthlyWithdrawal < 0 || p.corpus < 0) errs.push('Inputs cannot be negative.');
  const layerSum = Math.round((p.layer1 + p.layer2 + p.layer3) * 100) / 100;
  if (Math.abs(layerSum - 100) > 0.01) errs.push('Income Engine layers total ' + layerSum.toFixed(1) + '% — they must total exactly 100%.');
  const allocSum = Math.round((p.growthAlloc + (100 - p.growthAlloc)) * 100) / 100;
  if (Math.abs(allocSum - 100) > 0.01) errs.push('Growth + Income allocation must equal 100%.');
  [['fdReturn', 'Floating FD return'], ['bondReturn', 'Bond return'], ['ieEquityReturn', 'Income engine equity return'],
   ['growthReturn', 'Growth engine return'], ['growthSD', 'Growth engine standard deviation'],
   ['inflation', 'Inflation'], ['taxRate', 'Tax rate'], ['monthlyWithdrawal', 'Monthly withdrawal']]
    .forEach(([k, label]) => { if (p[k] < 0) errs.push(label + ' cannot be negative.'); });
  const reserve = Math.min(p.emergencyMonths * p.monthlyWithdrawal, p.corpus * 0.5);
  const ie0 = (p.corpus - reserve) * (1 - p.growthAlloc / 100);
  const step = p.frequency === 'yearly' ? 12 : p.frequency === 'quarterly' ? 3 : 1;
  if (ie0 < p.monthlyWithdrawal * step) errs.push('First withdrawal (' + fmtShort(p.monthlyWithdrawal * step) + ') exceeds the entire Income Engine (' + fmtShort(ie0) + '). Raise the corpus, cut the withdrawal, or shift allocation to the Income Engine.');
  else if (ie0 < p.monthlyWithdrawal * 24) warn.push('Income Engine holds under 24 months of spending at the start — replenishment will trigger very early.');
  const rate = p.corpus > 0 ? (p.monthlyWithdrawal * 12) / p.corpus * 100 : 0;
  if (rate > 6) warn.push('Initial withdrawal rate is ' + fmtPct(rate) + ' of corpus — historically aggressive above ~5%.');
  if (p.taxRate > 40) warn.push('Tax rate above 40% is unusual for Indian long-term capital gains.');
  return { errs, warn, withdrawalRate: rate };
}

function buildTableRows(result) {
  return result.yearly.map(y => ({
    Year: y.year,
    'Beginning Portfolio': Math.round(y.begin),
    Withdrawal: Math.round(y.withdrawal),
    Growth: Math.round(y.growth),
    'Ending Portfolio': Math.round(y.ending),
    'Growth Engine': Math.round(y.ge),
    'Income Engine': Math.round(y.ie),
    Replenished: y.replenished ? 'Yes' : 'No',
    'Inflation Applied': y.inflationApplied ? 'Yes' : 'No',
    Taxes: Math.round(y.taxes)
  }));
}

function download(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 500);
}

function exportCSV(result) {
  const rows = buildTableRows(result);
  if (!rows.length) return;
  const head = Object.keys(rows[0]);
  const csv = [head.join(',')].concat(rows.map(r => head.map(h => r[h]).join(','))).join('\n');
  download(new Blob([csv], { type: 'text/csv;charset=utf-8;' }), 'DERS-annual-report.csv');
}

function exportExcel(result) {
  if (!window.XLSX) { alert('Excel library did not load — try the CSV export.'); return; }
  const rows = buildTableRows(result);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), 'Annual Report');
  const p = result.inputs;
  const assumptions = Object.keys(p).map(k => ({ Assumption: k, Value: p[k] }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(assumptions), 'Assumptions');
  XLSX.writeFile(wb, 'DERS-annual-report.xlsx');
}

function exportPDF(result) {
  const jsPDFCtor = window.jspdf && window.jspdf.jsPDF;
  if (!jsPDFCtor) { alert('PDF library did not load — try the CSV export.'); return; }
  const doc = new jsPDFCtor({ orientation: 'landscape', unit: 'pt', format: 'a4' });
  const rows = buildTableRows(result);
  const head = [Object.keys(rows[0] || {})];
  const body = rows.map(r => Object.keys(r).map(k => typeof r[k] === 'number' && k !== 'Year' ? inr.format(r[k]) : r[k]));
  doc.setFontSize(15); doc.text('Dual Engine Rotation Strategy — Annual Report', 40, 40);
  doc.setFontSize(9); doc.setTextColor(110);
  doc.text('Corpus ' + fmtShort(result.inputs.corpus).replace('₹', 'Rs ') +
    '  |  Growth allocation ' + fmtPct(result.inputs.growthAlloc) +
    '  |  Withdrawal ' + fmtShort(result.inputs.monthlyWithdrawal).replace('₹', 'Rs ') + '/month' +
    '  |  Longevity ' + (result.exhausted ? result.survivedYears.toFixed(1) + ' years' : 'full ' + result.inputs.simYears + '-year horizon'), 40, 56);
  doc.autoTable({
    head: head, body: body, startY: 70, styles: { fontSize: 7, cellPadding: 3 },
    headStyles: { fillColor: [15, 23, 42], textColor: 255, fontSize: 7 },
    alternateRowStyles: { fillColor: [246, 248, 251] }, margin: { left: 40, right: 40 }
  });
  doc.save('DERS-annual-report.pdf');
}

/* =====================================================================================
   11. MONTE CARLO
   ===================================================================================== */
function MonteCarlo({ params, dark }) {
  const [runs, setRuns] = useState(1000);
  const [state, setState] = useState({ status: 'idle', progress: 0, summary: null, forYears: null });
  const cancelRef = useRef(0);

  const start = useCallback(() => {
    const token = ++cancelRef.current;
    const acc = { survival: [], ending: [], byYear: {} };
    const batch = runs >= 5000 ? 100 : 50;
    let done = 0;
    setState({ status: 'running', progress: 0, summary: null, forYears: params.simYears });
    const tick = () => {
      if (cancelRef.current !== token) return;
      const n = Math.min(batch, runs - done);
      runMonteCarloBatch(params, n, 1000 + done, acc);
      done += n;
      if (done < runs) {
        setState(s => ({ ...s, progress: done / runs }));
        setTimeout(tick, 0);
      } else {
        setState({ status: 'done', progress: 1, summary: summariseMonteCarlo(acc, params), forYears: params.simYears });
      }
    };
    setTimeout(tick, 30);
  }, [params, runs]);

  useEffect(() => { cancelRef.current++; setState({ status: 'idle', progress: 0, summary: null, forYears: null }); }, [params]);

  const ax = useAxisProps(dark);
  const grid = dark ? '#1e293b' : '#eef2f7';
  const s = state.summary;
  const horizons = [20, 30, 40, 50];

  return (
    <Panel title="Monte Carlo simulation"
      subtitle={'Growth engine returns drawn from a lognormal distribution: mean ' + fmtPct(params.growthReturn) + ', volatility ' + fmtPct(params.growthSD)}
      right={
        <div className="flex flex-wrap items-center gap-1.5 no-print">
          {[500, 1000, 5000].map(n => (
            <Btn key={n} size="sm" variant={runs === n ? 'solid' : 'ghost'} onClick={() => setRuns(n)}>{inr.format(n)}</Btn>
          ))}
          <Btn size="sm" variant="primary" onClick={start} disabled={state.status === 'running'}>
            {state.status === 'running' ? 'Running…' : 'Run simulation'}
          </Btn>
        </div>
      }>
      {state.status === 'idle' && (
        <div className="rounded-lg border border-dashed border-ink-300 dark:border-ink-700 p-8 text-center">
          <p className="text-sm font-medium text-ink-700 dark:text-ink-200">Run {inr.format(runs)} randomised paths</p>
          <p className="mx-auto mt-1.5 max-w-md text-[12px] leading-relaxed text-ink-500 dark:text-ink-400">
            The deterministic simulation assumes the growth engine earns exactly {fmtPct(params.growthReturn)} every single year. Monte Carlo replaces that
            with a random return each month, so you can see how sequence-of-returns risk affects survival.
          </p>
        </div>
      )}
      {state.status === 'running' && (
        <div className="py-10 text-center">
          <div className="mx-auto h-1.5 w-64 overflow-hidden rounded-full bg-ink-200 dark:bg-ink-800">
            <div className="h-full rounded-full bg-accent transition-all duration-150" style={{ width: (state.progress * 100).toFixed(1) + '%' }} />
          </div>
          <p className="num mt-3 text-[12px] text-ink-500">{Math.round(state.progress * runs)} of {inr.format(runs)} paths simulated</p>
        </div>
      )}
      {state.status === 'done' && s && (
        <div className="space-y-5 fade-in">
          <div className="grid grid-cols-2 gap-3 lg:grid-cols-4">
            {horizons.map(h => {
              const ok = h <= state.forYears;
              const v = s.survival[h];
              const tone = !ok ? 'plain' : v >= 85 ? 'growth' : v >= 60 ? 'income' : 'danger';
              return <Stat key={h} label={'Survives ' + h + ' years'} tone={tone}
                value={ok ? fmtPct(v, 1) : '—'}
                sub={ok ? inr.format(Math.round(v / 100 * s.runs)) + ' of ' + inr.format(s.runs) + ' paths' : 'Extend the horizon beyond ' + state.forYears + ' years'} />;
            })}
          </div>
          <div className="grid grid-cols-2 gap-3 lg:grid-cols-4">
            <Stat label="Success rate" value={fmtPct(s.successRate, 1)} sub={'Full ' + state.forYears + '-year horizon'} tone={s.successRate >= 85 ? 'growth' : s.successRate >= 60 ? 'income' : 'danger'} />
            <Stat label="Median ending value" value={fmtShort(s.medianEnding)} sub="50th percentile" tone="accent" />
            <Stat label="10th percentile ending" value={fmtShort(s.p10Ending)} sub="Bad-luck outcome" />
            <Stat label="Worst path longevity" value={s.worstSurvival >= state.forYears ? state.forYears + '+ yrs' : s.worstSurvival.toFixed(1) + ' yrs'} sub={'Median ' + (s.medianSurvival >= state.forYears ? state.forYears + '+' : s.medianSurvival.toFixed(1)) + ' yrs'} tone={s.worstSurvival >= state.forYears ? 'growth' : 'danger'} />
          </div>
          <div style={{ height: 320 }}>
            {R && (
              <R.ResponsiveContainer width="100%" height="100%">
                <R.AreaChart data={s.curves} margin={{ top: 8, right: 12, left: 4, bottom: 4 }}>
                  <defs>
                    <linearGradient id="mcBand" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0%" stopColor="#1d4ed8" stopOpacity={0.18} />
                      <stop offset="100%" stopColor="#1d4ed8" stopOpacity={0.03} />
                    </linearGradient>
                  </defs>
                  <R.CartesianGrid stroke={grid} vertical={false} />
                  <R.XAxis dataKey="year" {...ax} minTickGap={22} />
                  <R.YAxis {...ax} tickFormatter={fmtAxis} width={52} />
                  <R.Tooltip content={<TipBox />} />
                  <R.Legend wrapperStyle={{ fontSize: 11 }} iconType="plainline" iconSize={14} />
                  <R.Area type="monotone" dataKey="p90" name="90th percentile" stroke="#93c5fd" fill="url(#mcBand)" strokeWidth={1.5} dot={false} isAnimationActive={false} />
                  <R.Area type="monotone" dataKey="p75" name="75th percentile" stroke="#60a5fa" fill="none" strokeWidth={1.5} dot={false} isAnimationActive={false} />
                  <R.Area type="monotone" dataKey="p50" name="Median" stroke="#1d4ed8" fill="none" strokeWidth={2.5} dot={false} isAnimationActive={false} />
                  <R.Area type="monotone" dataKey="p25" name="25th percentile" stroke="#f59e0b" fill="none" strokeWidth={1.5} dot={false} isAnimationActive={false} />
                  <R.Area type="monotone" dataKey="p10" name="10th percentile" stroke="#b91c1c" fill="none" strokeWidth={1.5} strokeDasharray="4 3" dot={false} isAnimationActive={false} />
                </R.AreaChart>
              </R.ResponsiveContainer>
            )}
          </div>
          <p className="text-[11px] leading-relaxed text-ink-500 dark:text-ink-400">
            Percentile bands are computed across {inr.format(s.runs)} independent paths. A path that exhausts is carried forward at zero,
            which is why the lower percentiles flatten along the axis. Volatility is applied to the Growth Engine only — the Income Engine’s
            debt layers are modelled at their stated yields.
          </p>
        </div>
      )}
    </Panel>
  );
}

   ===================================================================================== */
function InputPanel({ p, set, setMany, reset, errors, warnings, withdrawalRate }) {
  const incomeAlloc = 100 - p.growthAlloc;
  const layerSum = p.layer1 + p.layer2 + p.layer3;
  const reserveAmt = Math.min(p.emergencyMonths * p.monthlyWithdrawal, p.corpus * 0.5);
  const investable = Math.max(0, p.corpus - reserveAmt);

  // editing one layer rebalances the other two proportionally
  const setLayer = (key, val) => {
    const v = clamp(Number(val) || 0, 0, 100);
    const others = ['layer1', 'layer2', 'layer3'].filter(k => k !== key);
    const rest = 100 - v;
    const cur = others.map(k => p[k]);
    const curSum = cur[0] + cur[1];
    const next = curSum > 0
      ? [rest * cur[0] / curSum, rest * cur[1] / curSum]
      : [rest / 2, rest / 2];
    setMany({ [key]: v, [others[0]]: Math.round(next[0] * 10) / 10, [others[1]]: Math.round(next[1] * 10) / 10 });
  };

  return (
    <div className={CARD + ' overflow-hidden'}>
      <header className="flex items-center justify-between gap-2 border-b border-ink-200/80 dark:border-ink-800 px-4 py-3 sm:px-5">
        <h2 className="text-[13px] font-semibold uppercase tracking-wider text-ink-800 dark:text-ink-100">Assumptions</h2>
        <Btn size="sm" onClick={reset}>Reset</Btn>
      </header>

      {(errors.length > 0 || warnings.length > 0) && (
        <div className="space-y-2 border-b border-ink-200/80 dark:border-ink-800 p-4 sm:p-5">
          {errors.map((e, i) => (
            <div key={'e' + i} className="flex gap-2 rounded-lg border border-danger/30 bg-danger/[0.07] p-2.5 text-[11px] leading-relaxed text-danger dark:text-danger-soft">
              <span className="mt-px font-bold">!</span><span>{e}</span>
            </div>
          ))}
          {warnings.map((w, i) => (
            <div key={'w' + i} className="flex gap-2 rounded-lg border border-income/30 bg-income/[0.07] p-2.5 text-[11px] leading-relaxed text-income dark:text-income-soft">
              <span className="mt-px font-bold">•</span><span>{w}</span>
            </div>
          ))}
        </div>
      )}

      <Group title="Portfolio">
        <NumField label="Total initial corpus" tip={TIPS.corpus} prefix="₹" value={p.corpus}
          onChange={v => set('corpus', v)} min={0} step={100000} hint={fmtShort(p.corpus)} />
        <SliderField label="Growth engine allocation" tip={TIPS.growthAlloc} value={p.growthAlloc}
          onChange={v => set('growthAlloc', v)} min={20} max={90} step={0.01}
          display={fmtPct(p.growthAlloc, 2)} ticks={['20%', '55%', '90%']} />
        <div className="grid grid-cols-2 gap-3">
          <div className="rounded-lg border border-growth/25 bg-growth/[0.06] p-3">
            <div className="text-[10px] font-semibold uppercase tracking-wider text-growth dark:text-growth-soft">Growth engine</div>
            <div className="num mt-1 text-[15px] font-semibold text-ink-900 dark:text-ink-50">{fmtShort(investable * p.growthAlloc / 100)}</div>
            <div className="num text-[11px] text-ink-500">{fmtPct(p.growthAlloc, 2)}</div>
          </div>
          <div className="rounded-lg border border-income/25 bg-income/[0.06] p-3">
            <div className="text-[10px] font-semibold uppercase tracking-wider text-income dark:text-income-soft">Income engine<Info tip={TIPS.incomeAlloc} /></div>
            <div className="num mt-1 text-[15px] font-semibold text-ink-900 dark:text-ink-50">{fmtShort(investable * incomeAlloc / 100)}</div>
            <div className="num text-[11px] text-ink-500">{fmtPct(incomeAlloc, 2)} · auto</div>
          </div>
        </div>
      </Group>

      <Group title="Income engine structure" tip={TIPS.layers}>
        <div className="space-y-3">
          {[
            { k: 'layer1', n: 'Layer 1 · Floating FD / liquid fund', c: PALETTE.l1 },
            { k: 'layer2', n: 'Layer 2 · Corporate bonds / debt', c: PALETTE.l2 },
            { k: 'layer3', n: 'Layer 3 · Equity', c: PALETTE.l3 }
          ].map(l => (
            <div key={l.k} className="flex items-center gap-3">
              <span className="h-8 w-1 shrink-0 rounded-full" style={{ background: l.c }} />
              <div className="min-w-0 flex-1">
                <div className="truncate text-[12px] font-medium text-ink-700 dark:text-ink-200">{l.n}</div>
                <div className="num text-[11px] text-ink-500">{fmtShort(investable * incomeAlloc / 100 * p[l.k] / 100)}</div>
              </div>
              <div className="relative w-20 shrink-0">
                <input type="number" value={p[l.k]} min={0} max={100} step={0.5}
                  onChange={e => setLayer(l.k, e.target.value)}
                  className={FIELD + ' pr-6 text-right'} />
                <span className="pointer-events-none absolute right-2 top-1/2 -translate-y-1/2 text-xs text-ink-400">%</span>
              </div>
            </div>
          ))}
          <div className={'flex items-center justify-between rounded-lg px-3 py-2 text-[11px] font-semibold ' +
            (Math.abs(layerSum - 100) < 0.01 ? 'bg-growth/10 text-growth dark:text-growth-soft' : 'bg-danger/10 text-danger dark:text-danger-soft')}>
            <span>Total allocation</span><span className="num">{layerSum.toFixed(1)}%</span>
          </div>
          <p className="text-[11px] leading-relaxed text-ink-500 dark:text-ink-400">
            Editing one layer automatically rebalances the other two so the structure always totals 100%.
          </p>
        </div>
      </Group>

      <Group title="Return assumptions">
        <div className="grid grid-cols-2 gap-3">
          <NumField label="Floating FD return" tip={TIPS.fd} suffix="%" value={p.fdReturn} onChange={v => set('fdReturn', v)} step={0.25} min={0} />
          <NumField label="Bond return" tip={TIPS.bond} suffix="%" value={p.bondReturn} onChange={v => set('bondReturn', v)} step={0.25} min={0} />
          <NumField label="IE equity return" tip={TIPS.ieEquity} suffix="%" value={p.ieEquityReturn} onChange={v => set('ieEquityReturn', v)} step={0.5} min={0} />
          <NumField label="Growth engine return" tip={TIPS.growthReturn} suffix="%" value={p.growthReturn} onChange={v => set('growthReturn', v)} step={0.5} min={0} />
          <NumField label="Growth engine SD" tip={TIPS.growthSD} suffix="%" value={p.growthSD} onChange={v => set('growthSD', v)} step={0.5} min={0} />
          <NumField label="Inflation" tip={TIPS.inflation} suffix="%" value={p.inflation} onChange={v => set('inflation', v)} step={0.25} min={0} />
        </div>
      </Group>

      <Group title="Withdrawals">
        <NumField label="Initial monthly withdrawal" tip={TIPS.withdrawal} prefix="₹" value={p.monthlyWithdrawal}
          onChange={v => set('monthlyWithdrawal', v)} step={1000} min={0}
          hint={fmtShort(p.monthlyWithdrawal) + ' / month · ' + fmtShort(p.monthlyWithdrawal * 12) + ' a year · ' + fmtPct(withdrawalRate, 2) + ' of corpus'} />
        <div className="grid grid-cols-2 gap-3">
          <SelectField label="Withdrawal frequency" tip={TIPS.frequency} value={p.frequency} onChange={v => set('frequency', v)}
            options={[{ value: 'monthly', label: 'Monthly' }, { value: 'quarterly', label: 'Quarterly' }, { value: 'yearly', label: 'Yearly' }]} />
          <SelectField label="Income engine duration" tip={TIPS.duration} value={String(p.ieDuration)} onChange={v => set('ieDuration', Number(v))}
            options={[3, 4, 5, 6, 7].map(y => ({ value: String(y), label: y + ' years' }))} />
        </div>
        <Check big checked={p.inflationAdjust} onChange={v => set('inflationAdjust', v)}
          title="Increase withdrawal every year with inflation"
          description={p.inflationAdjust
            ? 'Year 1 ' + fmtINR(p.monthlyWithdrawal) + ' → Year 2 ' + fmtINR(p.monthlyWithdrawal * (1 + p.inflation / 100)) + ' → Year 3 ' + fmtINR(p.monthlyWithdrawal * Math.pow(1 + p.inflation / 100, 2)) + ' …'
            : 'Withdrawal stays fixed at ' + fmtINR(p.monthlyWithdrawal) + ' for life — purchasing power erodes at ' + fmtPct(p.inflation) + ' a year.'} />
        <SelectField label="Emergency reserve" tip={TIPS.reserve} value={String(p.emergencyMonths)} onChange={v => set('emergencyMonths', Number(v))}
          options={[0, 6, 12, 18, 24].map(m => ({ value: String(m), label: m === 0 ? 'None' : m + ' months of expenses' }))}
          hint={reserveAmt > 0 ? 'Ring-fenced: ' + fmtShort(reserveAmt) : 'No reserve carved out'} />
      </Group>

      <Group title="Replenishment rules">
        <Radio value={p.replenishRule} onChange={v => set('replenishRule', v)} options={[
          { value: 'calendar', label: 'Strict calendar', description: 'Rotate capital exactly every ' + p.ieDuration + ' years, regardless of market level.' },
          { value: 'opportunistic', label: 'Opportunistic', description: 'Rotate when the income engine holds under ' + p.replenishThreshold + ' months of spending and the growth engine is above its level at the last refill.' },
          { value: 'valuation', label: 'Valuation aware', badge: 'Coming soon', disabled: true, description: 'Scale the harvest with equity valuations.' }
        ]} />
        <SelectField label="Replenishment method" tip={TIPS.method} value={p.replenishMethod} onChange={v => set('replenishMethod', v)}
          options={[
            { value: 'proportional', label: 'Harvest proportionally' },
            { value: 'best', label: 'Harvest best performing first' },
            { value: 'manual', label: 'Harvest manually' }
          ]}
          hint={'Assumed taxable-gain share of each harvest: ' + fmtPct(HARVEST_GAIN_FRACTION[p.replenishMethod] * 100, 0)} />
        <Check checked={p.guardrail} onChange={v => set('guardrail', v)}
          title="Pause inflation increase after 20% drawdown"
          description="Skips the annual step-up while the portfolio sits more than 20% below its high-water mark, and resumes on recovery." />
      </Group>

      <Group title="Simulation">
        <SliderField label="Simulation length" tip={TIPS.simYears} value={p.simYears} onChange={v => set('simYears', v)}
          min={10} max={50} step={1} display={p.simYears + ' years'} ticks={['10', '20', '30', '40', '50']} />
      </Group>

      <Group title="Advanced settings" defaultOpen={false}>
        <div className="grid grid-cols-2 gap-3">
          <NumField label="Tax rate on gains" tip={TIPS.tax} suffix="%" value={p.taxRate} onChange={v => set('taxRate', v)} step={1} min={0} max={50} />
          <NumField label="Replenishment threshold" tip={TIPS.threshold} suffix="mo" value={p.replenishThreshold} onChange={v => set('replenishThreshold', v)} step={1} min={1} max={60} />
        </div>
        <SelectField label="Income engine rebalancing" tip={TIPS.rebalance} value={p.rebalanceFreq} onChange={v => set('rebalanceFreq', v)}
          options={[{ value: 'none', label: 'None — pure sequential rotation' }, { value: 'annual', label: 'Annual re-proportioning' }, { value: 'quarterly', label: 'Quarterly re-proportioning' }]} />
        <div className="grid grid-cols-2 gap-3">
          <SelectField label="Market crash" tip={TIPS.crash} value={String(p.crashPct)} onChange={v => set('crashPct', Number(v))}
            options={[0, 20, 30, 40, 50].map(c => ({ value: String(c), label: c === 0 ? 'None' : '−' + c + '%' }))} />
          <SelectField label="Crash year" tip={TIPS.crashYear} value={String(p.crashYear)} onChange={v => set('crashYear', Number(v))}
            options={Array.from({ length: 40 }, (_, i) => ({ value: String(i + 1), label: 'Year ' + (i + 1) }))} />
        </div>
        <div className="rounded-lg border border-ink-200 dark:border-ink-800 bg-ink-50/60 dark:bg-ink-950/40 p-3">
          <div className="text-[10px] font-semibold uppercase tracking-wider text-ink-500">Derived assumptions</div>
          <dl className="mt-2 space-y-1.5 text-[11px]">
            <div className="flex justify-between"><dt className="text-ink-500">Real growth engine return</dt><dd className="num font-semibold">{fmtPct(((1 + p.growthReturn / 100) / (1 + p.inflation / 100) - 1) * 100, 2)}</dd></div>
            <div className="flex justify-between"><dt className="text-ink-500">Blended income engine yield</dt><dd className="num font-semibold">{fmtPct((p.layer1 * p.fdReturn + p.layer2 * p.bondReturn + p.layer3 * p.ieEquityReturn) / 100, 2)}</dd></div>
            <div className="flex justify-between"><dt className="text-ink-500">Blended portfolio return</dt><dd className="num font-semibold">{fmtPct((p.growthAlloc * p.growthReturn + (100 - p.growthAlloc) * ((p.layer1 * p.fdReturn + p.layer2 * p.bondReturn + p.layer3 * p.ieEquityReturn) / 100)) / 100, 2)}</dd></div>
            <div className="flex justify-between"><dt className="text-ink-500">Initial withdrawal rate</dt><dd className="num font-semibold">{fmtPct(withdrawalRate, 2)}</dd></div>
          </dl>
        </div>
      </Group>
    </div>
  );
}

/* =====================================================================================
   14. APP
   ===================================================================================== */
function App() {
  const [p, setP] = useState(DEFAULTS);
  const [dark, setDark] = useState(() => window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  const [tab, setTab] = useState('dashboard');

  useEffect(() => { document.documentElement.classList.toggle('dark', dark); }, [dark]);

  const set = useCallback((k, v) => setP(s => ({ ...s, [k]: v === '' ? '' : v })), []);
  const setMany = useCallback(obj => setP(s => ({ ...s, ...obj })), []);
  const reset = useCallback(() => setP(DEFAULTS), []);

  // sanitise: empty inputs fall back to zero for the engine only
  const clean = useMemo(() => {
    const c = { ...p };
    Object.keys(c).forEach(k => { if (c[k] === '' || (typeof c[k] === 'number' && !isFinite(c[k]))) c[k] = 0; });
    c.simYears = clamp(c.simYears || 35, 1, 50);
    c.growthAlloc = clamp(c.growthAlloc, 0, 100);
    return c;
  }, [p]);

  const { errs, warn, withdrawalRate } = useMemo(() => validate(clean), [clean]);
  const valid = errs.length === 0;
  const result = useMemo(() => valid ? runSimulation(clean) : null, [clean, valid]);

  const realEnding = result ? result.endingTotal / Math.pow(1 + clean.inflation / 100, result.survivedYears) : 0;

  const tabs = [
    { id: 'dashboard', label: 'Dashboard' },
    { id: 'report', label: 'Annual report' },
    { id: 'stress', label: 'Stress tests' },
    { id: 'montecarlo', label: 'Monte Carlo' },
    { id: 'roadmap', label: 'Roadmap' }
  ];

  return (
    <div className="min-h-screen">
      <header className="sticky top-0 z-30 border-b border-ink-200/80 dark:border-ink-800 bg-white/85 dark:bg-ink-900/85 backdrop-blur">
        <div className="mx-auto flex max-w-[1600px] flex-wrap items-center justify-between gap-3 px-4 py-3 sm:px-6">
          <div className="flex items-center gap-3">
            <div className="grid h-9 w-9 shrink-0 place-items-center rounded-lg bg-ink-900 dark:bg-ink-100">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke={dark ? '#0f172a' : '#fff'} strokeWidth="2" strokeLinecap="round">
                <circle cx="8" cy="12" r="4.2" /><circle cx="16" cy="12" r="4.2" />
              </svg>
            </div>
            <div>
              <h1 className="text-[15px] font-semibold leading-tight tracking-tight text-ink-900 dark:text-ink-50">Dual Engine Rotation Strategy</h1>
              <p className="text-[11px] leading-tight text-ink-500 dark:text-ink-400">Retirement withdrawal &amp; longevity simulator</p>
            </div>
          </div>
          <div className="flex items-center gap-2">
            {result && (
              <div className="hidden items-center gap-2 md:flex">
                <Pill tone={result.exhausted ? 'bad' : 'ok'}>
                  {result.exhausted ? 'Exhausted in year ' + result.exhaustedYear : 'Survives ' + clean.simYears + ' years'}
                </Pill>
              </div>
            )}
            <button onClick={() => setDark(!dark)} aria-label="Toggle colour scheme"
              className="grid h-9 w-9 place-items-center rounded-lg border border-ink-200 dark:border-ink-700 text-ink-600 dark:text-ink-300 transition hover:bg-ink-100 dark:hover:bg-ink-800">
              {dark
                ? <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="4.5" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
                : <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" /></svg>}
            </button>
          </div>
        </div>
      </header>

      <main className="mx-auto max-w-[1600px] px-4 py-5 sm:px-6 sm:py-6">
        <div className="grid grid-cols-1 gap-5 lg:grid-cols-12">
          <aside className="lg:col-span-4 xl:col-span-3">
            <div className="lg:sticky lg:top-[73px] lg:max-h-[calc(100vh-90px)] lg:overflow-y-auto lg:pr-1">
              <InputPanel p={p} set={set} setMany={setMany} reset={reset} errors={errs} warnings={warn} withdrawalRate={withdrawalRate} />
            </div>
          </aside>

          <div className="space-y-5 lg:col-span-8 xl:col-span-9">
            {!valid && (
              <div className={CARD + ' p-8 text-center'}>
                <h2 className="text-base font-semibold text-ink-900 dark:text-ink-50">Simulation paused</h2>
                <p className="mx-auto mt-1.5 max-w-md text-[12px] leading-relaxed text-ink-500 dark:text-ink-400">
                  Resolve the validation errors in the assumptions panel and the dashboard will recalculate instantly.
                </p>
              </div>
            )}

            {valid && result && (
              <React.Fragment>
                <nav className="flex gap-1 overflow-x-auto rounded-xl border border-ink-200/80 dark:border-ink-800 bg-white dark:bg-ink-900 p-1 no-print">
                  {tabs.map(t => (
                    <button key={t.id} onClick={() => setTab(t.id)}
                      className={'whitespace-nowrap rounded-lg px-3.5 py-2 text-[12px] font-semibold transition ' +
                        (tab === t.id ? 'bg-ink-900 text-white dark:bg-ink-100 dark:text-ink-900' : 'text-ink-500 hover:bg-ink-100 dark:hover:bg-ink-800')}>
                      {t.label}
                    </button>
                  ))}
                </nav>

                {tab === 'dashboard' && (
                  <div className="space-y-5 fade-in">
                    <div className={CARD + ' flex flex-wrap items-center justify-between gap-4 p-4 sm:p-5'}>
                      <div>
                        <div className="text-[10px] font-semibold uppercase tracking-[0.14em] text-ink-500">Verdict</div>
                        <div className={'mt-1 text-xl font-semibold tracking-tight sm:text-2xl ' + (result.exhausted ? 'text-danger dark:text-danger-soft' : 'text-growth dark:text-growth-soft')}>
                          {result.exhausted
                            ? 'Portfolio exhausted in year ' + result.exhaustedYear
                            : 'Plan survives the full ' + clean.simYears + '-year horizon'}
                        </div>
                        <p className="mt-1 max-w-xl text-[12px] leading-relaxed text-ink-500 dark:text-ink-400">
                          {result.exhausted
                            ? 'The income engine could not be refilled — the growth engine ran dry after ' + result.replenishCount + ' replenishment' + (result.replenishCount === 1 ? '' : 's') + '. Reduce the withdrawal, lengthen the income engine duration, or raise the growth allocation.'
                            : 'Ending value of ' + fmtShort(result.endingTotal) + ' after withdrawing ' + fmtShort(result.totalWithdrawn) + ' across ' + clean.simYears + ' years, funded by ' + result.replenishCount + ' replenishment' + (result.replenishCount === 1 ? '' : 's') + '.'}
                        </p>
                      </div>
                      <div className="flex flex-wrap gap-2">
                        <Pill tone={withdrawalRate <= 4 ? 'ok' : withdrawalRate <= 6 ? 'warn' : 'bad'}>{fmtPct(withdrawalRate, 2)} withdrawal rate</Pill>
                        <Pill tone="neutral">{clean.inflationAdjust ? 'Inflation indexed' : 'Fixed withdrawal'}</Pill>
                        <Pill tone="neutral">{clean.replenishRule === 'calendar' ? 'Calendar refills' : 'Opportunistic refills'}</Pill>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 gap-3 sm:grid-cols-2 xl:grid-cols-3">
                      <Stat label="Portfolio longevity" tone={result.exhausted ? 'danger' : 'growth'} tip={TIPS.longevity}
                        value={result.exhausted ? result.survivedYears.toFixed(1) + ' years' : clean.simYears + '+ years'}
                        sub={result.exhausted ? 'Ran out in year ' + result.exhaustedYear : 'Still funded at the horizon'} />
                      <Stat label="Ending portfolio value" tone="accent" value={fmtShort(result.endingTotal)}
                        sub={'≈ ' + fmtShort(realEnding) + ' in today’s rupees'} />
                      <Stat label="Total withdrawn" tone="income" value={fmtShort(result.totalWithdrawn)}
                        sub={(result.totalWithdrawn / clean.corpus).toFixed(2) + '× the starting corpus'} />
                      <Stat label="Total growth generated" tone="growth" value={fmtShort(result.totalGrowth)}
                        sub="Compounding across both engines" />
                      <Stat label="Replenishments" tip={TIPS.replenishCount} value={String(result.replenishCount)}
                        sub={result.replenishCount ? 'Harvested ' + fmtShort(result.totalHarvested) + ' in total' : 'Income engine never refilled'} />
                      <Stat label="Largest drawdown" tone={result.maxDrawdown > 30 ? 'danger' : 'plain'} tip={TIPS.drawdown}
                        value={fmtPct(result.maxDrawdown, 1)} sub="Peak-to-trough on total value" />
                      <Stat label="Average annual withdrawal" value={fmtShort(result.avgAnnualWithdrawal)}
                        sub={'Final monthly draw ' + fmtShort(result.finalMonthlyWithdrawal)} />
                      <Stat label="Growth engine remaining" tone="growth" value={fmtShort(result.endingGE)}
                        sub={'Started at ' + fmtShort(result.startingGE)} />
                      <Stat label="Income engine remaining" tone="income" value={fmtShort(result.endingIE)}
                        sub={clean.monthlyWithdrawal > 0 ? (result.endingIE / result.finalMonthlyWithdrawal).toFixed(1) + ' months of cover left' : '—'} />
                    </div>

                    <Charts result={result} dark={dark} params={clean} />

                    <div className={CARD + ' p-4 sm:p-5'}>
                      <h3 className="text-[12px] font-semibold uppercase tracking-wider text-ink-700 dark:text-ink-200">How the engine rotated</h3>
                      <p className="mt-1.5 text-[12px] leading-relaxed text-ink-500 dark:text-ink-400">
                        Withdrawals were funded exclusively from Layer 1. Layer rotation happened {result.rotations.length} time{result.rotations.length === 1 ? '' : 's'},
                        and the growth engine was harvested {result.replenishCount} time{result.replenishCount === 1 ? '' : 's'} for a gross
                        {' ' + fmtShort(result.totalHarvested)}{result.totalTaxes > 0 ? ', incurring ' + fmtShort(result.totalTaxes) + ' of tax' : ' with no tax drag'}.
                      </p>
                      {result.replenishments.length > 0 && (
                        <div className="mt-3 flex flex-wrap gap-1.5">
                          {result.replenishments.slice(0, 24).map((r, i) => (
                            <span key={i} className="rounded-md border border-income/25 bg-income/[0.07] px-2 py-1 text-[10px] font-semibold text-income dark:text-income-soft num">
                              Yr {r.year} · {fmtShort(r.amount)}
                            </span>
                          ))}
                          {result.replenishments.length > 24 && <span className="px-2 py-1 text-[10px] text-ink-500">+{result.replenishments.length - 24} more</span>}
                        </div>
                      )}
                    </div>
                  </div>
                )}

                {tab === 'report' && <div className="fade-in"><AnnualTable result={result} /></div>}
                {tab === 'stress' && <div className="fade-in"><StressTesting params={clean} dark={dark} /></div>}
                {tab === 'montecarlo' && <div className="fade-in"><MonteCarlo params={clean} dark={dark} /></div>}
                {tab === 'roadmap' && <div className="fade-in"><FutureFeatures /></div>}
              </React.Fragment>
            )}
          </div>
        </div>

        <footer className="mx-auto mt-8 max-w-3xl text-center text-[11px] leading-relaxed text-ink-500 dark:text-ink-400">
          <p className="font-semibold text-ink-600 dark:text-ink-300">Dual Engine Rotation Strategy (DERS) Calculator</p>
          <p className="mt-1.5">
            All figures are model outputs based on the assumptions you enter, not forecasts. Returns are applied as smooth monthly
            compounding in the deterministic run; real markets do not behave that way, which is what the Monte Carlo and stress
            modules exist to illustrate. This tool does not constitute investment, tax or financial advice — validate any plan with a
            SEBI-registered investment adviser before acting on it.
          </p>
        </footer>
      </main>
    </div>
  );
}

const rootEl = document.getElementById('root');
ReactDOM.createRoot(rootEl).render(<App />);
requestAnimationFrame(function () {
  const boot = document.getElementById('boot');
  if (boot) boot.remove();
});
</script>
</body>
</html>
