   Equity     = EV + Cash - Total debt

   competitive convergence. Setting the two equal gives a flat model.

  const tEv = tCap + netDebt;

  return {
    netDebt: netDebt, mktCap: mktCap, ev: ev, tCap: tCap, tEv: tEv,
    curEvEbitda: ebitda > 0 ? ev / ebitda : NaN,
    tgtEvEbitda: ebitda > 0 ? tEv / ebitda : NaN,
    curPe: eps > 0 ? price / eps : NaN,
    tgtPe: eps > 0 ? target / eps : NaN,
    curEvSales: rev > 0 ? ev / rev : NaN,
    tgtEvSales: rev > 0 ? tEv / rev : NaN,
    reRate: price > 0 ? target / price - 1 : NaN,
    ok: sh > 0 && price > 0,
  };
}

/* ---- 11 / 12 / 16  CAPITAL RETURNS --------------------------------------
   ROIC   = NOPAT / invested capital
   Invested capital = total debt + equity - cash  (the operating capital the
   business actually needs; excess cash is excluded so it cannot flatter the
   return)
   Spread = ROIC - WACC. Positive spread means every rupee retained is worth
   more than a rupee. Incremental ROIC uses the CHANGE in both over a period,
   which is a far better guide to the future than the historic average.
--------------------------------------------------------------------------- */
function capitalReturns(p) {
  const ebit = num(p.ebit, 0);
  const tax = num(p.tax, 25) / 100;
  const debt = num(p.debt, 0);
  const eq = num(p.equity, 0);
  const cash = num(p.cash, 0);
  const w = num(p.wacc, 11) / 100;

  const nopat = ebit * (1 - tax);
  const ic = debt + eq - cash;
  const roic = ic > 0 ? nopat / ic : NaN;
  const spread = isFin(roic) ? roic - w : NaN;
  const evaAbs = isFin(spread) ? spread * ic : NaN;   /* economic profit */

  /* incremental: change in NOPAT over change in invested capital */
  const ebitP = num(p.ebitPrior, 0);
  const icP = num(p.debtPrior, 0) + num(p.equityPrior, 0) - num(p.cashPrior, 0);
  const nopatP = ebitP * (1 - tax);
  const dNopat = nopat - nopatP;
  const dIc = ic - icP;
  const iRoic = Math.abs(dIc) > 1e-9 ? dNopat / dIc : NaN;
  const iSpread = isFin(iRoic) ? iRoic - w : NaN;

  /* capital allocation: where the cash went */
  const uses = [
    { label: 'Reinvested in the business', value: num(p.useCapex, 0), tone: 'a1' },
    { label: 'Acquisitions', value: num(p.useAcq, 0), tone: 'a3' },
    { label: 'Dividends', value: num(p.useDiv, 0), tone: 'pos' },
    { label: 'Buybacks', value: num(p.useBuy, 0), tone: 'a4' },
    { label: 'Debt repaid', value: num(p.useDebt, 0), tone: 'ink' },
  ];
  const totalUses = sum(uses.map(function (u) { return u.value; }));
  const reinvested = num(p.useCapex, 0) + num(p.useAcq, 0);
  const reinvestRate = totalUses > 0 ? reinvested / totalUses : NaN;
  /* value created per rupee reinvested, on a perpetuity basis */
  const valuePerRupee = isFin(roic) && w > 0 ? roic / w : NaN;

  return {
    nopat: nopat, ic: ic, roic: roic, wacc: w, spread: spread, eva: evaAbs,
    nopatPrior: nopatP, icPrior: icP, dNopat: dNopat, dIc: dIc,
    iRoic: iRoic, iSpread: iSpread,
    uses: uses, totalUses: totalUses, reinvested: reinvested, reinvestRate: reinvestRate,
    valuePerRupee: valuePerRupee,
    sustainableG: isFin(roic) ? roic * (isFin(reinvestRate) ? reinvestRate : 0) : NaN,
    ok: ic > 0 && w > 0,
  };
}

function capitalIssues(p) {
  const errs = [], warns = [];
  const ic = num(p.debt, 0) + num(p.equity, 0) - num(p.cash, 0);
  if (ic <= 0) errs.push('Invested capital is zero or negative, so a return on it cannot be computed. Check debt, equity and cash.');
  if (num(p.wacc, 0) <= 0) errs.push('The cost of capital must be above zero.');
  if (num(p.ebit, 0) <= 0) warns.push('Operating profit is zero or negative, so ROIC is negative by definition. That is a real result, not an error.');
  if (num(p.cash, 0) > num(p.equity, 0)) warns.push('Cash exceeds book equity. Excluding it from invested capital is correct, but it does mean the ROIC here describes a small operating core inside a large cash pile.');
  const icP = num(p.debtPrior, 0) + num(p.equityPrior, 0) - num(p.cashPrior, 0);
  if (Math.abs(ic - icP) < 1e-9) warns.push('Invested capital has not changed between the two periods, so incremental ROIC cannot be computed.');
  return { errs: errs, warns: warns };
}

/* ---- 13 GROWTH TO VALUE --------------------------------------------------
   Growth is worth paying for only when ROIC exceeds WACC. This computes the
   value of a rupee of incremental earnings under the growth you specify, and
   contrasts it with the same rupee if the business simply stopped growing.
   value multiple = (1 - g/ROIC) / (WACC - g)
--------------------------------------------------------------------------- */
function growthValue(p) {
  const roic = num(p.roic, 0) / 100;
  const w = num(p.wacc, 11) / 100;
  const g = num(p.g, 0) / 100;
  const nopat = num(p.nopat, 0);

  const reinvest = roic > 0 ? g / roic : NaN;             /* rupees retained per rupee earned */
  const fcf = isFin(reinvest) ? nopat * (1 - reinvest) : NaN;
  const spread = roic - w;
  const valueMult = (w - g) > 0 && isFin(reinvest) ? (1 - reinvest) / (w - g) : NaN;
  const noGrowthMult = w > 0 ? 1 / w : NaN;
  const value = isFin(valueMult) ? nopat * valueMult : NaN;
  const noGrowthValue = isFin(noGrowthMult) ? nopat * noGrowthMult : NaN;
  const growthPremium = isFin(value) && isFin(noGrowthValue) ? value - noGrowthValue : NaN;

  /* the growth rate at which growth stops adding anything */
  const breakEven = 0;
  const curve = [];
  for (let i = 0; i <= 12; i++) {
    const gi = (i / 12) * Math.max(0.0001, w - 0.005);
    const ri = roic > 0 ? gi / roic : NaN;
    const vm = (w - gi) > 0 && isFin(ri) ? (1 - ri) / (w - gi) : NaN;
    curve.push({ g: gi, mult: vm, value: isFin(vm) ? nopat * vm : NaN });
  }

  return {
    roic: roic, wacc: w, g: g, spread: spread, reinvest: reinvest, fcf: fcf,
    valueMult: valueMult, noGrowthMult: noGrowthMult,
    value: value, noGrowthValue: noGrowthValue, growthPremium: growthPremium,
    premiumShare: isFin(value) && value !== 0 ? growthPremium / value : NaN,
    creates: spread > 0, breakEven: breakEven, curve: curve,
    ok: w > g && w > 0 && roic !== 0 && nopat !== 0,
  };
}

function growthIssues(p) {
  const errs = [], warns = [];
  const w = num(p.wacc, 11) / 100, g = num(p.g, 0) / 100, roic = num(p.roic, 0) / 100;
  if (w <= 0) errs.push('The cost of capital must be above zero.');
  if (g >= w) errs.push('Growth must stay below the cost of capital. A perpetual growth rate above the discount rate produces an infinite value, which is a modelling artefact rather than a result.');
  if (roic <= 0) errs.push('ROIC must be above zero for the reinvestment maths to work.');
  if (roic > 0 && g / roic > 1) warns.push('The growth you have set requires reinvesting more than the company earns, so it can only be funded from outside capital.');
  if (roic > 0 && roic < w) warns.push('ROIC sits below the cost of capital, so faster growth makes the business less valuable, not more. The chart below shows the value falling as growth rises.');
  return { errs: errs, warns: warns };
}

/* ---- 14 FREE CASH FLOW CONVERSION ---------------------------------------
   Traces reported profit down to cash actually available, one line at a time,
   so the leakage is visible rather than netted away.
--------------------------------------------------------------------------- */
function fcfConversion(p) {
  const pat = num(p.pat, 0);
  const da = num(p.da, 0);
  const dWc = num(p.dwc, 0);           /* increase in working capital (a use of cash) */
  const other = num(p.other, 0);
  const capex = num(p.capex, 0);
  const maint = num(p.maint, 0);
  const ebitda = num(p.ebitda, 0);

  const cfo = pat + da - dWc + other;
  const fcf = cfo - capex;
  const ownerFcf = cfo - maint;

  return {
    pat: pat, da: da, dWc: dWc, other: other, capex: capex, maint: maint,
    cfo: cfo, fcf: fcf, ownerFcf: ownerFcf,
    cfoToPat: pat !== 0 ? cfo / pat : NaN,
    fcfToPat: pat !== 0 ? fcf / pat : NaN,
    ownerToPat: pat !== 0 ? ownerFcf / pat : NaN,
    cfoToEbitda: ebitda !== 0 ? cfo / ebitda : NaN,
    accrual: pat !== 0 ? (pat - cfo) / pat : NaN,
    capexIntensity: ebitda !== 0 ? capex / ebitda : NaN,
    ok: pat !== 0,
  };
}

function fcfIssues(p) {
  const errs = [], warns = [];
  if (num(p.pat, 0) === 0) errs.push('Net profit cannot be zero — every ratio here is expressed against it.');
  if (num(p.pat, 0) < 0) warns.push('The company is loss-making, so conversion ratios flip sign and should be read as absolute cash figures rather than percentages.');
  if (num(p.dwc, 0) > num(p.pat, 0) && num(p.pat, 0) > 0) warns.push('Working capital absorbed more cash than the company earned. That happens in fast growth, but it also happens when receivables are not being collected.');
  if (num(p.maint, 0) > num(p.capex, 0)) warns.push('Maintenance capex above total capex is not possible — maintenance is a subset of the total.');
  if (num(p.other, 0) !== 0 && Math.abs(num(p.other, 0)) > Math.abs(num(p.pat, 0)) * 0.4) warns.push('Other non-cash adjustments exceed 40% of profit. Worth reading the cash flow statement note to see what they are.');
  return { errs: errs, warns: warns };
}

/* ---- 15 QUALITY-ADJUSTED VALUATION --------------------------------------
   Builds a deserved multiple from first principles rather than from peers:
     base multiple    = 1 / (ke - g)            a no-frills perpetuity
     quality premium  = weighted score across returns, stability, moat and
                        reinvestment runway, each scored 1-10
   The score is never hidden: each component and its weight is shown.
--------------------------------------------------------------------------- */
const QUALITY_FACTORS = [
  { k: 'qRoic', label: 'Return on capital', w: 0.30, tip: 'How far ROIC sits above the cost of capital, and how consistently.' },
  { k: 'qStab', label: 'Earnings stability', w: 0.25, tip: 'How predictable profits have been through a full cycle.' },
  { k: 'qMoat', label: 'Competitive position', w: 0.25, tip: 'Pricing power, switching costs, scale, brand or regulation.' },
  { k: 'qRun', label: 'Reinvestment runway', w: 0.20, tip: 'How much capital the business can still deploy at high returns.' },
];

function qualityValue(p) {
  const ke = num(p.ke, 12) / 100;
  const g = num(p.g, 4) / 100;
  const eps = num(p.eps, 0);
  const price = num(p.price, 0);
  const maxPrem = num(p.maxPrem, 60) / 100;

  const comps = QUALITY_FACTORS.map(function (f) {
    const s = clamp(num(p[f.k], 5), 1, 10);
    return { k: f.k, label: f.label, w: f.w, score: s, contrib: s * f.w };
  });
  const score = sum(comps.map(function (c) { return c.contrib; }));   /* 1..10 */
  const base = (ke - g) > 0 ? 1 / (ke - g) : NaN;
  /* score 5.5 is neutral; 10 gives the full premium, 1 the full discount */
  const tilt = (score - 5.5) / 4.5;
  const premium = tilt * maxPrem;
  const deserved = isFin(base) ? base * (1 + premium) : NaN;
  const actual = eps > 0 ? price / eps : NaN;
  const fair = isFin(deserved) ? deserved * eps : NaN;

  return {
    comps: comps, score: score, base: base, tilt: tilt, premium: premium,
    deserved: deserved, actual: actual, fair: fair,
    gap: isFin(actual) && isFin(deserved) ? actual - deserved : NaN,
    upside: price > 0 && isFin(fair) ? fair / price - 1 : NaN,
    ke: ke, g: g, eps: eps, price: price,
    ok: (ke - g) > 0 && eps > 0,
  };
}

function qualityIssues(p) {
  const errs = [], warns = [];
  const ke = num(p.ke, 12) / 100, g = num(p.g, 4) / 100;
  if (ke <= g) errs.push('The cost of equity must exceed the perpetual growth rate, otherwise the base multiple is infinite.');
  if (num(p.eps, 0) <= 0) errs.push('EPS must be above zero to convert a multiple into a price.');
  if (num(p.maxPrem, 60) > 120) warns.push('Allowing a premium above 120% means the quality score can more than double the multiple, which gives the subjective scores more power than the arithmetic.');
  const s = QUALITY_FACTORS.map(function (f) { return clamp(num(p[f.k], 5), 1, 10); });
  if (Math.min.apply(null, s) >= 8) warns.push('Every quality score is 8 or above. Genuinely exceptional businesses exist, but scoring everything highly removes the discipline this tool is meant to impose.');
  return { errs: errs, warns: warns };
}



/* ===== F_fin4.js ===== */
/* ============ F_fin4.js — margin of safety, debt, PEG, return decomposition ============ */

/* ---- 8. Margin of Safety ---- */
function marginOfSafety(p) {
  var anchors = [
    { key: 'a', label: p.lab1 || 'DCF value', v: num(p.v1), w: num(p.w1) },
    { key: 'b', label: p.lab2 || 'Earnings power value', v: num(p.v2), w: num(p.w2) },
    { key: 'c', label: p.lab3 || 'Multiple-based value', v: num(p.v3), w: num(p.w3) }
  ].filter(function (a) { return isFin(a.v) && a.v > 0 && isFin(a.w) && a.w > 0; });

  var wSum = sum(anchors.map(function (a) { return a.w; }));
  var iv = wSum > 0 ? sum(anchors.map(function (a) { return a.v * a.w; })) / wSum : NaN;
  anchors.forEach(function (a) { a.share = wSum > 0 ? a.w / wSum : NaN; });

  var vals = anchors.map(function (a) { return a.v; });
  var lo = vals.length ? Math.min.apply(null, vals) : NaN;
  var hi = vals.length ? Math.max.apply(null, vals) : NaN;
  var dispersion = isFin(iv) && iv > 0 ? (hi - lo) / iv : NaN;

  var price = num(p.price);
  var mos = isFin(iv) && iv > 0 ? (iv - price) / iv : NaN;
  var upside = isFin(iv) && price > 0 ? iv / price - 1 : NaN;

  var unc = [num(p.uPredict), num(p.uCyclical), num(p.uBalance)].filter(isFin);
  var uScore = unc.length ? sum(unc) / unc.length : 5;

  var base = num(p.reqMos) / 100;
  var addDisp = isFin(dispersion) ? clamp(dispersion * 0.5, 0, 0.20) : 0;
  var addUnc = clamp((uScore - 5) * 0.02, -0.06, 0.12);
  var reqTotal = clamp(base + addDisp + addUnc, 0, 0.85);

  var buyBelow = isFin(iv) ? iv * (1 - reqTotal) : NaN;
  var gapToBuy = isFin(buyBelow) && buyBelow > 0 ? price / buyBelow - 1 : NaN;
  var meets = isFin(mos) && mos >= reqTotal;

  return {
    anchors: anchors, iv: iv, lo: lo, hi: hi, dispersion: dispersion,
    price: price, mos: mos, upside: upside,
    uScore: uScore, base: base, addDisp: addDisp, addUnc: addUnc, reqTotal: reqTotal,
    buyBelow: buyBelow, gapToBuy: gapToBuy, meets: meets,
    ok: isFin(iv) && iv > 0 && price > 0
  };
}
function mosIssues(p) {
  var errs = [], warns = [];
  var w = num(p.w1) + num(p.w2) + num(p.w3);
  if (!(w > 0)) errs.push('At least one valuation anchor needs a value and a weight above zero.');
  if (!(num(p.price) > 0)) errs.push('Current price must be greater than zero.');
  var r = marginOfSafety(p);
  if (isFin(r.dispersion) && r.dispersion > 0.5) warns.push('Your three value estimates differ by more than 50% of the blend. A wide spread means the "intrinsic value" is a range, not a number.');
  if (num(p.reqMos) < 10) warns.push('A required margin of safety under 10% leaves almost no room for forecast error.');
  if (isFin(r.mos) && r.mos < -0.5) warns.push('Price is more than 50% above your blended value — check whether an anchor is stale.');
  return { errs: errs, warns: warns };
}

/* ---- 17. Debt sustainability ---- */
function debtSustainability(p) {
  var ebitda = num(p.ebitda), da = num(p.da), interest = num(p.interest);
  var debt = num(p.debt), cash = num(p.cash), capex = num(p.capexMaint);
  var tax = num(p.tax) / 100;
  var ebit = ebitda - da;
  var netDebt = debt - cash;

  var grossLev = ebitda > 0 ? debt / ebitda : NaN;
  var netLev = ebitda > 0 ? netDebt / ebitda : NaN;
  var intCover = interest > 0 ? ebit / interest : Infinity;
  var ebitdaCover = interest > 0 ? ebitda / interest : Infinity;
  var avgRate = debt > 0 ? interest / debt : NaN;

  var taxPaid = Math.max(0, ebit - interest) * tax;
  var cashAvail = ebitda - taxPaid - capex;
  var afterInt = cashAvail - interest;
  var yearsToRepay = afterInt > 0 && netDebt > 0 ? netDebt / afterInt : (netDebt <= 0 ? 0 : Infinity);

  var drop = clamp(num(p.stressDrop) / 100, 0, 0.95);
  var shock = num(p.rateShock) / 100;
  var ebitdaS = ebitda * (1 - drop);
  var ebitS = ebitdaS - da;
  var intS = debt * ((isFin(avgRate) ? avgRate : 0) + shock);
  var coverS = intS > 0 ? ebitS / intS : Infinity;
  var netLevS = ebitdaS > 0 ? netDebt / ebitdaS : NaN;
  var taxS = Math.max(0, ebitS - intS) * tax;
  var fcfS = ebitdaS - taxS - capex - intS;

  var breakEbitda = interest + da;
  var breakDrop = ebitda > 0 ? 1 - breakEbitda / ebitda : NaN;

  var bands = [
    { upto: 1.5, label: 'Conservative', tone: 'pos' },
    { upto: 3.0, label: 'Comfortable', tone: 'pos' },
    { upto: 4.0, label: 'Stretched', tone: 'warn' },
    { upto: 99, label: 'Heavily geared', tone: 'neg' }
  ];

  return {
    ebit: ebit, netDebt: netDebt, grossLev: grossLev, netLev: netLev,
    intCover: intCover, ebitdaCover: ebitdaCover, avgRate: avgRate,
    taxPaid: taxPaid, cashAvail: cashAvail, afterInt: afterInt, yearsToRepay: yearsToRepay,
    drop: drop, shock: shock, ebitdaS: ebitdaS, ebitS: ebitS, intS: intS,
    coverS: coverS, netLevS: netLevS, fcfS: fcfS,
    breakEbitda: breakEbitda, breakDrop: breakDrop, bands: bands,
    ok: ebitda > 0
  };
}
function debtIssues(p) {
  var errs = [], warns = [];
  if (!(num(p.ebitda) > 0)) errs.push('EBITDA must be greater than zero to measure leverage against it.');
  if (num(p.debt) < 0) errs.push('Gross debt cannot be negative.');
  if (num(p.da) > num(p.ebitda)) warns.push('Depreciation exceeds EBITDA, so operating profit is negative before any interest.');
  var r = debtSustainability(p);
  if (isFin(r.intCover) && r.intCover < 3) warns.push('Interest cover below 3x leaves little room if profit falls.');
  if (isFin(r.netLev) && r.netLev > 4) warns.push('Net debt above 4x EBITDA is high for most non-utility businesses.');
  if (isFin(r.avgRate) && r.avgRate > 0.20) warns.push('Implied interest rate above 20% — check whether interest expense and debt cover the same period.');
  if (isFin(r.coverS) && r.coverS < 1) warns.push('In your stress case operating profit no longer covers interest.');
  return { errs: errs, warns: warns };
}

/* ---- 18. PEG ---- */
function peg(p) {
  var price = num(p.price), eps = num(p.eps);
  var pe = eps > 0 ? price / eps : NaN;
  var g = num(p.g);
  var dy = num(p.divYield);
  var conf = clamp(num(p.conf), 1, 10);

  var pegRaw = g > 0 ? pe / g : NaN;
  var pegy = (g + dy) > 0 ? pe / (g + dy) : NaN;
  var gEff = g * (conf / 10);
  var pegConf = gEff > 0 ? pe / gEff : NaN;

  var gForPeg1 = pe;
  var gapG = g - gForPeg1;
  var fairPe1 = g;
  var fairPrice = eps * g;
  var upside = price > 0 ? fairPrice / price - 1 : NaN;

  var years = g > 0 && pe > 0 ? Math.log(pe) / Math.log(1 + g / 100) : NaN;

  var curve = [];
  for (var i = 0; i <= 12; i++) {
    var gi = 4 + i * 3;
    curve.push({ g: gi, peg: pe / gi, fairPe: gi });
  }

  return {
    price: price, eps: eps, pe: pe, g: g, dy: dy, conf: conf,
    pegRaw: pegRaw, pegy: pegy, gEff: gEff, pegConf: pegConf,
    gForPeg1: gForPeg1, gapG: gapG, fairPe1: fairPe1, fairPrice: fairPrice,
    upside: upside, years: years, curve: curve,
    ok: isFin(pe) && pe > 0
  };
}
function pegIssues(p) {
  var errs = [], warns = [];
  if (!(num(p.eps) > 0)) errs.push('PEG needs positive earnings per share. For a loss-making company the ratio has no meaning.');
  if (!(num(p.price) > 0)) errs.push('Price must be greater than zero.');
  if (!(num(p.g) > 0)) errs.push('Growth must be greater than zero — PEG divides by it.');
  if (num(p.g) > 40) warns.push('Growth above 40% is rarely sustained for the 5-10 years PEG quietly assumes.');
  var r = peg(p);
  if (isFin(r.years) && r.years > 12) warns.push('At this growth rate it takes over 12 years of compounding to justify the current multiple. PEG hides that time cost.');
  if (num(p.conf) < 5) warns.push('Low confidence in the growth estimate — the confidence-adjusted PEG is the more honest number here.');
  return { errs: errs, warns: warns };
}

/* ---- 19 / 22 / 23. Return decomposition ---- */
function returnDecomp(p) {
  var price = num(p.price), eps = num(p.eps), n = Math.max(1, Math.round(num(p.years)));
  var gNet = num(p.gNet) / 100;
  var shareChg = num(p.shareChg) / 100;
  var exitPe = num(p.exitPe);
  var dy = num(p.divYield) / 100;

  var startPe = eps > 0 ? price / eps : NaN;
  var gEps = (1 + gNet) / (1 + shareChg) - 1;
  var buybackKick = gEps - gNet;

  var epsEnd = eps * Math.pow(1 + gEps, n);
  var priceEnd = epsEnd * exitPe;
  var priceCagr = price > 0 && priceEnd > 0 ? Math.pow(priceEnd / price, 1 / n) - 1 : NaN;

  var fromMult = isFin(startPe) && startPe > 0 && exitPe > 0 ? Math.pow(exitPe / startPe, 1 / n) - 1 : NaN;
  var interaction = isFin(priceCagr) ? priceCagr - gEps - fromMult : NaN;
  var total = isFin(priceCagr) ? priceCagr + dy : NaN;

  var multShare = isFin(priceCagr) && priceCagr !== 0 ? fromMult / priceCagr : NaN;
  var reRate = isFin(startPe) && startPe > 0 ? exitPe / startPe - 1 : NaN;

  var offsetYears = isFin(startPe) && exitPe > 0 && gEps > 0 && startPe > exitPe
    ? Math.log(startPe / exitPe) / Math.log(1 + gEps) : (startPe <= exitPe ? 0 : Infinity);

  var flatPe = isFin(startPe) ? startPe : NaN;
  var mapRows = [];
  for (var i = 0; i <= 8; i++) {
    var gi = i * 5;
    var pcFlat = gi / 100;
    var pcActual = isFin(flatPe) && exitPe > 0
      ? Math.pow(Math.pow(1 + gi / 100, n) * (exitPe / flatPe), 1 / n) - 1 : NaN;
    mapRows.push({ g: gi, flat: pcFlat, actual: pcActual, drag: pcActual - pcFlat });
  }

  var grid = [];
  var gAxis = [0, 5, 10, 15, 20, 25];
  var mAxis = [];
  if (isFin(startPe) && startPe > 0) {
    [0.5, 0.7, 0.85, 1.0, 1.2, 1.5].forEach(function (f) { mAxis.push(startPe * f); });
    gAxis.forEach(function (gv) {
      var row = { g: gv, cells: [] };
      mAxis.forEach(function (mv) {

    { label: 'Multiple re-rating', v: fromMult, tone: fromMult >= 0 ? 'pos' : 'neg' },
    { label: 'Compounding cross-term', v: interaction, tone: 'ink' },
    { label: 'Dividend yield', v: dy, tone: 'a2' }

    gNet: gNet, shareChg: shareChg, gEps: gEps, buybackKick: buybackKick,
    epsEnd: epsEnd, priceEnd: priceEnd, priceCagr: priceCagr,
    fromMult: fromMult, interaction: interaction, dy: dy, total: total,
    multShare: multShare, reRate: reRate, offsetYears: offsetYears,

}
function returnIssues(p) {

  if (!(num(p.exitPe) > 0)) errs.push('Exit multiple must be greater than zero.');
  if (!(num(p.years) >= 1)) errs.push('Holding period must be at least one year.');

  if (isFin(r.reRate) && r.reRate > 0.5) warns.push('You are assuming the multiple expands by more than 50%. That is a bet on sentiment, not on the business.');
  if (isFin(r.multShare) && r.multShare > 0.5) warns.push('More than half your expected return comes from the multiple rather than from earnings.');
  if (num(p.shareChg) > 2) warns.push('Share count rising over 2% a year dilutes per-share earnings growth.');
  if (isFin(r.gEps) && r.gEps > 0.30) warns.push('Earnings growth above 30% a year sustained over the full period is rare.');
  return { errs: errs, warns: warns };

/* ==========================================================================
   DERS — Dual Engine Rotation Strategy.  Pure maths, ported verbatim from the
   standalone DERS calculator.  No UI, no side effects.  `clamp` is deliberately
   omitted: the Lab kit already defines an identical one.  Three generic names
   (percentile / validate / buildScenarios) carry a ders prefix so they cannot
   collide with anything else in the Lab.
   ========================================================================== */

const dersINR  = new Intl.NumberFormat('en-IN', { maximumFractionDigits: 0 });
const dersINR2 = new Intl.NumberFormat('en-IN', { maximumFractionDigits: 2, minimumFractionDigits: 2 });

function fmtINR(v) {
  if (v === null || v === undefined || !isFinite(v)) return '—';
  const neg = v < 0;
  return (neg ? '-₹' : '₹') + dersINR.format(Math.round(Math.abs(v)));
}
function fmtShort(v) {
  if (v === null || v === undefined || !isFinite(v)) return '—';
  const a = Math.abs(v), s = v < 0 ? '-₹' : '₹';
  if (a >= 1e7) return s + dersINR2.format(a / 1e7) + ' Cr';
  if (a >= 1e5) return s + dersINR2.format(a / 1e5) + ' L';
  if (a >= 1e3) return s + dersINR.format(Math.round(a / 1e3)) + ' K';
  return s + dersINR.format(Math.round(a));
}
function fmtAxis(v) {
  const a = Math.abs(v);
  if (a >= 1e7) return (v / 1e7).toFixed(a >= 1e8 ? 0 : 1) + 'Cr';
  if (a >= 1e5) return (v / 1e5).toFixed(0) + 'L';
  if (a >= 1e3) return (v / 1e3).toFixed(0) + 'K';
  return String(Math.round(v));
}
function fmtPct(v, d) { return (v === null || v === undefined || !isFinite(v)) ? '—' : v.toFixed(d === undefined ? 1 : d) + '%'; }

const HARVEST_GAIN_FRACTION = { proportional: 0.60, best: 0.80, manual: 0.50 };

function monthlyRate(annualPct) { return Math.pow(1 + annualPct / 100, 1 / 12) - 1; }
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/**
 * Run one full DERS simulation.
 * @param {object} p  input assumptions
 * @param {object} [opts] { stochastic:boolean, rand:()=>number, light:boolean }
 * @returns {object} result bundle
 */
function runSimulation(p, opts) {
  opts = opts || {};
  const light = !!opts.light;                       // light mode skips monthly series (Monte Carlo)
  const stochastic = !!opts.stochastic;
  const rand = opts.rand || Math.random;

  // --- return generators -------------------------------------------------------------
  const mu = p.growthReturn / 100, sd = Math.max(0.0001, p.growthSD / 100);
  const sigL = Math.sqrt(Math.log(1 + (sd * sd) / Math.pow(1 + mu, 2)));
  const muL = Math.log(1 + mu) - 0.5 * sigL * sigL;
  const sigM = sigL / Math.sqrt(12), muM = muL / 12;
  const geDet = monthlyRate(p.growthReturn);
  let spare = null;
  function gauss() {
    if (spare !== null) { const s = spare; spare = null; return s; }
    let u = 0, v = 0;
    while (u === 0) u = rand();
    while (v === 0) v = rand();
    const r = Math.sqrt(-2 * Math.log(u));
    spare = r * Math.sin(2 * Math.PI * v);
    return r * Math.cos(2 * Math.PI * v);
  }
  const drawGE = () => stochastic ? Math.exp(muM + sigM * gauss()) - 1 : geDet;

  const rFD = monthlyRate(p.fdReturn);
  const rBond = monthlyRate(p.bondReturn);
  const rEq = monthlyRate(p.ieEquityReturn);
  const infl = p.inflation / 100;
  const taxRate = p.taxRate / 100;
  const gainFrac = HARVEST_GAIN_FRACTION[p.replenishMethod] || 0.6;

  // --- setup -------------------------------------------------------------------------
  const stepMonths = p.frequency === 'yearly' ? 12 : p.frequency === 'quarterly' ? 3 : 1;
  const totalMonths = Math.round(p.simYears * 12);
  const lp = [p.layer1 / 100, p.layer2 / 100, p.layer3 / 100];
  const lpSum = lp[0] + lp[1] + lp[2] || 1;
  const lpn = lp.map(x => x / lpSum);

  let reserve = Math.min(Math.max(0, p.emergencyMonths) * p.monthlyWithdrawal, p.corpus * 0.5);
  const investable = Math.max(0, p.corpus - reserve);
  let GE = investable * (p.growthAlloc / 100);
  let ie0 = investable - GE;
  let L1 = ie0 * lpn[0], L2 = ie0 * lpn[1], L3 = ie0 * lpn[2];

  let currentMonthly = p.monthlyWithdrawal;
  let lastReplenishGE = GE;
  let monthsSinceReplenish = 0;
  let inflationPaused = false;

  const replenishments = [];
  const rotations = [];
  const monthly = [];
  const yearly = [];

  let totalWithdrawn = 0, totalTaxes = 0, totalGrowth = 0, totalHarvested = 0;
  let peak = p.corpus, maxDD = 0, exhaustedMonth = null;

  let yStartTotal = p.corpus, yWithdrawn = 0, yGrowth = 0, yTaxes = 0, yRepl = false, yInfl = false;

  const blendedIE = (lpn[0] * p.fdReturn + lpn[1] * p.bondReturn + lpn[2] * p.ieEquityReturn) / 100;
  const crashMonth = (p.crashPct > 0) ? (Math.max(1, p.crashYear) - 1) * 12 + 1 : -1;

  const ieValue = () => L1 + L2 + L3;
  const total = () => GE + ieValue() + reserve;

  function rotate(t) {
    if (L1 <= 1e-6 && L2 > 1e-6) { L1 += L2; L2 = 0; rotations.push({ month: t, from: 'Layer 2 · Bonds' }); }
    if (L1 <= 1e-6 && L2 <= 1e-6 && L3 > 1e-6) { L1 += L3; L3 = 0; rotations.push({ month: t, from: 'Layer 3 · Equity' }); }
  }

  /** Present value of the next `years` of withdrawals, discounted at the blended IE return. */
  function fundingTarget(years) {
    let pv = 0;
    for (let y = 0; y < years; y++) {
      const cash = currentMonthly * 12 * (p.inflationAdjust ? Math.pow(1 + infl, y) : 1);
      pv += cash / Math.pow(1 + blendedIE, y + 0.5);
    }
    return pv;
  }

  function replenish(t, forced) {
    const target = fundingTarget(p.ieDuration);
    const shortfall = Math.max(0, target - ieValue());
    if (shortfall <= 0 && !forced) { monthsSinceReplenish = 0; lastReplenishGE = GE; return false; }
    const taxDrag = gainFrac * taxRate;
    const gross = Math.min(GE, shortfall / Math.max(0.05, 1 - taxDrag));
    if (gross <= 1) return false;
    const tax = gross * taxDrag;
    const net = gross - tax;
    GE -= gross; totalTaxes += tax; yTaxes += tax; totalHarvested += gross;
    const pool = ieValue() + net;
    L1 = pool * lpn[0]; L2 = pool * lpn[1]; L3 = pool * lpn[2];
    replenishments.push({
      month: t, year: Math.ceil(t / 12), amount: net, gross: gross, tax: tax,
      geAfter: GE, ieAfter: pool, forced: !!forced
    });
    monthsSinceReplenish = 0; lastReplenishGE = GE; yRepl = true;
    return true;
  }

  /** Fund `amount` from the income engine, cascading layers, then emergency measures.
   *  Returns the amount actually paid out. */
  function fund(amount, t) {
    let need = amount;
    for (let i = 0; i < 4 && need > 1e-6; i++) {
      rotate(t);
      const take = Math.min(L1, need);
      L1 -= take; need -= take;
      if (need > 1e-6 && L1 <= 1e-6 && L2 <= 1e-6 && L3 <= 1e-6) break;
    }
    if (need > 1e-6 && GE > 1e-6) {           // emergency mid-cycle harvest
      replenish(t, true);
      rotate(t);
      const take = Math.min(L1, need);
      L1 -= take; need -= take;
    }
    if (need > 1e-6 && GE > 1e-6) {           // raw harvest, no rebuild
      const taxDrag = gainFrac * taxRate;
      const gross = Math.min(GE, need / Math.max(0.05, 1 - taxDrag));
      GE -= gross; totalTaxes += gross * taxDrag; yTaxes += gross * taxDrag;
      need -= gross * (1 - taxDrag);
    }
    if (need > 1e-6 && reserve > 1e-6) {      // emergency reserve, last resort
      const take = Math.min(reserve, need);
      reserve -= take; need -= take;
    }
    return amount - Math.max(0, need);
  }

  // --- monthly loop -------------------------------------------------------------------
  for (let t = 1; t <= totalMonths; t++) {
    const isYearStart = (t - 1) % 12 === 0;
    const yearIdx = Math.floor((t - 1) / 12) + 1;

    if (isYearStart && t > 1) {
      // annual inflation escalation, subject to the drawdown guardrail
      const dd = peak > 0 ? (peak - total()) / peak : 0;
      inflationPaused = p.guardrail && dd >= 0.20;
      if (p.inflationAdjust && !inflationPaused) { currentMonthly *= (1 + infl); yInfl = true; }
    }

    if (t === crashMonth) { GE *= (1 - p.crashPct / 100); L3 *= (1 - p.crashPct / 100); }

    // growth accrual — engines compound independently
    const gRate = drawGE();
    const before = total();
    GE *= (1 + gRate);
    L1 *= (1 + rFD); L2 *= (1 + rBond); L3 *= (1 + rEq); reserve *= (1 + rFD);
    const grown = total() - before;
    totalGrowth += grown; yGrowth += grown;

    // withdrawal
    if ((t - 1) % stepMonths === 0) {
      const amount = currentMonthly * stepMonths;
      const funded = fund(amount, t);
      totalWithdrawn += funded; yWithdrawn += funded;
      if (funded < amount - 1e-6) exhaustedMonth = t;
    }

    monthsSinceReplenish++;

    // replenishment decision
    if (!exhaustedMonth && GE > 1) {
      const monthsLeft = currentMonthly > 0 ? ieValue() / currentMonthly : Infinity;
      let trigger = false;
      if (p.replenishRule === 'calendar') {
        trigger = monthsSinceReplenish >= p.ieDuration * 12 || monthsLeft < 1.5;
      } else { // opportunistic
        trigger = (monthsLeft < p.replenishThreshold && GE > lastReplenishGE) || monthsLeft < 1.5;
      }
      if (trigger) replenish(t, false);
    }

    // periodic re-proportioning of the income engine layers
    if (p.rebalanceFreq !== 'none' && !exhaustedMonth) {
      const every = p.rebalanceFreq === 'quarterly' ? 3 : 12;
      if (t % every === 0) { const pool = ieValue(); L1 = pool * lpn[0]; L2 = pool * lpn[1]; L3 = pool * lpn[2]; }
    }

    const tot = total();
    if (tot > peak) peak = tot;
    if (peak > 0) maxDD = Math.max(maxDD, (peak - tot) / peak);

    if (!light) {
      monthly.push({ m: t, year: +(t / 12).toFixed(3), total: tot, ge: GE, ie: ieValue(), l1: L1, l2: L2, l3: L3, reserve: reserve, withdrawal: currentMonthly });
    }

    // year close
    if (t % 12 === 0 || t === totalMonths || exhaustedMonth) {
      yearly.push({
        year: yearIdx, begin: yStartTotal, withdrawal: yWithdrawn, growth: yGrowth,
        ending: tot, ge: GE, ie: ieValue(), reserve: reserve,
        replenished: yRepl, inflationApplied: yInfl, taxes: yTaxes,
        monthlyWithdrawal: currentMonthly
      });
      yStartTotal = tot; yWithdrawn = 0; yGrowth = 0; yTaxes = 0; yRepl = false; yInfl = false;
    }
    if (exhaustedMonth) break;
  }

  const survivedMonths = exhaustedMonth ? exhaustedMonth - 1 : totalMonths;
  const survivedYears = survivedMonths / 12;
  const endingTotal = total();
  const nYears = yearly.length || 1;

  return {
    inputs: p,
    monthly, yearly, replenishments, rotations,
    exhausted: !!exhaustedMonth,
    exhaustedYear: exhaustedMonth ? Math.ceil(exhaustedMonth / 12) : null,
    survivedYears,
    endingTotal,
    endingGE: GE,
    endingIE: ieValue(),
    endingReserve: reserve,
    totalWithdrawn, totalGrowth, totalTaxes, totalHarvested,
    replenishCount: replenishments.length,
    maxDrawdown: maxDD * 100,
    avgAnnualWithdrawal: totalWithdrawn / nYears,
    finalMonthlyWithdrawal: currentMonthly,
    startingReserve: Math.min(Math.max(0, p.emergencyMonths) * p.monthlyWithdrawal, p.corpus * 0.5),
    startingGE: investable * (p.growthAlloc / 100),
    startingIE: ie0
  };
}

/* =====================================================================================
   3. MONTE CARLO
   ===================================================================================== */
function dersPercentile(sortedArr, q) {
  if (!sortedArr.length) return 0;
  const idx = (sortedArr.length - 1) * q;
  const lo = Math.floor(idx), hi = Math.ceil(idx);
  return lo === hi ? sortedArr[lo] : sortedArr[lo] + (sortedArr[hi] - sortedArr[lo]) * (idx - lo);
}

function runMonteCarloBatch(p, count, seedBase, acc) {
  const years = p.simYears;
  for (let i = 0; i < count; i++) {
    const rand = mulberry32(seedBase + i * 7919 + 1);
    const r = runSimulation(p, { stochastic: true, rand: rand, light: true });
    acc.survival.push(r.survivedYears);
    acc.ending.push(r.exhausted ? 0 : r.endingTotal);
    for (let y = 1; y <= years; y++) {
      const row = r.yearly[y - 1];
      if (!acc.byYear[y]) acc.byYear[y] = [];
      acc.byYear[y].push(row ? Math.max(0, row.ending) : 0);
    }
  }
  return acc;
}

function summariseMonteCarlo(acc, p) {
  const n = acc.survival.length || 1;
  const surv = h => acc.survival.filter(s => s >= h - 1e-9).length / n * 100;
  const curves = [{ year: 0, p10: p.corpus, p25: p.corpus, p50: p.corpus, p75: p.corpus, p90: p.corpus }];
  for (let y = 1; y <= p.simYears; y++) {
    const arr = (acc.byYear[y] || []).slice().sort((a, b) => a - b);
    curves.push({
      year: y,
      p10: dersPercentile(arr, 0.10), p25: dersPercentile(arr, 0.25), p50: dersPercentile(arr, 0.50),
      p75: dersPercentile(arr, 0.75), p90: dersPercentile(arr, 0.90)
    });
  }
  const sortedEnd = acc.ending.slice().sort((a, b) => a - b);
  const sortedSurv = acc.survival.slice().sort((a, b) => a - b);
  return {
    runs: n, curves,
    survival: { 20: surv(20), 30: surv(30), 40: surv(40), 50: surv(50) },
    successRate: acc.survival.filter(s => s >= p.simYears - 1e-9).length / n * 100,
    medianEnding: dersPercentile(sortedEnd, 0.5),
    p10Ending: dersPercentile(sortedEnd, 0.10),
    p90Ending: dersPercentile(sortedEnd, 0.90),
    worstSurvival: sortedSurv[0] || 0,
    medianSurvival: dersPercentile(sortedSurv, 0.5)
  };
}

/* =====================================================================================
   4. STRESS SCENARIOS
   ===================================================================================== */
function dersScenarios(p) {
  const crashPct = p.crashPct > 0 ? p.crashPct : 30;
  const crashYear = p.crashPct > 0 ? p.crashYear : Math.max(1, Math.min(p.simYears, 5));
  return [
    { key: 'A', name: 'A · No inflation', color: '#0f766e', note: 'Withdrawal held flat for life', params: { ...p, inflationAdjust: false, crashPct: 0 } },
    { key: 'B', name: 'B · Inflation indexed', color: '#1d4ed8', note: 'Withdrawal grows ' + fmtPct(p.inflation) + ' p.a.', params: { ...p, inflationAdjust: true, crashPct: 0 } },
    { key: 'C', name: 'C · Market crash', color: '#b45309', note: crashPct + '% crash in year ' + crashYear, params: { ...p, inflationAdjust: true, crashPct: crashPct, crashYear: crashYear } },
    { key: 'D', name: 'D · Lower CAGR', color: '#b91c1c', note: 'Growth engine at ' + fmtPct(Math.max(1, p.growthReturn - 4)), params: { ...p, inflationAdjust: true, crashPct: 0, growthReturn: Math.max(1, p.growthReturn - 4) } }
  ].map(s => ({ ...s, result: runSimulation(s.params) }));
}

/* =====================================================================================
   5. VALIDATION
   ===================================================================================== */
function dersValidate(p) {
  const errs = [];
  const warn = [];
  if (!(p.corpus > 0)) errs.push('Total initial corpus must be greater than zero.');
  if (p.monthlyWithdrawal < 0 || p.corpus < 0) errs.push('Inputs cannot be negative.');
  const layerSum = Math.round((p.layer1 + p.layer2 + p.layer3) * 100) / 100;
  if (Math.abs(layerSum - 100) > 0.01) errs.push('Income Engine layers total ' + layerSum.toFixed(1) + '% — they must total exactly 100%.');
  const allocSum = Math.round((p.growthAlloc + (100 - p.growthAlloc)) * 100) / 100;
  if (Math.abs(allocSum - 100) > 0.01) errs.push('Growth + Income allocation must equal 100%.');
  [['fdReturn', 'Floating FD return'], ['bondReturn', 'Bond return'], ['ieEquityReturn', 'Income engine equity return'],
   ['growthReturn', 'Growth engine return'], ['growthSD', 'Growth engine standard deviation'],
   ['inflation', 'Inflation'], ['taxRate', 'Tax rate'], ['monthlyWithdrawal', 'Monthly withdrawal']]
    .forEach(([k, label]) => { if (p[k] < 0) errs.push(label + ' cannot be negative.'); });
  const reserve = Math.min(p.emergencyMonths * p.monthlyWithdrawal, p.corpus * 0.5);
  const ie0 = (p.corpus - reserve) * (1 - p.growthAlloc / 100);
  const step = p.frequency === 'yearly' ? 12 : p.frequency === 'quarterly' ? 3 : 1;
  if (ie0 < p.monthlyWithdrawal * step) errs.push('First withdrawal (' + fmtShort(p.monthlyWithdrawal * step) + ') exceeds the entire Income Engine (' + fmtShort(ie0) + '). Raise the corpus, cut the withdrawal, or shift allocation to the Income Engine.');
  else if (ie0 < p.monthlyWithdrawal * 24) warn.push('Income Engine holds under 24 months of spending at the start — replenishment will trigger very early.');
  const rate = p.corpus > 0 ? (p.monthlyWithdrawal * 12) / p.corpus * 100 : 0;
  if (rate > 6) warn.push('Initial withdrawal rate is ' + fmtPct(rate) + ' of corpus — historically aggressive above ~5%.');
  if (p.taxRate > 40) warn.push('Tax rate above 40% is unusual for Indian long-term capital gains.');
  return { errs, warn, withdrawalRate: rate };
}
