<style>
  /* =====================================================================
     WEALTHORIA LAB · neumorphic theme
     One soft material per theme. Raised pieces cast a dark shadow down-right
     and a light one up-left; wells are the same pair inverted (inset).
     Accent: lime #D3F852 (selected states, knobs, dark-mode strokes) with
     Wealthoria bright orange #F4823C as the second voice.
     ===================================================================== */
  :root {
    /* surface: soft sage-grey clay, tuned so lime and orange both sit on it */
    --paper: 229 233 224;
    --surf:  229 233 224;   /* raised cards share the base material */
    --surf2: 220 225 214;
    --well:  222 227 216;   /* sunken fields / tracks */
    --ink-50: 237 240 233;  --ink-100: 215 220 209; --ink-200: 203 209 197;

    --ink-50: 44 47 53;     --ink-100: 51 55 61;    --ink-200: 62 66 73;
    --ink-300: 82 87 95;    --ink-400: 136 142 150; --ink-500: 162 168 175;
    --ink-600: 187 192 198; --ink-700: 208 212 217; --ink-800: 228 231 234;
    --ink-900: 242 244 246; --ink-950: 250 251 252;
    --lime: 211 248 82;
    --lime-edge: 236 255 160;
    --on-lime: 26 31 8;
    --wl:   211 248 82;        /* lime leads on charcoal */
    --wl-ink: 211 248 82;
    --org: 244 130 60;
    --focus: 211 248 82;
    --pos:  64 217 190;
    --neg:  255 120 110;
    --warn: 255 176 64;
    --a1:   129 161 255;
    --a2:   244 130 60;        /* Wealthoria bright orange */
    --a3:   178 150 255;
    --a4:   56 211 238;
    --heat: 242 244 246;
    --shd:  0 0 0;

    --thumb: 242 244 246;

  html { -webkit-font-smoothing: antialiased; }
  body {
    font-family: 'Montserrat', system-ui, sans-serif;

    color: rgb(var(--ink-900));

  .figure { font-family: 'Montserrat', system-ui, sans-serif; font-variant-numeric: tabular-nums lining-nums; font-feature-settings: 'tnum', 'lnum'; font-weight: 700; letter-spacing: -0.035em; }

  /* ---------------------------------------------------------------------
     neumorphic primitives
     --------------------------------------------------------------------- */
  .nm-card {
    background: rgb(var(--surf));
    border-radius: 22px;
    box-shadow: 8px 8px 18px var(--nm-d), -8px -8px 18px var(--nm-l);
  }
  .nm-card-sm {
    background: rgb(var(--surf));
    border-radius: 16px;
    box-shadow: 5px 5px 12px var(--nm-d), -5px -5px 12px var(--nm-l);
  }
  /* a card inside a card sits lower, so its shadow is shorter */
  .nm-card .nm-card, .nm-inset .nm-card {
    box-shadow: 5px 5px 12px var(--nm-d), -5px -5px 12px var(--nm-l);
  }
  .nm-inset {
    background: rgb(var(--well));
    border-radius: 16px;
    box-shadow: inset 4px 4px 9px var(--nm-d), inset -4px -4px 9px var(--nm-l);
  }
  .nm-inset-sm {
    background: rgb(var(--well));
    border-radius: 7px;
    box-shadow: inset 2px 2px 5px var(--nm-d), inset -2px -2px 5px var(--nm-l);
  }
  .nm-stat {
    position: relative;
    background: rgb(var(--surf));
    border-radius: 14px;
    box-shadow: 4px 4px 9px var(--nm-d), -4px -4px 9px var(--nm-l);
  }
  /* tone marker: a short tab in the tile's tone colour (taken from its border-t-* class) */
  .nm-stat::before {
    content: '';
    position: absolute;
    top: 0;
    left: 12px;
    width: 22px;
    border-top: 4px solid;
    border-top-color: inherit;
    border-radius: 0 0 4px 4px;
  }
  .nm-btn {
    border-radius: 999px;
    background: rgb(var(--surf));
    box-shadow: 4px 4px 9px var(--nm-d), -4px -4px 9px var(--nm-l);

  .nm-btn:hover { box-shadow: 5px 5px 11px var(--nm-d), -5px -5px 11px var(--nm-l), inset 0 0 0 1px rgb(var(--org) / .6); }
  .nm-btn:active { box-shadow: inset 3px 3px 7px var(--nm-d), inset -3px -3px 7px var(--nm-l); transform: translateY(1px); }

  .nm-on {

  .nm-tabs { border-radius: 16px; padding: 5px; }
  .nm-tabs .nm-seg-btn { border-radius: 12px; }

  /* text / number fields: carved wells */
  .nm-field {
    border: 0;
    border-radius: 10px;
    padding: 4px 8px;
    background: rgb(var(--well));
    box-shadow: inset 2px 2px 5px var(--nm-d), inset -2px -2px 5px var(--nm-l);
    transition: box-shadow .15s ease;
  }
  .nm-field:focus {
    box-shadow: inset 2px 2px 5px var(--nm-d), inset -2px -2px 5px var(--nm-l), 0 0 0 2px rgb(var(--focus) / .75);
  }

  .nm-bar { box-shadow: 0 6px 16px var(--nm-d); }
  .nm-rail { box-shadow: 6px 0 16px -8px var(--nm-d); }
  .nm-modal { border-radius: 22px; box-shadow: 14px 14px 34px rgb(0 0 0 / .32), -8px -8px 22px var(--nm-l); }
  .nm-tip { box-shadow: 6px 6px 16px rgb(0 0 0 / .28); }
  .nm-grad { background: linear-gradient(180deg, rgb(211 248 82), rgb(244 130 60)); }
  .nm-grad-x { background: linear-gradient(90deg, rgb(211 248 82), rgb(244 130 60)); }
  .nm-hero { background-image: radial-gradient(120% 140% at 100% 0%, rgb(var(--lime) / .16), transparent 55%), radial-gradient(90% 120% at 0% 100%, rgb(244 130 60 / .10), transparent 60%); }

  /* dashed "add a row" buttons pick up the same softness */
  #root .border-dashed { border-radius: 12px; }

  /* --- inputs --- */
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }
  input[type=text], input[type=number] { outline: none; color: inherit; }
  input::placeholder { color: rgb(var(--ink-400)); }

  /* --- range slider: a groove with a raised lime knob --- */
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; background: transparent; cursor: ew-resize; height: 24px; }
  input[type=range]::-webkit-slider-runnable-track { height: 8px; border-radius: 999px; background: rgb(var(--well)); box-shadow: inset 2px 2px 4px var(--nm-d), inset -2px -2px 4px var(--nm-l); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; margin-top: -6px; border-radius: 999px; background: rgb(var(--lime)); border: 4px solid rgb(var(--surf)); box-shadow: 3px 3px 7px var(--nm-d), -3px -3px 7px var(--nm-l); }
  input[type=range]::-moz-range-track { height: 8px; border-radius: 999px; background: rgb(var(--well)); box-shadow: inset 2px 2px 4px var(--nm-d), inset -2px -2px 4px var(--nm-l); }
  input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 999px; background: rgb(var(--lime)); border: 4px solid rgb(var(--surf)); box-shadow: 3px 3px 7px var(--nm-d), -3px -3px 7px var(--nm-l); }

</style>

<script>
/* =========================================================
   WEALTHORIA PROTECTION LAYER
   Disables common copy/context-menu actions.
   ========================================================= */

(function () {
  const block = (event) => {
    event.preventDefault();
    event.stopPropagation();
    return false;
  };

  document.addEventListener("contextmenu", block, true);
  document.addEventListener("copy", block, true);
  document.addEventListener("cut", block, true);
  document.addEventListener("dragstart", block, true);
  document.addEventListener("selectstart", block, true);

  document.addEventListener("keydown", (event) => {
    const key = String(event.key || "").toLowerCase();
    const modifier = event.ctrlKey || event.metaKey;

    /* Block common copy / save / source / print / select-all shortcuts. */
    if (
      modifier &&
      ["c", "x", "a", "s", "u", "p"].includes(key)
    ) {
      block(event);
    }

    /* Block F12 and common developer-tool shortcuts. */
    if (
      event.key === "F12" ||
      (event.ctrlKey &&
        event.shiftKey &&
        ["i", "j", "c"].includes(key))
    ) {
      block(event);
    }
  }, true);
})();
</script>

(function () {

  function readLabMemberSession() {
