<body>


  <!-- =====================================================
       ROOT
       ===================================================== -->

  <div id="root">

    <!--
      Very small fallback only.
      It disappears as soon as React mounts.
    -->

    <div
      id="wealthoria-startup"
      style="
        min-height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        background:#fff;
        font-family:Arial,sans-serif;
      "
    >

      <div
        style="
          width:28px;
          height:28px;
          border:3px solid #eee;
          border-top-color:#e8473f;
          border-radius:50%;
          animation:wealthoriaSpin .7s linear infinite;
        "
      ></div>

    </div>

  </div>


  <style>

    @keyframes wealthoriaSpin {

      to {
        transform:rotate(360deg);
      }

    }

  </style>


  <!-- =====================================================
       APP LOADER
       ===================================================== -->

  <script>

    (function () {

      "use strict";


      const path =
        window.location.pathname || "/";


      console.log(
        "[Wealthoria] Route:",
        path
      );


      /* =====================================================
         SCRIPT CACHE
         ===================================================== */

      const scriptCache =
        new Map();


      /* =====================================================
         LOAD NORMAL SCRIPT
         ===================================================== */

      function loadScript(src) {

        if (scriptCache.has(src)) {

          return scriptCache.get(src);

        }


        const promise =
          new Promise(
            function (resolve, reject) {

              const script =
                document.createElement(
                  "script"
                );


              script.src =
                src;


              script.async =
                true;


              script.onload =
                function () {

                  console.log(
                    "[Wealthoria] Loaded:",
                    src
                  );

                  resolve();

                };


              script.onerror =
                function () {

                  reject(
                    new Error(
                      "Failed to load " +
                      src
                    )
                  );

                };


              document.head.appendChild(
                script
              );

            }
          );


        scriptCache.set(
          src,
          promise
        );


        return promise;

      }


      /* =====================================================
         LOAD CSS
         ===================================================== */

      function loadCSS(href) {

        if (
          document.querySelector(
            'link[href="' +
            href +
            '"]'
          )
        ) {

          return;

        }


        const link =
          document.createElement(
            "link"
          );


        link.rel =
          "stylesheet";


        link.href =
          href;


        document.head.appendChild(
          link
        );

      }


      /* =====================================================
         FETCH + TRANSFORM JSX
         ===================================================== */

      async function fetchAndTransform(
        src
      ) {

        console.log(
          "[Wealthoria] Fetching:",
          src
        );


        const response =
          await fetch(
            src,
            {
              cache: "no-cache"
            }
          );


        if (!response.ok) {

          throw new Error(
            "Failed to fetch " +
            src +
            " (" +
            response.status +
            ")"
          );

        }


        const source =
          await response.text();


        const result =
          Babel.transform(
            source,
            {
              presets: [
                "react",
                "env"
              ]
            }
          );


        return {
          src,
          code: result.code
        };

      }


      /* =====================================================
         LOAD JSX FILES IN PARALLEL
         THEN EXECUTE IN CORRECT ORDER
         ===================================================== */

      async function loadJSXFiles(
        sources
      ) {

        /*
         * All network requests happen together.
         * This is considerably faster than:
         *
         * await file1
         * await file2
         * await file3
         *
         */

        const compiled =
          await Promise.all(
            sources.map(
              fetchAndTransform
            )
          );


        /*
         * Execute in the order requested.
         */

        for (
          const item of compiled
        ) {

          const script =
            document.createElement(
              "script"
            );


          script.type =
            "text/javascript";


          script.text =
            item.code;


          document.body.appendChild(
            script
          );


          console.log(
            "[Wealthoria] Executed:",
            item.src
          );

        }

      }


      /* =====================================================
         FIREBASE CORE
         ===================================================== */

      async function loadFirebase(
        withAuth
      ) {

        await loadScript(
          "https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"
        );


        await loadScript(
          "https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"
        );


        if (withAuth) {

          await loadScript(
            "https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"
          );

        }


        if (
          !window.firebase
        ) {

          throw new Error(
            "Firebase failed to load."
          );

        }


        const config = {

          apiKey:
            "AIzaSyDYeZggBRJ1oP8r8yjuNMYYs5VSOX3yfnE",

          authDomain:
            "wealthoria-6fc11.firebaseapp.com",

          projectId:
            "wealthoria-6fc11",

          storageBucket:
            "wealthoria-6fc11.firebasestorage.app",

          messagingSenderId:
            "141910518023",

          appId:
            "1:141910518023:web:7198ed847f459cb71ebda2",

          measurementId:
            "G-Q9955KR0G6"

        };


        if (
          !firebase.apps.length
        ) {

          firebase.initializeApp(
            config
          );

        }


        window.firebase =
          firebase;


        window.db =
          firebase.firestore();


        if (withAuth) {

          window.auth =
            firebase.auth();

        }


        console.log(
          "[Wealthoria] Firebase ready"
        );

      }


      /* =====================================================
         PUBLIC WEBSITE
         ===================================================== */

      async function loadPublic() {

        /*
         * Public site needs Firestore because
         * some sections use published data.
         */

        await loadFirebase(
          false
        );


        /*
         * Load GSAP together with the JSX
         * rather than waiting before everything.
         */

        const gsapPromise =
          Promise.all([

            loadScript(
              "https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"
            ),

            loadScript(
              "https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"
            )

          ]);


        await Promise.all([

          loadJSXFiles([

            "/app/content.jsx?v=5",

            "/app/ui.jsx?v=5",

            "/app/sections-a.jsx?v=5",

            "/app/sections-b.jsx?v=5",

            "/app/calculators.jsx?v=5",

            "/app/sections-c.jsx?v=5",

            "/app/sections-d.jsx?v=5",

            "/app/anim.jsx?v=5",

            "/app/EnquiryForm.jsx?v=5"

          ]),

          gsapPromise

        ]);


        /*
         * App must execute LAST.
         */

        await loadJSXFiles([

          "/app/app.jsx?v=5"

        ]);

      }


      /* =====================================================
         MEMBER BASE COMPONENTS
         ===================================================== */

      const MEMBER_FILES = {

        login:
          "/members/login.jsx?v=5",

        forgot:
          "/members/ForgotPassword.jsx?v=5",

        dashboard:
          "/members/dashboard.jsx?v=5",

        courses:
          "/members/CourseVideos.jsx?v=5",

        newsletter:
          "/members/Newsletter.jsx?v=5",

        purchase:
          "/members/MemberHistoryPurchase.jsx?v=5",

        seminar:
          "/members/SeminarRegistrations.jsx?v=5",

        weekly:
          "/members/WeeklyRoundup.jsx?v=5",

        settings:
          "/members/settings.jsx?v=5",

        subscription:
          "/members/subscription.jsx?v=5",

        router:
          "/members/app.jsx?v=5"

      };


      /* =====================================================
         DETERMINE INITIAL MEMBER FILES
         ===================================================== */

      function getInitialMemberFiles() {

        if (
          path === "/members/login" ||
          path === "/members/" ||
          path === "/members"
        ) {

          return [

            MEMBER_FILES.login,

            MEMBER_FILES.forgot

          ];

        }


        if (
          path === "/members/forgot-password"
        ) {

          return [

            MEMBER_FILES.login,

            MEMBER_FILES.forgot

          ];

        }


        if (
          path === "/members/dashboard"
        ) {

          return [

            MEMBER_FILES.dashboard

          ];

        }


        if (
          path === "/members/course-videos"
        ) {

          return [

            MEMBER_FILES.courses

          ];

        }


        if (
          path === "/members/newsletter"
        ) {

          return [

            MEMBER_FILES.newsletter

          ];

        }


        if (
          path === "/members/purchase-history"
        ) {

          return [

            MEMBER_FILES.purchase

          ];

        }


        if (
          path === "/members/weekly-roundup" ||
          path === "/members/market-roundup"
        ) {

          return [

            MEMBER_FILES.weekly

          ];

        }


        if (
          path === "/members/seminar-registrations"
        ) {

          return [

            MEMBER_FILES.seminar

          ];

        }


        if (
          path === "/members/settings"
        ) {

          return [

            MEMBER_FILES.settings

          ];

        }


        if (
          path === "/members/subscription"
        ) {

          return [

            MEMBER_FILES.subscription

          ];

        }


        return [

          MEMBER_FILES.login,

          MEMBER_FILES.forgot

        ];

      }


      /* =====================================================
         PRELOAD MEMBER FILES
         ===================================================== */

      async function preloadMemberFiles(
        initialFiles
      ) {

        const remaining =
          Object.values(
            MEMBER_FILES
          )
          .filter(
            file =>
              !initialFiles.includes(
                file
              ) &&
              file !== MEMBER_FILES.router
          );


        /*
         * Background preload.
         *
         * It DOES NOT block the current
         * page from being displayed.
         */

        Promise
          .resolve()
          .then(
            async function () {

              try {

                await loadJSXFiles(
                  remaining
                );


                console.log(
                  "[Wealthoria] Member modules preloaded"
                );

              }
              catch (error) {

                console.warn(
                  "[Wealthoria] Background member preload failed:",
                  error
                );

              }

            }
          );

      }


      /* =====================================================
         MEMBER PORTAL
         ===================================================== */

      async function loadMembers() {

        /*
         * Member CSS only.
         */

        loadCSS(
          "/members/portal.css?v=5"
        );


        /*
         * Member pages use Firestore once
         * authenticated dashboard features
         * are opened.
         *
         * Login itself does NOT need Firebase.
         */

        const initialFiles =
          getInitialMemberFiles();


        const needsFirebase =
          !(
            path === "/members/login" ||
            path === "/members/" ||
            path === "/members" ||
            path === "/members/forgot-password"
          );


        if (needsFirebase) {

          await loadFirebase(
            false
          );

        }


        /*
         * Load the initial page only.
         */

        await loadJSXFiles(
          initialFiles
        );


        /*
         * Router is required for all member
         * routes.
         */

        await loadJSXFiles([

          MEMBER_FILES.router

        ]);


        /*
         * Ensure router exists.
         */

        if (
          typeof window.MembersRouter !==
          "function"
        ) {

          throw new Error(
            "MembersRouter failed to load."
          );

        }


        /*
         * Mount Members Router.
         */

        const rootElement =
          document.getElementById(
            "root"
          );


        if (!rootElement) {

          throw new Error(
            "Root element not found."
          );

        }


        const root =
          ReactDOM.createRoot(
            rootElement
          );


        root.render(
          React.createElement(
            window.MembersRouter
          )
        );


        console.log(
          "[Wealthoria] Members Portal mounted"
        );


        /*
         * Load other member pages in the
         * background after the current page
         * is already visible.
         */

        preloadMemberFiles(
          initialFiles
        );

      }


      /* =====================================================
         REMOVE STARTUP SCREEN
         ===================================================== */

      function removeStartup() {

        const startup =
          document.getElementById(
            "wealthoria-startup"
          );


        if (startup) {

          startup.remove();

        }

      }


      /* =====================================================
         ERROR SCREEN
         ===================================================== */

      function showError(
        error
      ) {

        console.error(
          "[Wealthoria] Startup error:",
          error
        );


        const root =
          document.getElementById(
            "root"
          );


        if (!root) {

          return;

        }


        root.innerHTML = `

          <div
            style="
              min-height:100vh;
              display:flex;
              align-items:center;
              justify-content:center;
              padding:30px;
              font-family:Arial,sans-serif;
              text-align:center;
            "
          >

            <div>

              <h2>
                Wealthoria could not load
              </h2>

              <p
                style="
                  color:#666;
                "
              >
                Please refresh the page and try again.
              </p>

              <button
                type="button"
                onclick="location.reload()"
                style="
                  border:0;
                  border-radius:8px;
                  padding:12px 20px;
                  background:#e8473f;
                  color:#fff;
                  cursor:pointer;
                "
              >
                Refresh
              </button>

            </div>

          </div>

        `;

      }


      /* =====================================================
         START
         ===================================================== */

      async function start() {

        try {

          /*
           * ADMIN
           */

          if (
            path === "/admin" ||
            path.startsWith("/admin/")
          ) {

            window.location.href =
              "/Admin%20Portal.html#/admin/login";

            return;

          }


          /*
           * MEMBERS
           */

          if (
            path === "/members" ||
            path.startsWith("/members/")
          ) {

            await loadMembers();

            removeStartup();

            return;

          }


          /*
           * PUBLIC
           */

          await loadPublic();

          removeStartup();

        }
        catch (error) {

          showError(
            error
          );

        }

      }


      /* =====================================================
         WAIT FOR RUNTIME
         ===================================================== */

      function waitForRuntime() {

        if (
          window.React &&
          window.ReactDOM &&
          window.Babel
        ) {

          start();

          return;

        }


        window.setTimeout(
          waitForRuntime,
          20
        );

      }


      waitForRuntime();

    })();

  </script>

       PWA
       ===================================================== -->

  <script
    src="/pwa-register.js"
    defer>
  </script>

       CURSOR
       ===================================================== -->

  <script

    defer>
  </script>


</body>
