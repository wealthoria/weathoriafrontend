  <!-- =====================================================
       APPLICATION BOOTSTRAP
       ===================================================== -->

  <script>

    (function () {

      "use strict";


      const currentPath =
        window.location.pathname || "/";


      console.log(
        "[Wealthoria] Route:",
        currentPath
      );


      /*
       * -----------------------------------------------------
       * LOAD JAVASCRIPT / JSX FILE
       * -----------------------------------------------------
       *
       * We cannot dynamically create:
       *
       * <script type="text/babel">
       *
       * because Babel Standalone does not reliably process
       * dynamically inserted JSX script tags.
       *
       * Instead:
       *
       * 1. fetch the JSX file
       * 2. Babel transforms it
       * 3. transformed JavaScript is executed
       */

      async function loadJSXFile(src) {

        console.log(
          "[Wealthoria] Loading:",
          src
        );


        const response =
          await fetch(src, {
            cache: "no-cache"
          });


        if (!response.ok) {

          throw new Error(
            "Unable to load " +
            src +
            " (" +
            response.status +
            ")"
          );

        }


        const source =
          await response.text();


        const transformed =
          Babel.transform(
            source,
            {
              presets: [
                "react",
                "env"
              ]
            }
          ).code;


        const script =
          document.createElement("script");


        script.type =
          "text/javascript";


        script.text =
          transformed;


        document.body.appendChild(
          script
        );


        console.log(
          "[Wealthoria] Loaded:",
          src
        );

      }


      /*
       * -----------------------------------------------------
       * PUBLIC WEBSITE
       * -----------------------------------------------------
       */

      async function loadPublicWebsite() {

        await loadJSXFile(
          "/app/content.jsx?v=4"
        );

        await loadJSXFile(
          "/app/ui.jsx?v=4"
        );

        await loadJSXFile(
          "/app/sections-a.jsx?v=4"
        );

        await loadJSXFile(
          "/app/sections-b.jsx?v=4"
        );

        await loadJSXFile(
          "/app/calculators.jsx?v=4"
        );

        await loadJSXFile(
          "/app/sections-c.jsx?v=4"
        );

        await loadJSXFile(
          "/app/sections-d.jsx?v=4"
        );

        await loadJSXFile(
          "/app/anim.jsx?v=4"
        );

        /*
         * GSAP is required by the public animation code.
         * Load it only for the public website.
         */

        await loadNormalScript(
          "https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"
        );

        await loadNormalScript(
          "https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"
        );


        await loadJSXFile(
          "/app/app.jsx?v=4"
        );

      }


      /*
       * -----------------------------------------------------
       * MEMBER PORTAL
       * -----------------------------------------------------
       */

      async function loadMembersPortal() {

        /*
         * Members CSS is loaded only here.
         */

        loadStylesheet(
          "/members/portal.css?v=4"
        );


        await loadJSXFile(
          "/app/content.jsx?v=4"
        );

        await loadJSXFile(
          "/members/login.jsx?v=4"
        );

        await loadJSXFile(
          "/members/ForgotPassword.jsx?v=4"
        );

        await loadJSXFile(
          "/members/CourseVideos.jsx?v=4"
        );

        await loadJSXFile(
          "/members/Newsletter.jsx?v=4"
        );

        await loadJSXFile(
          "/members/MemberHistoryPurchase.jsx?v=4"
        );

        await loadJSXFile(
          "/members/SeminarRegistrations.jsx?v=4"
        );

        await loadJSXFile(
          "/members/WeeklyRoundup.jsx?v=4"
        );

        await loadJSXFile(
          "/members/dashboard.jsx?v=4"
        );

        await loadJSXFile(
          "/members/settings.jsx?v=4"
        );

        await loadJSXFile(
          "/members/subscription.jsx?v=4"
        );

        /*
         * Router must always be last.
         */

        await loadJSXFile(
          "/members/members-router.jsx?v=4"
        );

      }


      /*
       * -----------------------------------------------------
       * NORMAL SCRIPT LOADER
       * -----------------------------------------------------
       */

      function loadNormalScript(src) {

        return new Promise(
          function (resolve, reject) {

            const script =
              document.createElement("script");


            script.src =
              src;


            script.onload =
              function () {

                console.log(
                  "[Wealthoria] Loaded:",
                  src
                );

                resolve();

              };


            script.onerror =
              function () {

                reject(
                  new Error(
                    "Unable to load " +
                    src
                  )
                );

              };


            document.head.appendChild(
              script
            );

          }
        );

      }


      /*
       * -----------------------------------------------------
       * DYNAMIC CSS
       * -----------------------------------------------------
       */

      function loadStylesheet(href) {

        const existing =
          document.querySelector(
            'link[href="' + href + '"]'
          );


        if (existing) {

          return;

        }


        const link =
          document.createElement("link");


        link.rel =
          "stylesheet";


        link.href =
          href;


        document.head.appendChild(
          link
        );

      }


      /*
       * -----------------------------------------------------
       * ERROR SCREEN
       * -----------------------------------------------------
       */

      function showBootError(error) {

        console.error(
          "[Wealthoria] Startup error:",
          error
        );


        const root =
          document.getElementById("root");


        if (!root) {

          return;

        }


        root.innerHTML = `

          <div
            style="
              min-height:100vh;
              display:flex;
              align-items:center;
              justify-content:center;
              padding:30px;
              background:#fff;
              font-family:Arial,sans-serif;
              text-align:center;
            "
          >

            <div
              style="
                max-width:500px;
              "
            >

              <h2
                style="
                  margin-bottom:10px;
                "
              >
                Wealthoria could not load
              </h2>

              <p
                style="
                  color:#666;
                  line-height:1.6;
                "
              >
                Something went wrong while loading
                the application. Please refresh the page.
              </p>

              <button
                onclick="location.reload()"
                style="
                  border:0;
                  border-radius:8px;
                  padding:12px 22px;
                  background:#e8473f;
                  color:#fff;
                  cursor:pointer;
                  font-size:14px;
                "
              >
                Refresh
              </button>

            </div>

          </div>

        `;

      }


      /*
       * -----------------------------------------------------
       * REMOVE LOADING SCREEN
       * -----------------------------------------------------
       */

      function removeLoadingScreen() {

        const loader =
          document.getElementById(
            "wealthoria-loading"
          );


        if (loader) {

          loader.remove();

        }

      }


      /*
       * -----------------------------------------------------
       * START APPLICATION
       * -----------------------------------------------------
       */

      async function startApplication() {

        try {

          /*
           * ADMIN
           */

          if (
            currentPath === "/admin" ||
            currentPath.startsWith("/admin/")
          ) {

            console.log(
              "[Wealthoria] Opening Admin Portal"
            );


            window.location.href =
              "/Admin%20Portal.html#/admin/login";


            return;

          }


          /*
           * MEMBERS
           */

          if (
            currentPath === "/members" ||
            currentPath.startsWith("/members/")
          ) {

            console.log(
              "[Wealthoria] Opening Members Portal"
            );


            await loadMembersPortal();


            removeLoadingScreen();


            return;

          }


          /*
           * PUBLIC WEBSITE
           */

          console.log(
            "[Wealthoria] Opening Public Website"
          );


          await loadPublicWebsite();


          removeLoadingScreen();

        }
        catch (error) {

          showBootError(error);

        }

      }


      /*
       * -----------------------------------------------------
       * WAIT FOR REQUIRED RUNTIME
       * -----------------------------------------------------
       */

      function waitForRuntime() {

        if (
          window.React &&
          window.ReactDOM &&
          window.Babel &&
          window.firebase
        ) {

          startApplication();


          return;

        }


        setTimeout(
          waitForRuntime,
          25
        );

      }


      waitForRuntime();


    })();

  </script>
