<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact Us | Wealthoria</title>

  <meta
    name="description"
    content="Contact Wealthoria Education for webinar support, financial education, investment learning, and other enquiries."
  >

  <link
    rel="canonical"
    href="https://www.wealthoria.in/contact.html"
  >

  <!-- Open Graph -->
  <meta property="og:title" content="Contact Us | Wealthoria">
  <meta
    property="og:description"
    content="Contact Wealthoria Education for webinar support, financial education, investment learning, and other enquiries."
  >
  <meta
    property="og:url"
    content="https://www.wealthoria.in/contact.html"
  >
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Wealthoria">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Contact Us | Wealthoria">
  <meta
    name="twitter:description"
    content="Contact Wealthoria Education for webinar support, financial education, investment learning, and other enquiries."
  >

  <!-- Favicon -->
  <link
    rel="icon"
    type="image/png"
    href="/assets/logo-mark.png"
  >

  <!-- Wealthoria Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap"
    rel="stylesheet"
  >

  <!-- Wealthoria Theme -->
  <link
    rel="stylesheet"
    href="/assets/colors_and_type.css"
  >

  <link
    rel="stylesheet"
    href="/app/site.css?v=5"
  >

  <!-- Contact Page Styling -->
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Marcellus", serif;
      background: var(--bg, #fff);
      color: var(--text, #222);
    }

    .contact-page {
      max-width: 900px;
      margin: 0 auto;
      padding: 80px 24px;
    }

    .contact-card {
      padding: 40px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
    }

    .contact-page h1 {
      margin-top: 0;
      margin-bottom: 30px;
      font-size: 42px;
    }

    .contact-page p {
      font-size: 18px;
      line-height: 1.8;
      margin: 14px 0;
    }

    .contact-page a {
      color: #e8473f;
      text-decoration: none;
      font-weight: 600;
    }

    .contact-page a:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .contact-page {
        padding: 50px 18px;
      }

      .contact-card {
        padding: 28px 22px;
      }

      .contact-page h1 {
        font-size: 32px;
      }

      .contact-page p {
        font-size: 16px;
      }
    }
  </style>

  <!-- Contact Page Schema -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ContactPage",
    "name": "Contact Us | Wealthoria",
    "url": "https://www.wealthoria.in/contact.html",
    "description": "Contact Wealthoria Education for webinar support, financial education, investment learning, and other enquiries.",
    "publisher": {
      "@type": "Organization",
      "name": "Wealthoria",
      "url": "https://www.wealthoria.in/"
    }
  }
  </script>

</head>

<body>

  <main class="contact-page">

    <div class="contact-card">

      <h1>Contact Us</h1>

      <p>
        <strong>Wealthoria Education</strong>
      </p>

      <p>
        Email:
        <a href="mailto:support@wealthoria.in">
          support@wealthoria.in
        </a>
      </p>

      <p>
        Website:
        <a href="https://www.wealthoria.in/">
          www.wealthoria.in
        </a>
      </p>

      <p>
        For webinar support, please email us anytime.
      </p>

    </div>

  </main>

</body>
</html>
