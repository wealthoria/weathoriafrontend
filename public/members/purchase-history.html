<body>

  <div
    id="purchase-history-root">
  </div>


  <script
    type="text/babel"
  >

    const {
      useState,
      useEffect
    } = React;


    /* =====================================================
       PURCHASE HISTORY COMPONENT
    ===================================================== */

    function PurchaseHistoryPage() {

      const [
        purchases,
        setPurchases
      ] = useState([]);


      const [
        loading,
        setLoading
      ] = useState(true);


      const [
        error,
        setError
      ] = useState("");


      const [
        search,
        setSearch
      ] = useState("");


      const [
        fromDate,
        setFromDate
      ] = useState("");


      const [
        toDate,
        setToDate
      ] = useState("");


      /* =================================================
         LOAD CURRENT USER PURCHASES
      ================================================= */
useEffect(() => {

  if (!window.db) {

    setError(
      "Firestore is not available."
    );

    setLoading(false);

    return;
  }


  let session = null;

  try {

    session = JSON.parse(
      localStorage.getItem("wealthoria-member") ||
      sessionStorage.getItem("wealthoria-member") ||
      "null"
    );

  } catch (error) {

    console.error(
      "Unable to read member session:",
      error
    );

  }


  if (!session?.uid) {

    setPurchases([]);

    setError(
      "Please login to view your purchase history."
    );

    setLoading(false);

    return;
  }


  console.log(
    "PURCHASE HISTORY MEMBER:",
    session.uid,
    session.email
  );


  setLoading(true);
  setError("");


  const unsubscribePurchases =
    window.db
      .collection("coursePurchases")
      .where(
        "userId",
        "==",
        session.uid
      )
      .onSnapshot(

        (snapshot) => {

          console.log(
            "PURCHASE HISTORY DOC COUNT:",
            snapshot.size
          );


          const rows =
            snapshot.docs.map(
              (doc) => ({
                id: doc.id,
                ...doc.data()
              })
            );


          rows.sort(
            (a, b) => {

              const getTime =
                (value) => {

                  if (!value) {
                    return 0;
                  }


                  if (
                    typeof value.toMillis ===
                    "function"
                  ) {

                    return value.toMillis();

                  }


                  if (
                    typeof value.toDate ===
                    "function"
                  ) {

                    return value
                      .toDate()
                      .getTime();

                  }


                  const parsed =
                    new Date(value).getTime();


                  return Number.isNaN(
                    parsed
                  )
                    ? 0
                    : parsed;

                };


              return (
                getTime(b.paidAt) -
                getTime(a.paidAt)
              );

            }
          );


          setPurchases(rows);

          setLoading(false);

          setError("");

        },

        (err) => {

          console.error(
            "Purchase history error:",
            err
          );

          setError(
            "Unable to load your purchase history."
          );

          setLoading(false);

        }
      );


  return () => {

    unsubscribePurchases();

  };

}, []);

      /* =================================================
         FORMAT DATE
      ================================================= */

      const formatDate =
        (value) => {

          if (!value) {
            return "—";
          }


          let date = null;


          try {

            if (
              typeof value.toDate ===
              "function"
            ) {

              date =
                value.toDate();

            } else {

              date =
                new Date(value);

            }


            if (
              !date ||
              Number.isNaN(
                date.getTime()
              )
            ) {

              return "—";

            }


            return date.toLocaleString(
              "en-IN",
              {

                day:
                  "2-digit",

                month:
                  "short",

                year:
                  "numeric",

                hour:
                  "2-digit",

                minute:
                  "2-digit"

              }
            );

          } catch (
            err
          ) {

            return "—";

          }

        };


      /* =================================================
         FORMAT AMOUNT
      ================================================= */

      const formatAmount =
        (amount) => {

          const value =
            Number(
              amount || 0
            );


          return value.toLocaleString(
            "en-IN",
            {

              minimumFractionDigits:
                0,

              maximumFractionDigits:
                2

            }
          );

        };


      /* =================================================
         FILTER
      ================================================= */

      const filteredPurchases =
        purchases.filter(
          (purchase) => {

            const query =
              search
                .trim()
                .toLowerCase();


            const matchesSearch =
              !query ||

              String(
                purchase.courseTitle ||
                ""
              )
                .toLowerCase()
                .includes(query) ||

              String(
                purchase.razorpayPaymentId ||
                ""
              )
                .toLowerCase()
                .includes(query) ||

              String(
                purchase.razorpayOrderId ||
                ""
              )
                .toLowerCase()
                .includes(query) ||

              String(
                purchase.courseId ||
                ""
              )
                .toLowerCase()
                .includes(query);


            const getPurchaseTime =
              (value) => {

                if (!value) {
                  return 0;
                }


                if (
                  typeof value.toMillis ===
                  "function"
                ) {

                  return value.toMillis();

                }


                if (
                  typeof value.toDate ===
                  "function"
                ) {

                  return value
                    .toDate()
                    .getTime();

                }


                const time =
                  new Date(value)
                    .getTime();


                return Number.isNaN(
                  time
                )
                  ? 0
                  : time;

              };


            const purchaseTime =
              getPurchaseTime(
                purchase.paidAt
              );


            let matchesFromDate =
              true;


            let matchesToDate =
              true;


            if (fromDate) {

              const start =
                new Date(
                  `${fromDate}T00:00:00`
                ).getTime();


              matchesFromDate =
                purchaseTime >=
                start;

            }


            if (toDate) {

              const end =
                new Date(
                  `${toDate}T23:59:59.999`
                ).getTime();


              matchesToDate =
                purchaseTime <=
                end;

            }


            return (
              matchesSearch &&
              matchesFromDate &&
              matchesToDate
            );

          }
        );


      /* =================================================
         CLEAR FILTERS
      ================================================= */

      const clearFilters =
        () => {

          setSearch("");

          setFromDate("");

          setToDate("");

        };


      /* =================================================
         RENDER
      ================================================= */

      return (

        <div
          className="purchase-history-wrapper"
        >

          <div
            className="purchase-history-container"
          >

            <a
              href="/members/dashboard"
              className="purchase-history-back"
            >
              ← Back to Dashboard
            </a>


            <section
              className="member-purchase-history-page"
            >


              {/* =========================================
                  HEADER
              ========================================= */}

              <div
                className="purchase-history-header"
              >

                <div>

                  <span
                    className="member-eyebrow"
                  >
                    ACCOUNT
                  </span>

                  <h2>
                    Purchase History
                  </h2>

                  <p>
                    View your course purchases,
                    payment details, and
                    purchase status.
                  </p>

                </div>

              </div>


              {/* =========================================
                  SUMMARY
              ========================================= */}

              {!loading &&
                !error && (

                  <div
                    className="purchase-history-summary"
                  >

                    <div
                      className="purchase-history-stat"
                    >

                      <small>
                        Courses Purchased
                      </small>

                      <strong>
                        {
                          purchases.length
                        }
                      </strong>

                    </div>


                    <div
                      className="purchase-history-stat"
                    >

                      <small>
                        Total Spent
                      </small>

                      <strong>
                        ₹
                        {
                          formatAmount(
                            purchases.reduce(
                              (
                                total,
                                item
                              ) =>
                                total +
                                Number(
                                  item.amount ||
                                  0
                                ),
                              0
                            )
                          )
                        }
                      </strong>

                    </div>

                  </div>

                )}


              {/* =========================================
                  FILTERS
              ========================================= */}

              {!loading &&
                !error && (

                  <>

                    <div
                      className="purchase-history-filters"
                    >

                      <input
                        className="purchase-history-filter-input"
                        type="text"
                        placeholder="Search course or payment..."
                        value={search}
                        onChange={
                          (e) =>
                            setSearch(
                              e.target.value
                            )
                        }
                      />


                      <input
                        className="purchase-history-filter-input"
                        type="date"
                        value={fromDate}
                        onChange={
                          (e) =>
                            setFromDate(
                              e.target.value
                            )
                        }
                        aria-label="From date"
                      />


                      <input
                        className="purchase-history-filter-input"
                        type="date"
                        value={toDate}
                        onChange={
                          (e) =>
                            setToDate(
                              e.target.value
                            )
                        }
                        aria-label="To date"
                      />


                      <button
                        type="button"
                        className="purchase-history-clear"
                        onClick={
                          clearFilters
                        }
                      >
                        Clear
                      </button>

                    </div>


                    {purchases.length >
                      0 && (

                        <div
                          className="purchase-history-results"
                        >

                          Showing{" "}

                          <strong>
                            {
                              filteredPurchases.length
                            }
                          </strong>{" "}

                          of{" "}

                          <strong>
                            {
                              purchases.length
                            }
                          </strong>{" "}

                          purchases

                        </div>

                      )}

                  </>

                )}


              {/* =========================================
                  LOADING
              ========================================= */}

              {loading && (

                <div
                  className="purchase-history-loading"
                >
                  Loading your purchases...
                </div>

              )}


              {/* =========================================
                  ERROR
              ========================================= */}

              {!loading &&
                error && (

                  <div
                    className="purchase-history-error"
                  >

                    <div
                      className="purchase-history-empty-icon"
                    >
                      ⚠
                    </div>

                    <h3>
                      Unable to load purchases
                    </h3>

                    <p>
                      {error}
                    </p>

                  </div>

                )}


              {/* =========================================
                  EMPTY
              ========================================= */}

              {!loading &&
                !error &&
                filteredPurchases.length === 0 &&
                purchases.length === 0 && (

                  <div
                    className="purchase-history-empty"
                  >

                    <div
                      className="purchase-history-empty-icon"
                    >
                      🧾
                    </div>

                    <h3>
                      No purchases yet
                    </h3>

                    <p>
                      Your course purchases will
                      appear here after you complete
                      a payment.
                    </p>

                  </div>

                )}


              {/* =========================================
                  NO FILTER MATCHES
              ========================================= */}

              {!loading &&
                !error &&
                purchases.length > 0 &&
                filteredPurchases.length === 0 && (

                  <div
                    className="purchase-history-empty"
                  >

                    <div
                      className="purchase-history-empty-icon"
                    >
                      🔍
                    </div>

                    <h3>
                      No matching purchases
                    </h3>

                    <p>
                      Try another search term
                      or date range.
                    </p>


                    <button
                      type="button"
                      className="purchase-history-clear"
                      style={{
                        marginTop:
                          "16px"
                      }}
                      onClick={
                        clearFilters
                      }
                    >
                      Clear Filters
                    </button>

                  </div>

                )}


              {/* =========================================
                  PURCHASE LIST
              ========================================= */}

              {!loading &&
                !error &&
                filteredPurchases.length > 0 && (

                  <div
                    className="purchase-history-list"
                  >

                    {filteredPurchases.map(
                      (purchase) => (

                        <article
                          key={
                            purchase.id
                          }
                          className="purchase-history-card"
                        >

                          <div
                            className="purchase-history-main"
                          >

                            <div>

                              <span
                                className="purchase-history-course-label"
                              >
                                COURSE
                              </span>


                              <h3>
                                {
                                  purchase.courseTitle ||
                                  "Course"
                                }
                              </h3>


                              <div
                                className="purchase-history-date"
                              >

                                Purchased{" "}

                                {formatDate(
                                  purchase.paidAt
                                )}

                              </div>

                            </div>


                            <div
                              className="purchase-history-price"
                            >
                              ₹
                              {formatAmount(
                                purchase.amount
                              )}
                            </div>

                          </div>


                          <div
                            className="purchase-history-details"
                          >

                            <div
                              className="purchase-history-detail"
                            >

                              <span>
                                Payment ID
                              </span>

                              <strong
                                title={
                                  purchase.razorpayPaymentId ||
                                  ""
                                }
                              >
                                {
                                  purchase.razorpayPaymentId ||
                                  "—"
                                }
                              </strong>

                            </div>


                            <div
                              className="purchase-history-detail"
                            >

                              <span>
                                Order ID
                              </span>

                              <strong
                                title={
                                  purchase.razorpayOrderId ||
                                  ""
                                }
                              >
                                {
                                  purchase.razorpayOrderId ||
                                  "—"
                                }
                              </strong>

                            </div>


                            <div
                              className="purchase-history-detail"
                            >

                              <span>
                                Course ID
                              </span>

                              <strong
                                title={
                                  purchase.courseId ||
                                  ""
                                }
                              >
                                {
                                  purchase.courseId ||
                                  "—"
                                }
                              </strong>

                            </div>

                          </div>


                          <div
                            className="purchase-history-status"
                          >

                            ✓

                            {purchase.status ||
                              "paid"}

                          </div>

                        </article>

                      )
                    )}

                  </div>

                )}

            </section>

          </div>

        </div>

      );

    }
