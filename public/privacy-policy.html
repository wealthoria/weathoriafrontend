<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Privacy Policy | Wealthoria</title>

  <meta
    name="description"
    content="Read Wealthoria's Privacy Policy to understand how we collect, use and protect your personal information."
  >

  <link
    rel="canonical"
    href="https://www.wealthoria.in/privacy-policy.html"
  >

  <!-- Open Graph -->
  <meta property="og:title" content="Privacy Policy | Wealthoria">
  <meta
    property="og:description"
    content="Read Wealthoria's Privacy Policy to understand how we collect, use and protect your personal information."
  >
  <meta
    property="og:url"
    content="https://www.wealthoria.in/privacy-policy.html"
  >
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Wealthoria">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Privacy Policy | Wealthoria">
  <meta
    name="twitter:description"
    content="Read Wealthoria's Privacy Policy to understand how we collect, use and protect your personal information."
  >

  <!-- Favicon -->
  <link
    rel="icon"
    type="image/png"
    href="/assets/logo-mark.png"
  >

  <!-- Wealthoria Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap"
    rel="stylesheet"
  >

  <!-- Wealthoria Theme -->
  <link
    rel="stylesheet"
    href="/assets/colors_and_type.css"
  >

  <link
    rel="stylesheet"
    href="/app/site.css?v=6"
  >

  <!-- Privacy Page Styling -->
  <style>
    body {
      margin: 0;
      min-height: 100vh;
    
      background: var(--bg, #fff);
      color: var(--text, #222);
    }

    .privacy-page {
      max-width: 900px;
      margin: 0 auto;
      padding: 80px 24px;
    }

    .privacy-card {
      padding: 40px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
    }

    .privacy-page h1 {
      margin-top: 0;
      margin-bottom: 30px;
      font-size: 42px;
    }

    .privacy-page p {
      font-size: 18px;
      line-height: 1.8;
      margin: 18px 0;
    }

    .privacy-page a {
      color: #e8473f;
      text-decoration: none;
      font-weight: 600;
    }

    .privacy-page a:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .privacy-page {
        padding: 50px 18px;
      }

      .privacy-card {
        padding: 28px 22px;
      }

      .privacy-page h1 {
        font-size: 32px;
      }

      .privacy-page p {
        font-size: 16px;
      }
    }
  </style>

  <!-- Privacy Policy Schema -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "name": "Privacy Policy | Wealthoria",
    "url": "https://www.wealthoria.in/privacy-policy.html",
    "description": "Wealthoria's Privacy Policy explains how personal information is collected, used and protected.",
    "publisher": {
      "@type": "Organization",
      "name": "Wealthoria",
      "url": "https://www.wealthoria.in/"
    }
  }
  </script>

</head>
<body>
  <div id="root"></div>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
