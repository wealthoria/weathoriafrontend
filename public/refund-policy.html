<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cancellation & Refund Policy | Wealthoria</title>

  <meta
    name="description"
    content="Read Wealthoria's Cancellation & Refund Policy for webinar registrations, cancellations and eligible refunds."

    href="https://www.wealthoria.in/refund-policy.html"
  >

  <!-- Open Graph -->
  <meta property="og:title" content="Cancellation & Refund Policy | Wealthoria">

    property="og:description"
    content="Read Wealthoria's Cancellation & Refund Policy for webinar registrations, cancellations and eligible refunds."

  <meta
    property="og:url"
    content="https://www.wealthoria.in/refund-policy.html"
  >
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Wealthoria">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary">
  <meta
    name="twitter:title"
    content="Cancellation & Refund Policy | Wealthoria"
  >
  <meta
    name="twitter:description"
    content="Read Wealthoria's Cancellation & Refund Policy for webinar registrations, cancellations and eligible refunds."
  >

  <!-- Favicon -->
  <link
    rel="icon"
    type="image/png"
    href="/assets/logo-mark.png"
  >

  <!-- Wealthoria Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap"
    rel="stylesheet"
  >

  <!-- Wealthoria Theme -->
  <link
    rel="stylesheet"
    href="/assets/colors_and_type.css"
  >

  <link
    rel="stylesheet"
    href="/app/site.css?v=5"
  >

  <!-- Page Styling -->
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Marcellus", serif;
      background: var(--bg, #fff);
      color: var(--text, #222);
    }

    .refund-page {
      max-width: 900px;
      margin: 0 auto;
      padding: 80px 24px;
    }

    .refund-card {
      padding: 40px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
    }

    .refund-page h1 {
      margin-top: 0;
      margin-bottom: 30px;
      font-size: 42px;
    }

    .refund-page p {
      font-size: 18px;
      line-height: 1.8;
      margin: 18px 0;
    }

    .refund-page a {
      color: #e8473f;
      text-decoration: none;
      font-weight: 600;
    }

    .refund-page a:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .refund-page {
        padding: 50px 18px;
      }

      .refund-card {
        padding: 28px 22px;
      }

      .refund-page h1 {
        font-size: 32px;
      }

      .refund-page p {
        font-size: 16px;
      }
    }
  </style>

  <!-- Refund Policy Schema -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "name": "Cancellation & Refund Policy | Wealthoria",
    "url": "https://www.wealthoria.in/refund-policy.html",
    "description": "Wealthoria's Cancellation & Refund Policy for webinar registrations.",
    "publisher": {
      "@type": "Organization",
      "name": "Wealthoria",
      "url": "https://www.wealthoria.in/"
    }
  }
  </script>

</head>

<body>

  <main class="refund-page">

    <div class="refund-card">

      <h1>Cancellation & Refund Policy</h1>

      <p>
        Webinar registrations are generally non-refundable.
      </p>

      <p>
        If a webinar is cancelled by Wealthoria, eligible participants
        will receive a full refund.
      </p>

      <p>
        For assistance, contact
        <a href="mailto:support@wealthoria.in">
          support@wealthoria.in
        </a>.
      </p>

    </div>

  </main>

</body>
</html>
