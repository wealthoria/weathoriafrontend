<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wealthoria Premium Subscription</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#f5f7fb;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{
width:420px;
background:#fff;
padding:35px;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.logo{
text-align:center;
margin-bottom:15px;
}

.logo img{
width:80px;
}

h2{
text-align:center;
margin-bottom:10px;
}

p{
text-align:center;
color:#666;
margin-bottom:25px;
}

.price{
font-size:28px;
font-weight:bold;
text-align:center;
color:#00a86b;
margin-bottom:25px;
}

.input{
margin-bottom:18px;
}

label{
display:block;
margin-bottom:6px;
font-weight:600;
}

input{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:8px;
font-size:15px;
}

button{
width:100%;
padding:15px;
background:#00a86b;
border:none;
border-radius:8px;
color:#fff;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#00895d;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">
<img src="assets/logo.png">
</div>

<h2>Wealthoria Premium</h2>

<p>Start Your Investment Learning Journey</p>

<div class="price">
₹1 / Week (Test)
</div>

<div class="input">
<label>Full Name</label>
<input id="name" placeholder="Enter Full Name">
</div>

<div class="input">
<label>Email</label>
<input id="email" type="email" placeholder="Enter Email">
</div>

<div class="input">
<label>Phone Number</label>
<input id="phone" placeholder="Enter Phone Number">
</div>

<button onclick="subscribeNow()">
Subscribe Now
</button>

</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<!-- Your Firebase Config -->
<script src="firebase/firebase.js"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>

async function subscribeNow(){

const name=document.getElementById("name").value.trim();
const email=document.getElementById("email").value.trim();
const phone=document.getElementById("phone").value.trim();

if(!name || !email || !phone){

alert("Please fill all fields");

return;

}

try{

console.log(window.db);

const docRef=await window.db.collection("subscriptions").add({

name:name,

email:email,

phone:phone,

plan:"Wealthoria Premium",

amount:1,

status:"pending",

subscriptionId:"",

paymentId:"",

customerId:"",

nextBillingDate:"",

createdAt:firebase.firestore.FieldValue.serverTimestamp()

});

alert("Saved Successfully");

console.log(docRef.id);
const response = fetch("https://webinar-registration-backend.onrender.com/api/subscription/create", {
    method: "POST",
    headers: {
        "Content-Type": "application/json"
    },
    body: JSON.stringify({
        name,
        email,
        phone,
        firestoreId: docRef.id
    })
});

const data = await response.json();

if (!data.success) {
    throw new Error(data.message);
}

const options = {
    key: data.key,
    subscription_id: data.subscriptionId,
    name: "Wealthoria Premium",
    description: "₹1 Weekly Subscription",
    handler: function (response) {
        alert("Payment Successful");
        console.log(response);
    },
    prefill: {
        name,
        email,
        contact: phone
    },
    theme: {
        color: "#00a86b"
    }
};

const rzp = new Razorpay(options);
rzp.open();

}catch(err){

console.error(err);

alert(err.message);

}

}

</script>

</body>
</html>
