<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wealthoria Premium Subscription</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f5f7fb;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{
width:420px;
background:#fff;
padding:35px;
border-radius:18px;
box-shadow:0 15px 40px rgba(0,0,0,.12);
}

.logo{
text-align:center;
margin-bottom:15px;
}

.logo img{
width:80px;
}

h2{
text-align:center;
margin-bottom:8px;
}

p{
text-align:center;
color:#666;
margin-bottom:30px;
}

.input{
margin-bottom:18px;
}

.input label{
display:block;
margin-bottom:6px;
font-weight:500;
}

.input input{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:10px;
font-size:15px;
outline:none;
}

.input input:focus{
border-color:#009688;
}

button{

width:100%;
padding:15px;
background:#00a86b;
color:#fff;
border:none;
border-radius:10px;
font-size:16px;
font-weight:600;
cursor:pointer;
transition:.3s;

}

button:hover{
background:#008d5a;
}

.price{

text-align:center;
font-size:28px;
font-weight:bold;
margin-bottom:25px;
color:#00a86b;

}

</style>

</head>

<body>

<div class="container">

<div class="logo">

<img src="assets/logo.png">

</div>

<h2>Wealthoria Premium</h2>

<p>Start Your Investment Learning Journey</p>

<div class="price">
₹1 <span style="font-size:15px;">/ Week (Test)</span>
</div>

<div class="input">
<label>Full Name</label>
<input
id="name"
type="text"
placeholder="Enter Full Name">
</div>

<div class="input">
<label>Email</label>
<input
id="email"
type="email"
placeholder="Enter Email">
</div>

<div class="input">
<label>Phone Number</label>
<input
id="phone"
type="text"
placeholder="Enter Phone Number">
</div>

<button onclick="subscribeNow()">
Subscribe Now
</button>

</div>
<script>
async function subscribeNow(){

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();

    if(!name || !email || !phone){
        alert("Please fill all fields.");
        return;
    }

    try{

        const docRef = await window.db.collection("subscriptions").add({

            name: name,
            email: email,
            phone: phone,

            plan: "Wealthoria Premium",

            amount: 1,

            status: "pending",

            createdAt: firebase.firestore.FieldValue.serverTimestamp()

        });

        console.log("Saved:", docRef.id);

        alert("Details saved successfully!");

        // Next Step:
        // Call Subscription API

    }catch(err){

        console.error(err);

        alert(err.message);

    }

}
</script>

</body>
</html>
