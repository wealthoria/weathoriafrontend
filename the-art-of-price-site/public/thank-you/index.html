<style>
:root{--bg:#0B0B0B;--ink:#F1ECE2;--ink-soft:#CFC9BE;--ink-fine:#A39D93;--green:#1DB66A;--green-ink:#06210F;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;
  background:var(--bg) url("../assets/img/texture.jpg");color:var(--ink);font-family:'Outfit',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
html[lang="kn"] body{font-family:'Noto Sans Kannada','Outfit','Nirmala UI',sans-serif}
.box{max-width:520px;width:100%;text-align:center;border:1px solid var(--line);border-radius:20px;padding:40px 28px;background:rgba(255,255,255,.03);box-shadow:0 20px 60px rgba(0,0,0,0.6)}
.c{width:16px;height:70px;margin:0 auto 26px;background:var(--green);position:relative;box-shadow:0 0 40px rgba(29,182,106,.55);
  animation:grow .8s cubic-bezier(.2,.7,.2,1) both;transform-origin:50% 100%}
.c::before{content:"";position:absolute;left:6px;width:4px;bottom:100%;height:24px;background:var(--green)}
.c.p{background:#C9A227;box-shadow:0 0 40px rgba(201,162,39,.45)}.c.p::before{background:#C9A227}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
h1{font-size:clamp(24px,5vw,32px);margin:0 0 12px;line-height:1.3}
p{color:var(--ink-soft);line-height:1.75;margin:0 0 12px;font-size:15.5px}
.meta{font-family:'Outfit',sans-serif;font-size:13px;color:var(--ink-fine);letter-spacing:.04em;margin-top:20px;padding:12px 16px;background:rgba(255,255,255,0.04);border-radius:10px;border:1px solid rgba(255,255,255,0.08);display:inline-block}
.meta b{color:var(--green);font-weight:700}
a.btn{display:inline-block;margin-top:22px;background:var(--green);color:var(--green-ink);text-decoration:none;font-weight:700;padding:12px 28px;border-radius:10px;box-shadow:0 6px 20px rgba(29,182,106,0.3);transition:all 0.2s}
a.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
a.btn:focus-visible{outline:3px solid var(--green);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.c{animation:none}}
</style>

<body>
<main class="box">
  <div class="c" id="mark" aria-hidden="true"></div>
  <h1 id="h">Thank you!</h1>
  <p id="p1">Your pre-booking for The Art of Price is confirmed.</p>
  <p id="p2">You'll get a confirmation by email and SMS. Books ship in order from 13 December.</p>
  <div class="meta" id="meta"></div><br>
  <a class="btn" id="back" href="/the-art-of-price-kannada.html">Back to the book</a>
</main>
<script src="../assets/js/config.js"></script>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var rawLang = q.get('lang');
  var rawSku = q.get('sku') || '';
  var isKn = rawLang === 'kn' || rawSku.indexOf('KN') !== -1;
  var lang = isKn ? 'kn' : 'en';

  var CFG = window.AOP_CONFIG || {};
  var P = CFG.products || {
    kn: { sku: 'THE-ART-OF-PRICE-KN-EDITION', name: 'The Art of Price (ಕನ್ನಡ ಆವೃತ್ತಿ)', displayPrice: 999, price: 999 },
    en: { sku: 'THE-ART-OF-PRICE-EN-EDITION', name: 'The Art of Price (English Edition)', displayPrice: 999, price: 999 }
  };
  var prod = P[lang] || (isKn ? P.kn : P.en);

  var ok = q.get('s') !== 'pending';
  var order = (q.get('o') || '').replace(/[^\w-]/g, '').slice(0, 40);

  var T = {
    en: {
      ok: ['Thank you!', 'Your pre-booking for The Art of Price (English Edition) is confirmed.', 'You’ll get a confirmation by email and SMS. Books ship in order of booking from 13 December.'],
      pend: ['Payment received', 'We’re confirming your payment with the bank. This usually takes a few minutes.', 'You’ll get a confirmation by email and SMS. If money was deducted and you don’t hear from us within 24 hours, please contact us with the booking ID below.'],
      back: 'Back to the book',
      order: 'Booking ID',
      ed: 'English Edition'
    },
    kn: {
      ok: ['ಧನ್ಯವಾದಗಳು!', 'The Art of Price (ಕನ್ನಡ ಆವೃತ್ತಿ) ನಿಮ್ಮ pre-booking ಖಚಿತವಾಗಿದೆ.', 'Email ಮತ್ತು SMS ಮೂಲಕ ದೃಢೀಕರಣ ಬರುತ್ತದೆ. ಡಿಸೆಂಬರ್ 13 ರಿಂದ book ಮಾಡಿದ ಕ್ರಮದಲ್ಲೇ ರವಾನೆ.'],
      pend: ['ಪಾವತಿ ಬಂದಿದೆ', 'ನಿಮ್ಮ ಪಾವತಿಯನ್ನು ಬ್ಯಾಂಕ್ ಜೊತೆ ಖಚಿತಪಡಿಸುತ್ತಿದ್ದೇವೆ. ಸಾಮಾನ್ಯವಾಗಿ ಕೆಲವು ನಿಮಿಷ ಸಾಕು.', 'Email ಮತ್ತು SMS ಮೂಲಕ ದೃಢೀಕರಣ ಬರುತ್ತದೆ. ಹಣ ಕಡಿತವಾಗಿ 24 ಗಂಟೆಯೊಳಗೆ ನಮ್ಮಿಂದ ಸುದ್ದಿ ಬರದಿದ್ದರೆ, ಕೆಳಗಿನ booking ID ಜೊತೆ ನಮ್ಮನ್ನು ಸಂಪರ್ಕಿಸಿ.'],
      back: 'ಪುಸ್ತಕದ ಪುಟಕ್ಕೆ ಹಿಂತಿರುಗಿ',
      order: 'ಬುಕಿಂಗ್ ID',
      ed: 'ಕನ್ನಡ ಆವೃತ್ತಿ'
    }
  }[lang];

  document.documentElement.lang = lang;
  var s = ok ? T.ok : T.pend;
  document.getElementById('h').textContent = s[0];
  document.getElementById('p1').textContent = s[1];
  document.getElementById('p2').textContent = s[2];
  if (!ok) document.getElementById('mark').classList.add('p');

  var back = document.getElementById('back');
  back.textContent = T.back;
  if (location.protocol === 'file:') {
    back.href = isKn ? '../the-art-of-price-kannada.html' : '../the-art-of-price-english.html';
  } else {
    back.href = isKn ? '/the-art-of-price-kannada.html' : '/the-art-of-price-english.html';
  }

  var meta = [];
  var displaySku = (prod && prod.sku) || (isKn ? 'THE-ART-OF-PRICE-KN-EDITION' : 'THE-ART-OF-PRICE-EN-EDITION');
  meta.push('SKU: <b>' + displaySku + '</b>');
  if (order) meta.push(T.order + ': <b>' + order + '</b>');
  document.getElementById('meta').innerHTML = meta.join(' &nbsp;&middot;&nbsp; ');

  /* purchase event: once per order */
  if (ok){
    var key = 'aop_purchase_' + (order || displaySku), seen = false;
    try { seen = localStorage.getItem(key) === '1'; localStorage.setItem(key, '1'); } catch(e){}
    if (!seen){
      var price = (prod && (prod.displayPrice || prod.price)) || 999;
      var p = {
        transaction_id: order || ('ORD-' + Date.now()),
        currency: 'INR',
        value: price,
        sku: displaySku,
        language: lang,
        items: [{ item_id: displaySku, item_name: prod ? prod.name : 'The Art of Price', item_variant: lang, price: price, quantity: 1 }]
      };
      try { (window.dataLayer = window.dataLayer || []).push({ event: 'purchase', aop: p }); } catch(e){}
      try { if (typeof window.gtag === 'function') window.gtag('event', 'purchase', p); } catch(e){}
      try { if (typeof window.fbq === 'function') window.fbq('track', 'Purchase', { content_name: prod ? prod.name : 'The Art of Price', content_ids: [displaySku], content_type: 'product', value: price, currency: 'INR' }); } catch(e){}
    }
  }
})();
</script>
</body>
</html>
